ces for updating package versions?", "a": [{"k": "li", "t": "Update versions before publishing,"}, {"k": "li", "t": "Follow a consistent versioning policy,"}, {"k": "li", "t": "Document changes,"}, {"k": "li", "t": "Communicate breaking changes clearly."}, {"k": "li", "t": "Automate version updates in pipelines when possible."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 10, "q": "How can you handle breaking changes in a versioning strategy?", "a": [{"k": "li", "t": "Increment the MAJOR version in SemVer, document breaking changes in release notes, and communicate impacts to consumers."}, {"k": "li", "t": "In CalVer, document breaking changes in changelogs since the version number alone doesn’t indicate compatibility."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 1, "q": "What are pipeline artifacts in Azure DevOps and GitHub Actions?", "a": [{"k": "p", "t": "Pipeline artifacts are files or packages produced by CI/CD builds and stored for use in later stages (e.g., deployment, testing) or for sharing across jobs or pipelines."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 2, "q": "Why is it important to version pipeline artifacts?", "a": [{"k": "p", "t": "Versioning ensures traceability, reproducibility, and prevents conflicts or accidental overwrites. It allows teams to identify which build or commit produced a given artifact."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 3, "q": "How do you set a version for a pipeline artifact in Azure DevOps?", "a": [{"k": "p", "t": "Define a variable (e.g., $(Build.BuildNumber) or custom SemVer/CalVer) and use it as the artifact’s name or version in PublishPipelineArtifact or PublishBuildArtifacts tasks."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 4, "q": "How do you version artifacts in GitHub Actions?", "a": [{"k": "p", "t": "Set a version tag using"}, {"k": "li", "t": "environment variables,"}, {"k": "li", "t": "Git commit SHA,"}, {"k": "li", "t": "or tags, and include it in the artifact name when using the actions/upload-artifact action."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 5, "q": "What strategies can you use for artifact versioning (e.g., SemVer, build number, commit SHA)?", "a": [{"k": "p", "t": "Common strategies:"}, {"k": "li", "t": "SemVer: Aligns with application/package version"}, {"k": "li", "t": "Build number: Unique CI/CD pipeline run"}, {"k": "li", "t": "Commit SHA: Direct link to source version"}, {"k": "li", "t": "CalVer: Date-based versioning"}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 6, "q": "How do you ensure traceability between artifacts and source code versions?", "a": [{"k": "p", "t": "Include commit SHA, build number, or version info in the artifact metadata or name. Store artifact metadata with references to build and source details."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 7, "q": "How can you automate artifact versioning in a CI/CD pipeline?", "a": [{"k": "p", "t": "Use"}, {"k": "li", "t": "pipeline variables,"}, {"k": "li", "t": "scripts,"}, {"k": "li", "t": "or tasks to generate and assign a version to artifacts automatically during build or release."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 8, "q": "How do you store and retrieve versioned artifacts in Azure Pipelines?", "a": [{"k": "p", "t": "Artifacts are published to Azure DevOps (Artifacts > Pipeline Artifacts/Build Artifacts). Use DownloadPipelineArtifact or DownloadBuildArtifacts tasks with the specified version or build number."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 9, "q": "How do you promote or consume specific versions of pipeline artifacts?", "a": [{"k": "p", "t": "Reference the desired artifact version in pipeline tasks or release stages using"}, {"k": "li", "t": "tags,"}, {"k": "li", "t": "build numbers,"}, {"k": "li", "t": "or metadata. Promotion may involve moving artifacts to a separate feed or environment."}]}, {"sub": "2.3.4", "st": "Version Pipeline Artifacts", "n": 10, "q": "What are best practices for artifact retention and cleanup?", "a": [{"k": "p", "t": "Configure retention policies"}, {"k": "li", "t": "to automatically delete old or unused artifacts,"}, {"k": "li", "t": "keep only recent or released versions,"}, {"k": "li", "t": "and prevent storage bloat."}, {"k": "li", "t": "Document retention settngs for compliance."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 1, "q": "What are quality gates and release gates in Azure Pipelines?", "a": [{"k": "p", "t": "Quality gates and release gates are automated checks within Azure Pipelines that block progression of builds or releases until specified conditions are met."}, {"k": "li", "t": "Quality gates run during the build (e.g., code coverage, test pass rate),"}, {"k": "li", "t": "while release gates execute before or after deployment stages (e.g., approvals, external service checks)."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 2, "q": "How do you configure a quality gate in a pipeline?", "a": [{"k": "p", "t": "Define checks or conditions (e.g., code coverage threshold, static analysis results) in the pipeline YAML or classic editor. In YAML, use the condition atribute for steps, or specify required checks in branch policies for PR validation."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 3, "q": "What types of policies or checks are commonly used as gates?", "a": [{"k": "p", "t": "Common gates include:"}, {"k": "li", "t": "Code coverage thresholds"}, {"k": "li", "t": "Static code analysis (SAST)"}, {"k": "li", "t": "Open-source dependency scanning (SCA)"}, {"k": "li", "t": "Linting"}, {"k": "li", "t": "Required manual approvals"}, {"k": "li", "t": "Work item linking"}, {"k": "li", "t": "Deployment health checks"}, {"k": "li", "t": "External service integrations (e.g., SonarCloud)"}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 4, "q": "How do you implement security scanning (e.g., SCA, SAST) as a pipeline gate?", "a": [{"k": "p", "t": "Add tasks for security scanning tools (e.g., SonarCloudPrepare, Trivy, OWASP Dependency-Check) in the pipeline. Configure the tool to fail the build or block the release if vulnerabilities or policy violations are detected."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 5, "q": "How do you enforce governance and compliance requirements in a release pipeline?", "a": [{"k": "li", "t": "Use environment checks and approvals,"}, {"k": "li", "t": "integrate mandatory gate tasks (e.g., approval steps, sign-off requirements),"}, {"k": "li", "t": "and ensure artifacts and deployments meet compliance criteria before advancing to production."}, {"k": "li", "t": "Configure auditing and tracking via Azure Pipelines environments and release history."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 6, "q": "What is an approval gate and how is it set up?", "a": [{"k": "p", "t": "An approval gate requires one or more authorized users to approve deployment before the pipeline can proceed. Configure this in the Azure Pipeline environment or stage by adding manual approval checks and specifying approvers in the pipeline settngs."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 7, "q": "How can you integrate external tools (e.g., SonarCloud, WhiteSource, Checkmarx) as gates?", "a": [{"k": "p", "t": "Add marketplace tasks or custom scripts for the tool to your pipeline. Use the tool’s exit codes or results to determine pass/fail status. For gated releases, configure an environment check using the tool’s REST API or output."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 8, "q": "What happens when a gate fails during a release?", "a": [{"k": "p", "t": "If a gate fails, the pipeline halts at that stage. No further deployments occur until the issue is resolved and the gate is re-evaluated or manually overridden (if permited)."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 9, "q": "How do you audit and report on gate results for compliance?", "a": [{"k": "p", "t": "Gate results are logged in the pipeline run history and environment checks. Use"}, {"k": "li", "t": "Azure DevOps audit logs,"}, {"k": "li", "t": "downloadable run logs,"}, {"k": "li", "t": "and built-in reporting features to demonstrate compliance during audits."}]}, {"sub": "3.1.1", "st": "Quality/release gates (security, governance)", "n": 10, "q": "What are best practices for designing effective release and quality gates?", "a": [{"k": "p", "t": "Use automated gates for security, quality, and compliance."}, {"k": "li", "t": "Avoid overloading pipelines with too many manual approvals."}, {"k": "li", "t": "Regularly review and update gate criteria to match evolving requirements."}, {"k": "li", "t": "Integrate external scanning tools natively."}, {"k": "li", "t": "Ensure gate failures produce clear, actionable feedback."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 1, "q": "What are the differences between unit, integration, and load tests?", "a": [{"k": "li", "t": "Unit tests validate isolated code units and run quickly without external dependencies."}, {"k": "li", "t": "Integration tests verify interactions between multiple components or services."}, {"k": "li", "t": "Load tests simulate real-world traffic or usage to assess performance and stability under stress."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 2, "q": "How do you structure pipelines to run unit, integration, and load tests efficiently?", "a": [{"k": "li", "t": "Run unit tests early and in parallel on every commit."}, {"k": "li", "t": "Integration tests run after builds or deployments to test environments."}, {"k": "li", "t": "Load tests typically run in dedicated stages after integration tests or before production deployments to avoid resource conflicts."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 3, "q": "How do you configure test tasks in Azure Pipelines or GitHub Actions?", "a": [{"k": "p", "t": "Use built-in tasks (e.g., VsTest, DotNetCoreCLI@2, PublishTestResults@2) in Azure Pipelines, or actions like actions/setup-dotnet, actions/upload-artifact in GitHub Actions. Specify test commands and result formats in YAML steps."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 4, "q": "How are test results collected and visualized in Azure DevOps?", "a": [{"k": "p", "t": "Publish test results using the PublishTestResults task. Results appear in the Azure Pipelines Test tab with detailed logs, failure summaries, and trends across runs."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 5, "q": "What are best practices for running unit tests in CI/CD pipelines?", "a": [{"k": "p", "t": "Run all unit tests on every push and pull request. Ensure tests are isolated and fast. Fail the build if any unit test fails. Use code coverage tools to track and enforce minimum coverage levels."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 6, "q": "How do you isolate and manage dependencies for integration tests?", "a": [{"k": "li", "t": "Use dedicated test environments, containers, or service virtualization to replicate production."}, {"k": "li", "t": "Mock or stub external systems as needed."}, {"k": "li", "t": "Clean up data after each test run to avoid cross-test interference."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 7, "q": "How do you implement load testing in a pipeline?", "a": [{"k": "p", "t": "Integrate load testing tools (e.g., Azure Load Testing, JMeter, k6) into dedicated pipeline stages. Configure thresholds for performance metrics, and fail the pipeline if critical metrics (latency, errors) exceed limits."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 8, "q": "What tools are commonly used for each test type in Azure DevOps?", "a": [{"k": "li", "t": "Unit: MSTest, NUnit, xUnit, Jest, pytest"}, {"k": "li", "t": "Integration: Postman, REST Assured, SpecFlow, TestContainers"}, {"k": "li", "t": "Load: Azure Load Testing, Apache JMeter, k6, Artillery"}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 9, "q": "How do you handle test failures in pipelines?", "a": [{"k": "p", "t": "Fail the pipeline stage when critical tests fail."}, {"k": "li", "t": "Configure alerts and notifications."}, {"k": "li", "t": "Optionally, collect logs and artifacts for debugging."}, {"k": "li", "t": "Triage failures quickly to maintain build quality."}]}, {"sub": "3.1.2", "st": "Testing Strategy: Unit, Integration, Load", "n": 10, "q": "How do you ensure code coverage thresholds are enforced during testing?", "a": [{"k": "li", "t": "Use code coverage tools (e.g., Coverlet, JaCoCo, Istanbul) in the pipeline."}, {"k": "li", "t": "Set minimum coverage thresholds in pipeline definitions; fail the build if coverage falls below."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 1, "q": "What is the role of build/release agents in running pipeline tests?", "a": [{"k": "p", "t": "Agents are the compute resources (VMs, containers, or hosted runners) that execute pipeline tasks, including building code, running tests, and publishing test results."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 2, "q": "How do you select and configure agents for test execution?", "a": [{"k": "li", "t": "Choose agents based on OS, toolchain, and resource needs (e.g., MS-hosted vs. self-hosted)."}, {"k": "li", "t": "Configure agent pools in Azure DevOps or runners in GitHub Actions."}, {"k": "li", "t": "Set demands and capabilities in pipeline YAML or settngs."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 3, "q": "How are test tasks integrated in Azure Pipelines and GitHub Actions?", "a": [{"k": "p", "t": "Add built-in or custom test tasks (e.g., VsTest, DotNetCoreCLI, PublishTestResults) in Azure Pipelines YAML. In GitHub Actions, use setup and test actions, then upload results as artifacts."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 4, "q": "How do you publish and visualize test results in Azure DevOps?", "a": [{"k": "p", "t": "Use the PublishTestResults@2 task to upload results in supported formats (JUnit, TRX). View test summaries, trends, and individual failure logs in the Azure Pipelines Test tab."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 5, "q": "How do you handle parallel test execution across agents?", "a": [{"k": "li", "t": "Enable parallel jobs and test splittng in pipeline settngs."}, {"k": "li", "t": "Divide test suites by assemblies or test categories to distribute them across multiple agents, reducing total execution time."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 6, "q": "What formats are supported for test result files?", "a": [{"k": "p", "t": "Common supported formats include JUnit, TRX, NUnit, and xUnit XML. Use these formats to ensure results are properly parsed and displayed in Azure DevOps or GitHub Actions."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 7, "q": "How do you troubleshoot test execution issues on agents?", "a": [{"k": "li", "t": "Review pipeline logs, agent diagnostic output, and test result files."}, {"k": "li", "t": "Check for missing dependencies, incorrect paths, or environment mismatches."}, {"k": "li", "t": "Use agent diagnostic commands as needed."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 8, "q": "How do you aggregate test results from multiple jobs or agents?", "a": [{"k": "p", "t": "Publish all test result files to the pipeline using the PublishTestResults task with the mergeTestResults option enabled. Azure DevOps will consolidate results for reporting."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 9, "q": "How are flaky tests managed and reported in pipelines?", "a": [{"k": "p", "t": "Flag flaky tests using test frameworks or pipeline annotations. Azure DevOps Test tab can highlight inconsistent tests. Regularly review and quarantine or fix unreliable tests."}]}, {"sub": "3.1.3", "st": "Tests in pipelines: agents, result integration", "n": 10, "q": "What best practices ensure reliable test result integration in CI/CD?", "a": [{"k": "li", "t": "Standardize test result formats."}, {"k": "li", "t": "Always publish results (even on failure)."}, {"k": "li", "t": "Isolate tests for reproducibility."}, {"k": "li", "t": "Review integration logs after each run."}, {"k": "li", "t": "Clean up environment between runs to avoid residue affecting results."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 1, "q": "What is code coverage and why is it important in DevOps pipelines?", "a": [{"k": "p", "t": "Code coverage measures the percentage of source code executed by tests. It helps identify untested code, drives higher quality, and ensures changes are properly validated before deployment."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 2, "q": "How do you collect code coverage in Azure Pipelines?", "a": [{"k": "p", "t": "Add code coverage arguments to test commands (e.g., /p:CollectCoverage=true for .NET). Use tasks like PublishCodeCoverageResults@1 to collect and upload coverage data for reporting."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 3, "q": "What tools are commonly used for code coverage in .NET, Java, and JavaScript projects?", "a": [{"k": "li", "t": ".NET: Coverlet, Visual Studio Code Coverage"}, {"k": "li", "t": "Java: JaCoCo, Cobertura"}, {"k": "li", "t": "JavaScript: Istanbul (nyc), Jest"}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 4, "q": "How do you publish and visualize code coverage reports in Azure DevOps?", "a": [{"k": "p", "t": "Use the PublishCodeCoverageResults task with supported formats (Cobertura, JaCoCo). Results are visualized in the pipeline summary and the Code Coverage tab for detailed breakdowns."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 5, "q": "How do you enforce code coverage thresholds in a pipeline?", "a": [{"k": "p", "t": "Configure coverage tools to fail the build if coverage drops below a set threshold (e.g., using Coverlet’s -- threshold option). Add these checks in pipeline YAML to enforce quality gates."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 6, "q": "How do you integrate code coverage analysis in GitHub Actions?", "a": [{"k": "p", "t": "Add coverage tools to your workflow steps, generate a coverage report, and use actions (like codecov/codecov-action or coverallsapp/github-action) to upload results. Display coverage summary as a status check or comment."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 7, "q": "What are best practices for interpreting code coverage metrics?", "a": [{"k": "li", "t": "Focus on critical code paths and business logic."}, {"k": "li", "t": "High coverage does not guarantee quality; also review test depth and effectiveness."}, {"k": "li", "t": "Investigate and reduce untested or unreachable code."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 8, "q": "How do you handle code coverage for integration and UI tests?", "a": [{"k": "li", "t": "Instrument the application for integration/UI tests so coverage is measured across components."}, {"k": "li", "t": "Merge results from multiple test types for comprehensive reporting."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 9, "q": "How do you troubleshoot missing or incomplete code coverage data?", "a": [{"k": "li", "t": "Check test configuration and coverage tool integration."}, {"k": "li", "t": "Ensure correct file paths and formats."}, {"k": "li", "t": "Confirm that instrumented code is being executed and that reports are properly published."}]}, {"sub": "3.1.4", "st": "Code coverage analysis", "n": 10, "q": "How should teams use code coverage data to improve code quality?", "a": [{"k": "li", "t": "Regularly review coverage trends."}, {"k": "li", "t": "Address gaps in high-risk or critical areas."}, {"k": "li", "t": "Use coverage as one input for quality, not as the only gate."}, {"k": "li", "t": "Prioritize meaningful tests over achieving arbitrary coverage targets."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 1, "q": "What are the primary differences between GitHub Actions and Azure Pipelines?", "a": [{"k": "li", "t": "GitHub Actions is natively integrated with GitHub, focused on repository-centric automation using workflow files in the repo."}, {"k": "li", "t": "Azure Pipelines is part of Azure DevOps, supports multi-repo, project-level pipelines, offers both YAML and classic UI, and is more feature-rich for complex enterprise scenarios."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 2, "q": "How do you create and structure a workflow in GitHub Actions?", "a": [{"k": "p", "t": "Create a YAML file in .github/workflows/. Define name, on (trigger), jobs, and each job’s runs-on and steps. Each step specifies actions or shell commands."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 3, "q": "How do you define and configure pipelines using YAML in Azure Pipelines?", "a": [{"k": "p", "t": "Create azure-pipelines.yml at the repo root. Define trigger, pool, variables, stages, jobs, and steps. YAML is used to declaratively describe the pipeline structure and logic."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 4, "q": "What triggers can start workflows in GitHub Actions and Azure Pipelines?", "a": [{"k": "li", "t": "GitHub Actions: push, pull_request, schedule, workflow_dispatch (manual), environment events."}, {"k": "li", "t": "Azure Pipelines: trigger (CI on commit), pr, schedule, pipeline (other pipelines), and manual runs."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 5, "q": "How do you use runners (GitHub) and agents (Azure) in automation pipelines?", "a": [{"k": "li", "t": "GitHub Actions uses hosted or self-hosted runners defined in runs-on."}, {"k": "li", "t": "Azure Pipelines uses Microsoft-hosted or self-hosted agents set in the pool definition."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 6, "q": "How do you securely manage secrets and variables in both tools?", "a": [{"k": "li", "t": "GitHub Actions: Store secrets via Repository Settings > Secrets and reference as ${{ secrets.NAME }}."}, {"k": "li", "t": "Azure Pipelines: Store secrets in Variable Groups and reference as $(NAME) in YAML."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 7, "q": "How do you implement environment deployments and approvals?", "a": [{"k": "li", "t": "GitHub Actions: Define environments in workflows, set protection rules and required reviewers."}, {"k": "li", "t": "Azure Pipelines: Use environments with approvals and checks; configure in the Environments tab and reference in YAML with environment."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 8, "q": "How do you integrate testing and code quality gates in automation pipelines?", "a": [{"k": "li", "t": "GitHub Actions: Add test jobs/steps using testing actions; configure status checks to enforce passing tests before merging."}, {"k": "li", "t": "Azure Pipelines:"}, {"k": "li", "t": "Add test tasks,"}, {"k": "li", "t": "publish test results,"}, {"k": "li", "t": "set Quality Gates with policies or extensions (e.g., SonarQube)."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 9, "q": "What are best practices for job dependencies and parallel execution?", "a": [{"k": "li", "t": "GitHub Actions: Define job dependencies with needs: and run jobs in parallel by default unless dependencies are set."}, {"k": "li", "t": "Azure Pipelines: Use dependsOn for controlling order; jobs and stages run in parallel unless dependencies are specified."}]}, {"sub": "3.2.1", "st": "Automation tools: GitHub Actions, Azure Pipelines", "n": 10, "q": "How do you monitor and troubleshoot workflow and pipeline executions?", "a": [{"k": "li", "t": "GitHub Actions: o Review logs in the Actions tab o Inspect individual job/step output o Use run: echo for debugging."}, {"k": "li", "t": "Azure Pipelines: o Use the Runs/Logs UI o Download logs o Enable diagnostics o Check task-level error output for troubleshooting"}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 1, "q": "What are the types of runners/agents available in GitHub Actions and Azure Pipelines?", "a": [{"k": "li", "t": "GitHub Actions: GitHub-hosted runners and self-hosted runners."}, {"k": "li", "t": "Azure Pipelines: Microsoft-hosted agents and self-hosted agents."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 2, "q": "What are the main cost considerations when selecting hosted vs. self-hosted runners/agents?", "a": [{"k": "p", "t": "Hosted runners/agents are billed per minute beyond free quotas; self-hosted options reduce per-minute costs but require you to provide and maintain the infrastructure."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 3, "q": "How do you select the right agent pool or runner for your workload?", "a": [{"k": "p", "t": "Choose hosted for ease and standard workloads; select self-hosted for custom requirements, legacy dependencies, higher performance, or cost control."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 4, "q": "How do you configure a self-hosted runner in GitHub Actions?", "a": [{"k": "p", "t": "Go to repo or org settings → Actions → Runners → Add runner → Download and configure agent as instructed, then start the service on the target machine."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 5, "q": "How do you configure a self-hosted agent in Azure Pipelines?", "a": [{"k": "p", "t": "Go to Project Settings → Agent pools → Add pool/agent → Download the agent package, run the config script, and register with a PAT (Personal Access Token)."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 6, "q": "What connectivity requirements must self-hosted runners/agents meet?", "a": [{"k": "li", "t": "They must have outbound internet access to GitHub/Azure endpoints"}, {"k": "li", "t": "Access to required build/test/deploy resources"}, {"k": "li", "t": "Any specific firewall/proxy settngs applied."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 7, "q": "What licensing requirements exist for runners/agents?", "a": [{"k": "li", "t": "GitHub-hosted runners are covered by GitHub billing. Self-hosted require appropriate OS and third-party software licenses."}, {"k": "li", "t": "Azure-hosted agents are included in Azure DevOps plans; self-hosted agents require you to license the host OS/software."}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 8, "q": "How do you secure access to self-hosted runners/agents?", "a": [{"k": "li", "t": "Restrict network exposure"}, {"k": "li", "t": "Run with minimum required permissions"}, {"k": "li", "t": "Use firewalls"}, {"k": "li", "t": "Keep systems patched"}, {"k": "li", "t": "Store credentials/secrets securely"}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 9, "q": "How can you scale runners/agents for parallel job execution?", "a": [{"k": "li", "t": "Increase the number of runners/agents"}, {"k": "li", "t": "Use autoscaling solutions"}, {"k": "li", "t": "Configure jobs/pipelines to utilize available capacity"}]}, {"sub": "3.2.2", "st": "Runner/agent infra: cost, licenses, connectivity", "n": 10, "q": "How do you monitor and maintain runner/agent health?", "a": [{"k": "li", "t": "Monitor via GitHub/Azure DevOps UI"}, {"k": "li", "t": "Use logs and alerts"}, {"k": "li", "t": "Automate updates/patches"}, {"k": "li", "t": "Routinely validate connectivity and system performance"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 1, "q": "What are the prerequisites for integrating GitHub repositories with Azure Pipelines?", "a": [{"k": "li", "t": "An Azure DevOps organization and project"}, {"k": "li", "t": "A GitHub repository (personal or organization)"}, {"k": "li", "t": "Sufficient permissions on both platforms (repo admin or owner, Azure Pipelines Contributor)"}, {"k": "li", "t": "Azure Pipelines app authorized in GitHub (installed as needed)"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 2, "q": "How do you connect a GitHub repository to an Azure Pipeline?", "a": [{"k": "li", "t": "In Azure DevOps, create a new pipeline"}, {"k": "li", "t": "Choose GitHub as the code source"}, {"k": "li", "t": "Authorize Azure Pipelines to access your GitHub account"}, {"k": "li", "t": "Select the repository and configure the pipeline (YAML or classic editor)"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 3, "q": "What authentication methods are supported for GitHub-Azure Pipelines integration?", "a": [{"k": "li", "t": "OAuth via Azure Pipelines GitHub App (recommended)"}, {"k": "li", "t": "Personal Access Token (PAT) for classic connections"}, {"k": "li", "t": "GitHub Apps for organization-wide integration"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 4, "q": "How do you configure pipeline triggers for GitHub repository events?", "a": [{"k": "li", "t": "In the YAML pipeline file, use the trigger: keyword for branch updates and pr: for pull requests"}, {"k": "li", "t": "Example: trigger: branches: include: - main pr: branches: include: - main"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 5, "q": "How do you set up build validation for GitHub pull requests in Azure Pipelines?", "a": [{"k": "li", "t": "Enable branch protection in GitHub"}, {"k": "li", "t": "Add Azure Pipelines as a required status check for PRs"}, {"k": "li", "t": "Configure the pipeline to run on pull requests using the pr: trigger in YAML"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 6, "q": "How can you use YAML pipelines with GitHub repositories?", "a": [{"k": "li", "t": "Place an azure-pipelines.yml file in the root of the GitHub repo"}, {"k": "li", "t": "Configure the pipeline in Azure DevOps to use this YAML file"}, {"k": "li", "t": "Updates to the YAML file in GitHub automatically update the pipeline definition"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 7, "q": "What permissions are required for Azure Pipelines to access a GitHub repository?", "a": [{"k": "li", "t": "Repo-level access for the Azure Pipelines app"}, {"k": "li", "t": "At minimum, read code and read/write for status checks"}, {"k": "li", "t": "Admin access may be needed for initial setup and webhook management"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 8, "q": "How are service connections managed and secured for GitHub integration?", "a": [{"k": "li", "t": "Use the Azure Pipelines GitHub App for secure, managed integration"}, {"k": "li", "t": "Service connections are created in Project Settings > Service connections"}, {"k": "li", "t": "Use least privilege and restrict access to pipelines needing the connection"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 9, "q": "What are best practices for handling secrets in GitHub-Azure Pipelines workflows?", "a": [{"k": "li", "t": "Store secrets in Azure Pipelines variable groups or GitHub Secrets"}, {"k": "li", "t": "Reference secrets in pipeline YAML using secure variables"}, {"k": "li", "t": "Never hard-code secrets in repository or pipeline files"}]}, {"sub": "3.2.3", "st": "Integration of GitHub repos with Azure Pipelines", "n": 10, "q": "How do you monitor and troubleshoot integration issues between GitHub and Azure Pipelines?", "a": [{"k": "li", "t": "Review pipeline run logs and error messages in Azure DevOps"}, {"k": "li", "t": "Check GitHub repository “Actions” and “Security & analysis” tabs"}, {"k": "li", "t": "Validate webhooks and service connection health in Azure DevOps project settngs"}, {"k": "li", "t": "Check permission scopes and reauthorize the Azure Pipelines GitHub App if needed"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 1, "q": "What types of pipeline triggers are supported in Azure Pipelines?", "a": [{"k": "li", "t": "Continuous integration (CI) triggers"}, {"k": "li", "t": "Pull request (PR) triggers"}, {"k": "li", "t": "Scheduled triggers (cron)"}, {"k": "li", "t": "Pipeline triggers (triggered by another pipeline)"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 2, "q": "How do you define continuous integration (CI) and pull request (PR) triggers in YAML?", "a": [{"k": "p", "t": "Use the trigger and pr keys with properly indented branches: trigger: branches: include: - main - develop pr: branches: include: - main - develop"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 3, "q": "How do you disable or override triggers for specific branches or paths?", "a": [{"k": "p", "t": "Set trigger: none or use exclude: under branches. trigger: none"}, {"k": "p", "t": "trigger: branches: exclude: - experimental"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 4, "q": "What is the purpose of paths and paths-ignore in triggers?", "a": [{"k": "li", "t": "paths: Run pipeline only when files matching the paterns are changed"}, {"k": "li", "t": "paths-ignore: Ignore runs if only files matching these paterns are changed trigger: branches: include: - main paths: include: - src/** paths-ignore: - docs/**"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 5, "q": "How do you set up scheduled (cron) triggers in a YAML pipeline?", "a": [{"k": "p", "t": "Use the schedules key: schedules: - cron: \"0 0 * * 1\" displayName: \"Weekly build\" branches: include: - main always: true"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 6, "q": "How do you structure multi-stage YAML pipelines?", "a": [{"k": "p", "t": "Use the stages key to define multiple stages, each with its own jobs. stages: - stage: Build jobs: - job: BuildJob steps: - script: echo Building - stage: Deploy jobs: - job: DeployJob steps: - script: echo Deploying"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 7, "q": "What are jobs and how do you define them in YAML?", "a": [{"k": "p", "t": "Jobs are collections of steps run on agents. Define under jobs. jobs: - job: TestJob steps: - script: echo Running tests"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 8, "q": "How do you configure job dependencies and execution order?", "a": [{"k": "p", "t": "Use the dependsOn keyword. By default, jobs run in parallel unless dependencies are set. jobs: - job: Build steps: - script: echo Build - job: Test dependsOn: Build steps: - script: echo Test"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 9, "q": "How do you run jobs in parallel or sequentially?", "a": [{"k": "li", "t": "Jobs run in parallel by default"}, {"k": "li", "t": "Use dependsOn to run jobs sequentially"}, {"k": "li", "t": "No dependsOn means jobs start together"}]}, {"sub": "3.2.4", "st": "Pipeline triggers, YAML usage, job execution", "n": 10, "q": "What are key best practices for reliable job execution in Azure Pipelines YAML?", "a": [{"k": "li", "t": "Use clear job/stage names"}, {"k": "li", "t": "Define explicit dependencies with dependsOn"}, {"k": "li", "t": "Isolate steps to minimize side effects"}, {"k": "li", "t": "Use variables and templates for reusability"}, {"k": "li", "t": "Monitor pipeline runs for failures and flaky jobs"}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 1, "q": "What is a hybrid pipeline and when should it be used?", "a": [{"k": "p", "t": "A hybrid pipeline uses both Microsoft-hosted and self-hosted agents within the same pipeline to leverage cloud scalability and custom environments. Use it when some tasks require custom tooling, dependencies, or access to private resources not available on Microsoft-hosted agents."}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 2, "q": "How do you configure a pipeline to run on both Microsoft-hosted and self-hosted agents?", "a": [{"k": "p", "t": "Define separate jobs or stages in your YAML pipeline, specifying pool: Default (self-hosted) or pool: vmImage: 'ubuntu-latest' (Microsoft-hosted) for each job. Example: jobs: - job: Build pool: vmImage: 'ubuntu-latest' - job: CustomTask pool: name: Default"}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 3, "q": "What are the core considerations when settng up self-hosted agents in Azure Pipelines?", "a": [{"k": "p", "t": "Ensure agents meet system requirements, have required network access, correct permissions, are kept secure, updated, and registered to the right agent pool. Monitor agent health and load for capacity planning."}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 4, "q": "How do you secure and update self-hosted agents?", "a": [{"k": "li", "t": "Run agents as a non-admin user"}, {"k": "li", "t": "Restrict network access"}, {"k": "li", "t": "Install security updates and agent updates promptly"}, {"k": "li", "t": "Protect agent keys"}, {"k": "li", "t": "Use firewalls/endpoint protection"}, {"k": "li", "t": "Regularly audit and rotate agent authentication tokens"}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 5, "q": "What are the benefits and drawbacks of self-hosted agents vs. Microsoft-hosted agents?", "a": [{"k": "p", "t": "Self-hosted agents:"}, {"k": "li", "t": "Full control over software/tools, network, and environment"}, {"k": "li", "t": "Can access private resources"}, {"k": "li", "t": "Require maintenance, security, scaling, and cost management Microsoft-hosted agents:"}, {"k": "li", "t": "Fully managed, always updated, no maintenance"}, {"k": "li", "t": "Scales automatically"}, {"k": "li", "t": "Limited customizations, no persistent state, no access to private on-prem resources"}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 6, "q": "How do you use VM templates in pipeline agent pools?", "a": [{"k": "p", "t": "Create a preconfigured VM image (template) with required tools and software. Use this template to automatically provision new VMs as agents (e.g., with Azure Scale Set agent pools), ensuring consistent environments and fast scaling."}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 7, "q": "What are the main steps to register a new self-hosted agent?", "a": [{"k": "li", "t": "Download the agent package from Azure DevOps."}, {"k": "li", "t": "Extract the files."}, {"k": "li", "t": "Run the config script (e.g., config.cmd or config.sh), provide server URL, authentication token (PAT), and select agent pool/name."}, {"k": "li", "t": "Start the agent interactively or as a service/daemon."}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 8, "q": "How do you configure hybrid jobs across multiple agent types in a single pipeline YAML?", "a": [{"k": "li", "t": "In YAML, define multiple jobs, each with its own pool property."}, {"k": "li", "t": "Example: jobs: - job: linuxBuild pool: vmImage: 'ubuntu-latest' - job: customJob pool: name: MySelfHostedPool"}, {"k": "li", "t": "This enables one pipeline to use both Microsoft-hosted and self-hosted agents."}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 9, "q": "What are the key troubleshooting steps if a self-hosted agent fails to run jobs?", "a": [{"k": "li", "t": "Confirm agent is online and showing as “Available” in Azure DevOps."}, {"k": "li", "t": "Check agent logs for errors."}, {"k": "li", "t": "Verify agent machine connectivity to Azure DevOps (outbound HTTPS 443)."}, {"k": "li", "t": "Ensure authentication tokens are valid and not expired."}, {"k": "li", "t": "Confirm permissions for agent pool and job steps."}, {"k": "li", "t": "Validate required software/dependencies are installed."}]}, {"sub": "3.3.1", "st": "Hybrid pipelines, self-hosted agents, VM templates", "n": 10, "q": "How do you ensure scalability and availability of self-hosted agents in enterprise scenarios?", "a": [{"k": "li", "t": "Use Azure Virtual Machine Scale Set (VMSS) agent pools for auto-scaling."}, {"k": "li", "t": "Deploy agents across multiple regions or availability zones."}, {"k": "li", "t": "Monitor agent utilization and automate provisioning/de-provisioning."}, {"k": "li", "t": "Set up health checks and automated recovery for failed agents."}, {"k": "li", "t": "Maintain backup agents to handle load spikes."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 1, "q": "What are YAML templates in Azure Pipelines, and why use them?", "a": [{"k": "p", "t": "YAML templates are reusable pipeline definitions that allow you to define pipeline logic once and include it in multiple pipelines. They promote DRY principles and consistency across builds and releases."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 2, "q": "How do you create and include a template in a pipeline YAML file?", "a": [{"k": "p", "t": "Define the template in a separate YAML file (e.g., template.yml). Include it in your pipeline using the template keyword: - template: template.yml Parameters can be passed if defined."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 3, "q": "What is a task group, and how is it different from a YAML template?", "a": [{"k": "p", "t": "A task group is a saved set of tasks from classic (visual designer) pipelines, reusable in multiple pipelines via the UI. YAML templates are code-based and used in YAML pipelines for reusability and version control."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 4, "q": "What are variable groups, and how are they used in Azure Pipelines?", "a": [{"k": "p", "t": "Variable groups store and manage values (e.g., connection strings, secrets) shared across pipelines. They centralize variables for reuse and easier updates."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 5, "q": "How do you reference variable groups in YAML pipelines?", "a": [{"k": "p", "t": "Use the variables block and the group keyword: variables: - group: MyVariableGroup This makes the group’s variables available in the pipeline."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 6, "q": "How can you pass parameters to YAML templates?", "a": [{"k": "p", "t": "Define parameters in the template using the parameters block. Pass values when including the template: - template: template.yml parameters: name: value"}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 7, "q": "What is the best practice for sharing templates across multiple pipelines or repos?", "a": [{"k": "p", "t": "Store templates in a central repository, reference them via repository resources, and use versioning or branch references for control."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 8, "q": "How do you manage secrets with variable groups?", "a": [{"k": "p", "t": "Mark variables as “secret” in the variable group. Access secrets in pipelines but they are masked in logs and not exposed to scripts by default."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 9, "q": "How do you use conditions and expressions within YAML templates?", "a": [{"k": "p", "t": "Templates and steps can use condition and expressions (e.g., eq(variables['Build.SourceBranch'], 'refs/heads/main')) to control execution based on pipeline context or parameters."}]}, {"sub": "3.3.2", "st": "Reusable elements: YAML templates, task/variable groups", "n": 10, "q": "What are common pitfalls or limitations when using reusable pipeline elements?", "a": [{"k": "p", "t": "Common issues:"}, {"k": "li", "t": "Parameter type mismatches"}, {"k": "li", "t": "Circular template references"}, {"k": "li", "t": "Scope/visibility problems with variable groups"}, {"k": "li", "t": "Inability to use task groups in YAML pipelines (YAML and task groups are separate)"}, {"k": "li", "t": "Secret variables not available to all steps by default"}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 1, "q": "What are environment checks in Azure Pipelines YAML?", "a": [{"k": "p", "t": "Environment checks are policies (such as approvals, service health, or business rules) that must pass before a deployment can proceed to a given environment."}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 2, "q": "How do you configure approvals for a deployment environment in YAML?", "a": [{"k": "p", "t": "Define the environment in the deployment job and set up approvals in the Azure DevOps portal under Pipelines > Environments. Approvals are not specified directly in YAML."}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 3, "q": "What types of checks can be enforced in an environment?", "a": [{"k": "p", "t": "Common checks include:"}, {"k": "li", "t": "Manual approvals"}, {"k": "li", "t": "Azure Function or REST API checks"}, {"k": "li", "t": "Business rule validations"}, {"k": "li", "t": "Service health checks"}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 4, "q": "How do you reference and use environments in YAML pipelines?", "a": [{"k": "p", "t": "Use the environment: keyword in a deployment job: environment: 'staging' This triggers checks and approvals configured for that environment."}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 5, "q": "How do manual approvals work in multi-stage pipelines?", "a": [{"k": "p", "t": "The pipeline pauses at the environment check until designated users approve. Only after approval does the deployment job execute."}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 6, "q": "How can you restrict deployments to specific environments?", "a": [{"k": "p", "t": "Limit access using environment security settngs in Azure DevOps, specifying who can deploy and approve to each environment."}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 7, "q": "How do you require multiple approvers for an environment?", "a": [{"k": "p", "t": "In the Azure DevOps portal, add multiple users or groups to the approval list for the environment. You can set whether all or just one must approve."}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 8, "q": "What are best practices for designing approval workflows in YAML?", "a": [{"k": "li", "t": "Use environment approvals for production/staging"}, {"k": "li", "t": "Limit approvers to relevant stakeholders"}, {"k": "li", "t": "Combine automated and manual checks"}, {"k": "li", "t": "Regularly review and update approver lists"}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 9, "q": "What limitations or pitfalls exist with environment checks and approvals?", "a": [{"k": "li", "t": "Approval policies must be managed in the portal, not in YAML"}, {"k": "li", "t": "Delays if approvers are unavailable"}, {"k": "li", "t": "Lack of fine-grained conditional logic for approvals"}, {"k": "li", "t": "Inability to automate some business rules fully"}]}, {"sub": "3.3.3", "st": "Checks and approvals with YAML environments", "n": 10, "q": "How do you audit or monitor approval history for environments?", "a": [{"k": "p", "t": "View approval history and audit logs in the Azure DevOps portal under the environment’s \"History\" tab. This includes who approved, when, and comments if provided."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 1, "q": "What is blue-green deployment and when should it be used?", "a": [{"k": "p", "t": "Blue-green deployment runs two identical production environments (\"blue\" and \"green\"). Traffic switches from blue to green after validation, minimizing downtime and risk. Use when you require near- zero downtime and easy rollback."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 2, "q": "What is canary deployment and what problem does it solve?", "a": [{"k": "p", "t": "Canary deployment releases new changes to a small subset of users first. It mitigates risk by exposing only a fraction of traffic to new changes. If issues are detected, rollback is quick and impact is limited."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 3, "q": "What is a ring deployment in Azure DevOps?", "a": [{"k": "p", "t": "A ring deployment rolls out releases in controlled stages (\"rings\"), each representing a user or environment group. Inner rings (e.g., internal users) get updates first, followed by broader rings (e.g., all users). This enables staged rollout and feedback at each step."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 4, "q": "How does progressive exposure differ from blue-green and canary deployments?", "a": [{"k": "p", "t": "Progressive exposure gradually increases the percentage of users exposed to a new release based on real-time feedback. Unlike blue-green (all at once) and canary (fixed groups), exposure is dynamically adjusted, allowing rapid rollback or pause if issues occur."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 5, "q": "What is A/B testing in deployment strategies?", "a": [{"k": "p", "t": "A/B testing directs user segments to different application versions simultaneously (A vs. B) to compare behavior or feature impact. It's used to evaluate new features or UI changes by analyzing real user metrics before full rollout."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 6, "q": "How do you minimize downtime using blue-green deployment in Azure?", "a": [{"k": "p", "t": "Deploy to the \"green\" slot/environment, validate, then use Azure Traffic Manager or App Service swap to instantly redirect production traffic. This ensures seamless cutover with minimal or no downtime."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 7, "q": "How can Azure DevOps Pipelines implement canary releases?", "a": [{"k": "p", "t": "Use deployment jobs and environment approvals to release to a small subset of instances or users first. Gradually increase scope by adding stages that deploy to more targets as health checks pass."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 8, "q": "What are best practices for monitoring during a canary or ring deployment?", "a": [{"k": "li", "t": "Enable detailed telemetry and alerts (e.g., Application Insights)."}, {"k": "li", "t": "Monitor error rates, latency, and user experience in real-time."}, {"k": "li", "t": "Automate rollback if metrics exceed defined thresholds."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 9, "q": "How do feature flags support progressive exposure and A/B testing?", "a": [{"k": "p", "t": "Feature flags allow you to enable or disable features for specific users or groups without redeploying code. They control exposure dynamically, supporting gradual rollout (progressive exposure) or randomized experiments (A/B testing)."}]}, {"sub": "3.4.1", "st": "Blue green, canary, ring, progressive exposure, A/B", "n": 10, "q": "What are the rollback strategies for blue-green and canary deployments?", "a": [{"k": "p", "t": "For blue-green, switch traffic back to the previous environment. For canary, halt rollout and reroute all users to the stable version, removing problematic instances from the canary group."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 1, "q": "What is an ordered dependency deployment?", "a": [{"k": "p", "t": "It is a deployment sequence that ensures components are deployed in a specific order based on their dependencies, such as deploying a database before the application that uses it."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 2, "q": "Why are ordered deployments important in multi-tier applications?", "a": [{"k": "p", "t": "They prevent runtime errors by ensuring lower-level components (e.g., databases, APIs) are ready before dependent components (e.g., web apps) are deployed."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 3, "q": "How can you enforce deployment order in Azure DevOps pipelines?", "a": [{"k": "p", "t": "Define multiple stages in YAML, using the dependsOn keyword to control execution order. Each stage deploys one component; later stages run only after dependencies succeed."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 4, "q": "How do pipeline stages and dependencies work in YAML pipelines?", "a": [{"k": "p", "t": "Stages can be explicitly ordered using dependsOn. A stage will only start after its dependencies have completed successfully, ensuring proper deployment sequence."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 5, "q": "What are artifact dependencies and how do they affect deployment order?", "a": [{"k": "p", "t": "Artifact dependencies link pipeline outputs (e.g., builds) to deployments. A deployment waits for required artifacts to be published by earlier stages, enforcing correct order."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 6, "q": "How can environment approvals enforce ordered deployment?", "a": [{"k": "p", "t": "You can require manual or automated approvals on environments. A later environment or stage won’t proceed until prior deployments are approved, adding an extra control layer for order."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 7, "q": "What’s the risk of ignoring dependency order in deployments?", "a": [{"k": "p", "t": "If components are deployed out of order, dependencies may be missing or incompatible, causing application errors, failed deployments, or downtime."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 8, "q": "How can you handle rollback if a downstream dependency fails?", "a": [{"k": "p", "t": "Automate rollback by defining pipeline tasks that revert all affected components to their previous stable versions if any dependent deployment fails."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 9, "q": "How do you automate database and application deployment order?", "a": [{"k": "p", "t": "In your pipeline YAML, create separate stages for the database and application. Set the application stage to dependsOn the database stage, ensuring the database is deployed and verified first."}]}, {"sub": "3.4.2", "st": "Ordered dependency deployments", "n": 10, "q": "What tools or tasks in Azure Pipelines help manage ordered deployments?", "a": [{"k": "p", "t": "Azure Pipelines provides"}, {"k": "li", "t": "YAML stages,"}, {"k": "li", "t": "dependsOn,"}, {"k": "li", "t": "classic Release pipeline environments,"}, {"k": "li", "t": "deployment jobs,"}, {"k": "li", "t": "approvals,"}, {"k": "li", "t": "gates,"}, {"k": "li", "t": "and artifact dependencies to control and enforce deployment order."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 1, "q": "What is a VIP swap and when should it be used in Azure deployments?", "a": [{"k": "p", "t": "A VIP (Virtual IP) swap exchanges the public IP addresses of two Azure cloud service deployments (usually staging and production) instantly. It should be used to promote a pre-warmed, validated deployment to production with minimal downtime."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 2, "q": "How do deployment slots help minimize downtime in Azure App Service?", "a": [{"k": "p", "t": "Deployment slots allow you to host multiple app versions (e.g., staging, production) on the same App Service. You deploy to a staging slot, validate, then swap to production, ensuring fast cutover and rollback with minimal disruption."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 3, "q": "What is a rolling deployment and how is it executed in Azure?", "a": [{"k": "p", "t": "A rolling deployment updates subsets of instances incrementally, removing a portion from the load balancer, updating it, then proceeding to the next subset. In Azure, rolling deployments can be managed using Virtual Machine Scale Sets or Kubernetes for controlled, phased rollouts."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 4, "q": "Compare the benefits and limitations of VIP swap versus rolling deployment.", "a": [{"k": "li", "t": "VIP swap: Near-instant cutover, easy rollback, but both environments must be identical."}, {"k": "li", "t": "Rolling deployment: Gradual updates, reduced risk of mass failure, allows monitoring during rollout, but may introduce temporary state inconsistencies and slightly longer total deployment time."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 5, "q": "How do you perform a slot swap in Azure Pipelines?", "a": [{"k": "p", "t": "Add an \"Azure App Service deploy\" task, specify the target deployment slot (e.g., staging), then use the \"Swap Slots\" action to exchange staging and production after validation. This can be automated with Azure CLI or built-in pipeline tasks."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 6, "q": "What considerations are required for zero-downtime deployments in multi-instance environments?", "a": [{"k": "p", "t": "Ensure at least one instance is always available by updating instances incrementally, using health probes, and configuring load balancers to direct traffic only to healthy, updated instances. Maintain session state externally to prevent user disruption."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 7, "q": "How do health checks affect rolling deployments and slot swaps?", "a": [{"k": "p", "t": "Health checks ensure only healthy instances receive traffic during and after deployment. In rolling deployments, unhealthy instances are removed from rotation. For slot swaps, pre-swap validation uses health probes to confirm readiness before traffic is switched."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 8, "q": "What are common pitfalls to avoid when minimizing downtime during deployment?", "a": [{"k": "li", "t": "Skipping health checks"}, {"k": "li", "t": "Deploying breaking schema changes without backward compatibility"}, {"k": "li", "t": "Not externalizing session state"}, {"k": "li", "t": "Failing to test slot settngs or configuration differences"}, {"k": "li", "t": "Insufficient monitoring during rollout"}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 9, "q": "How do you roll back safely after a failed slot swap or rolling deployment?", "a": [{"k": "p", "t": "For slot swaps, immediately swap back to the previous slot. For rolling deployments, stop the rollout and redeploy the previous stable version to affected instances. Always validate state and configuration before rollback."}]}, {"sub": "3.4.3", "st": "Minimize downtime: VIP swap, rolling, slots", "n": 10, "q": "What best practices ensure minimal user impact during production deployments using these strategies?", "a": [{"k": "li", "t": "Use staging slots and swap only after validation"}, {"k": "li", "t": "Deploy during low-traffic periods"}, {"k": "li", "t": "Implement incremental rollout with monitoring and automated rollback"}, {"k": "li", "t": "Externalize state/session management"}, {"k": "li", "t": "Automate health checks and alerts"}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 1, "q": "What is a hotfix and when should it be used in a DevOps context?", "a": [{"k": "p", "t": "A hotfix is an urgent, targeted code or configuration change deployed to resolve critical issues in production. Use a hotfix when immediate correction is needed to restore functionality or security."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 2, "q": "How do you implement a hotfix deployment process in Azure DevOps or GitHub Actions?", "a": [{"k": "li", "t": "Create a hotfix branch from the production or main branch."}, {"k": "li", "t": "Apply and test the fix."}, {"k": "li", "t": "Use your CI/CD pipeline to deploy directly to production or a hotfix slot."}, {"k": "li", "t": "Merge the hotfix back into main and other relevant branches."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 3, "q": "What strategies enable rapid hotfix deployment with minimal risk?", "a": [{"k": "li", "t": "Maintain a streamlined hotfix pipeline with minimal validation steps."}, {"k": "li", "t": "Use automated tests focused on affected areas."}, {"k": "li", "t": "Deploy via slots or canary/rolling deployments for quick rollback."}, {"k": "li", "t": "Isolate hotfix changes from feature development."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 4, "q": "How do you separate hotfix and feature releases in your pipeline?", "a": [{"k": "li", "t": "Use branching strategies (e.g., dedicated hotfix branches)."}, {"k": "li", "t": "Tag or label pipeline runs as hotfix or feature."}, {"k": "li", "t": "Configure CI/CD to allow independent release of hotfixes to production without waiting for feature branch merges."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 5, "q": "What are the best practices for rolling back a failed hotfix?", "a": [{"k": "li", "t": "Immediately redeploy the previous stable release using pipeline history, slot swap, or rollback tasks."}, {"k": "li", "t": "Validate system state and data consistency."}, {"k": "li", "t": "Communicate status and root cause to stakeholders."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 6, "q": "How do you ensure pipeline and deployment resiliency against failures?", "a": [{"k": "li", "t": "Use automated health checks after deployment steps."}, {"k": "li", "t": "Implement retry logic for transient errors."}, {"k": "li", "t": "Use deployment slots, rolling updates, or blue-green strategies."}, {"k": "li", "t": "Monitor pipeline health and enforce gates/approvals."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 7, "q": "What mechanisms can automate detection and recovery from failed deployments?", "a": [{"k": "li", "t": "Configure alerts and automated rollbacks in CI/CD pipelines."}, {"k": "li", "t": "Use Azure Monitor or Application Insights to detect failures."}, {"k": "li", "t": "Employ pipeline conditions to trigger redeployment or revert actions automatically."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 8, "q": "How can you design pipelines to support high availability and quick recovery?", "a": [{"k": "li", "t": "Use multi-region or multi-zone deployments."}, {"k": "li", "t": "Keep standby or backup instances updated."}, {"k": "li", "t": "Automate failover and rollback procedures."}, {"k": "li", "t": "Test disaster recovery regularly."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 9, "q": "What tools and features help with monitoring and alerting for deployment issues?", "a": [{"k": "li", "t": "Azure Monitor, Log Analytics, and Application Insights for real-time monitoring and alerts."}, {"k": "li", "t": "Service Health and Resource Health for Azure infrastructure monitoring."}, {"k": "li", "t": "GitHub Actions and Azure DevOps built-in notification and alert integrations."}]}, {"sub": "3.4.4", "st": "Hotfix and resiliency planning", "n": 10, "q": "What are key considerations for maintaining compliance and auditability during hotfixes and recovery actions?", "a": [{"k": "li", "t": "Enforce approvals and access controls for hotfix branches and deployments."}, {"k": "li", "t": "Maintain detailed logs and change history for all hotfixes."}, {"k": "li", "t": "Document root cause and recovery steps for every incident."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 1, "q": "What are feature flags and why are they used in DevOps?", "a": [{"k": "p", "t": "Feature flags are switches in application code to enable or disable features at runtime. They allow teams to release code to production safely, test in production, perform gradual rollouts, and roll back features instantly without redeployment."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 2, "q": "What is Azure App Configuration and how does it support feature management?", "a": [{"k": "p", "t": "Azure App Configuration is a centralized service for application settngs and feature flags. Its Feature Management capability allows dynamic creation, updating, and targeting of feature flags for apps at scale, decoupling feature rollout from code releases."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 3, "q": "How do you create and manage feature flags in Azure App Configuration?", "a": [{"k": "p", "t": "Feature flags are created and managed in the Azure portal under App Configuration > Feature Manager. Flags can be enabled, disabled, or targeted, and settngs are available via client libraries or REST API."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 4, "q": "How do you enable or disable a feature flag at runtime without redeploying code?", "a": [{"k": "p", "t": "Change the flag’s state in Azure App Configuration. The application, using the Feature Management SDK, will check for flag changes at runtime (polling or refresh interval) and update behavior instantly, without requiring a redeployment."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 5, "q": "What is the Feature Manager library and how is it used in .NET applications?", "a": [{"k": "p", "t": "The Microsoft.FeatureManagement library is a .NET SDK that integrates with Azure App Configuration. Add and configure it in your app to query and evaluate feature flags dynamically using dependency injection, middleware, or atributes."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 6, "q": "How can feature flags be targeted for specific users or environments?", "a": [{"k": "p", "t": "Azure App Configuration supports filters (e.g., user targeting, time windows, percentage rollout). Configure these filters in Feature Manager to enable features for selected users, groups, or environments based on context."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 7, "q": "How do you implement feature flag evaluation in Azure DevOps pipelines?", "a": [{"k": "p", "t": "Use the Azure App Configuration task in Azure Pipelines to retrieve flag values as pipeline variables. This allows pipeline stages, jobs, or tasks to conditionally execute based on the flag state in App Configuration."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 8, "q": "What are best practices for rolling out and rolling back features using flags?", "a": [{"k": "li", "t": "Use gradual exposure (percentage rollout, user targeting),"}, {"k": "li", "t": "monitor impact,"}, {"k": "li", "t": "and have clear rollback procedures."}, {"k": "li", "t": "Remove obsolete flags quickly to avoid technical debt and keep the configuration clean."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 9, "q": "How can feature flag usage be audited and monitored?", "a": [{"k": "p", "t": "Audit changes using Azure Activity Logs and App Configuration revision history. Monitor feature usage and application impact using Application Insights or custom telemetry tied to flag evaluation points."}]}, {"sub": "3.5.1", "st": "Feature Flags with Azure App Configuration", "n": 10, "q": "What are the risks or anti-paterns when using feature flags in production?", "a": [{"k": "p", "t": "Common risks include"}, {"k": "li", "t": "flag overload,"}, {"k": "li", "t": "leaving dead flags,"}, {"k": "li", "t": "inconsistent flag states across services,"}, {"k": "li", "t": "and insufficient monitoring. These can lead to increased complexity, technical debt, and production issues if not managed properly."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 1, "q": "What are the main deployment options for containers in Azure DevOps?", "a": [{"k": "p", "t": "You can deploy containers to"}, {"k": "li", "t": "Azure Kubernetes Service (AKS),"}, {"k": "li", "t": "Azure Container Instances,"}, {"k": "li", "t": "Azure App Service for Containers,"}, {"k": "li", "t": "or custom environments using built-in Azure DevOps tasks and service connections."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 2, "q": "How do you deploy Docker containers to Azure Kubernetes Service (AKS) using a pipeline?", "a": [{"k": "p", "t": "Use Azure Pipelines tasks: build and push image with Docker or Azure CLI, then use the KubernetesManifest or kubectl task to apply Kubernetes manifests and deploy to AKS."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 3, "q": "How do you publish and deploy application binaries using Azure Pipelines?", "a": [{"k": "p", "t": "Build binaries using build tasks, publish them as pipeline artifacts, then deploy using tasks like AzureWebApp or AzureFileCopy or custom script tasks to the desired target."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 4, "q": "What are the typical steps to deploy a script-based application in Azure DevOps?", "a": [{"k": "p", "t": "Store scripts in source control, reference them in pipeline YAML or classic release, use tasks like Bash PowerShell or Command Line to execute scripts, and manage outputs or errors accordingly."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 5, "q": "How can deployment scripts be securely managed and executed in pipelines?", "a": [{"k": "p", "t": "Store scripts in versioned source control. Store secrets/credentials in secure pipeline variables or Azure Key Vault. Never hard-code secrets in scripts; access them via secure variables or Key Vault references."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 6, "q": "What tasks are available for deploying to Azure Web Apps from Azure DevOps?", "a": [{"k": "li", "t": "AzureWebApp task for code or binaries"}, {"k": "li", "t": "AzureWebAppContainer for Docker images"}, {"k": "li", "t": "Azure App Service Deploy for deployment slots and multi-phase scenarios"}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 7, "q": "How do you automate image versioning and tagging during container deployment?", "a": [{"k": "p", "t": "In your pipeline,"}, {"k": "li", "t": "use build IDs,"}, {"k": "li", "t": "commit hashes,"}, {"k": "li", "t": "or semantic versioning in the Docker tag step. Automate tagging in the Docker or Azure CLI tasks before pushing images to a registry."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 8, "q": "What is the difference between classic and YAML-based deployment pipelines for these scenarios?", "a": [{"k": "li", "t": "YAML pipelines provide pipeline-as-code, versioning, templates, and beter reuse."}, {"k": "li", "t": "Classic pipelines are GUI-based, less portable, and harder to manage for complex deployments."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 9, "q": "How do you handle rollback for failed deployments of containers, binaries, or scripts?", "a": [{"k": "p", "t": "Use pipeline stages to deploy to slots or canary environments. For containers, roll back by redeploying a previous image tag. For scripts/binaries, restore prior artifacts or use automated pipeline rollback steps."}]}, {"sub": "3.5.2", "st": "Deploy containers, binaries, scripts", "n": 10, "q": "What are best practices for monitoring and validating deployments?", "a": [{"k": "li", "t": "Enable deployment logs,"}, {"k": "li", "t": "configure health probes,"}, {"k": "li", "t": "set up Application Insights,"}, {"k": "li", "t": "and use release gates or post-deployment tests to validate success before full rollout."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 1, "q": "What are the main methods for deploying database changes in Azure DevOps pipelines?", "a": [{"k": "li", "t": "Use built-in Azure SQL Database Deployment tasks,"}, {"k": "li", "t": "SQL scripts,"}, {"k": "li", "t": "DACPAC deployment,"}, {"k": "li", "t": "third-party tools (e.g., Redgate),"}, {"k": "li", "t": "or custom scripts. The most common approaches are DACPAC and SQL script execution."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 2, "q": "How do you configure and use the Azure SQL Database Deployment task?", "a": [{"k": "p", "t": "Add the \"Azure SQL Database Deployment\" task to your pipeline, specify the Azure service connection, target server/database, authentication, and select deployment type (DACPAC, SQL script). Set necessary parameters like SQL user/password or managed identity."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 3, "q": "What are the best practices for database schema migrations in CI/CD?", "a": [{"k": "li", "t": "Version control all database changes,"}, {"k": "li", "t": "use incremental scripts or migration frameworks,"}, {"k": "li", "t": "validate in lower environments,"}, {"k": "li", "t": "run automated tests post-deployment,"}, {"k": "li", "t": "use idempotent scripts,"}, {"k": "li", "t": "and ensure deployment steps are repeatable."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 4, "q": "How do you manage rollback and recovery for failed database deployments?", "a": [{"k": "li", "t": "Implement automated database backups before deployment,"}, {"k": "li", "t": "use transaction blocks in scripts,"}, {"k": "li", "t": "maintain rollback scripts,"}, {"k": "li", "t": "and configure point-in-time restore for Azure SQL. For DACPAC, keep previous versions for re-deployment."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 5, "q": "What security considerations must be addressed for database deployments in pipelines?", "a": [{"k": "li", "t": "Store credentials securely (Azure Key Vault, pipeline secrets),"}, {"k": "li", "t": "use managed identities or service principals,"}, {"k": "li", "t": "restrict permissions to least privilege,"}, {"k": "li", "t": "and audit all deployment activities."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 6, "q": "How do you automate database deployments using DACPACs?", "a": [{"k": "p", "t": "Build the DACPAC artifact from source, publish it as a pipeline artifact, and deploy using the \"Azure SQL Database Deployment\" task with the DACPAC file, specifying connection and deployment options."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 7, "q": "How can you validate and test database changes before deployment?", "a": [{"k": "li", "t": "Run schema validation tasks,"}, {"k": "li", "t": "execute unit and integration tests against a staging database,"}, {"k": "li", "t": "and use automated smoke tests post-deployment. Use tools like tSQLt or SQL Server Data Tools (SSDT) for validation."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 8, "q": "What tools are commonly integrated for database deployments in Azure Pipelines?", "a": [{"k": "li", "t": "Azure SQL Database Deployment task,"}, {"k": "li", "t": "SQL Server Data Tools (SSDT),"}, {"k": "li", "t": "Redgate SQL Change Automation,"}, {"k": "li", "t": "custom PowerShell or Bash scripts,"}, {"k": "li", "t": "and Azure Key Vault for secrets management."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 9, "q": "How do you handle environment-specific database settngs during deployment?", "a": [{"k": "li", "t": "Use pipeline variables/groups,"}, {"k": "li", "t": "parameterize scripts or DACPAC publish profiles,"}, {"k": "li", "t": "and maintain separate configuration files or ARM templates per environment."}]}, {"sub": "3.5.3", "st": "Database Task Deployments", "n": 10, "q": "How do you use release gates or approvals for database deployment steps?", "a": [{"k": "li", "t": "Configure pipeline environments with manual approval checks,"}, {"k": "li", "t": "set up release gates based on monitoring/alerts or pre/post-deployment conditions,"}, {"k": "li", "t": "and require authorized personnel to approve before production deployments."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 1, "q": "What are configuration management tools, and why are they important in DevOps pipelines?", "a": [{"k": "p", "t": "Tools that automate"}, {"k": "li", "t": "the deployment,"}, {"k": "li", "t": "configuration,"}, {"k": "li", "t": "and maintenance of infrastructure and applications. They ensure"}, {"k": "li", "t": "consistency,"}, {"k": "li", "t": "repeatability,"}, {"k": "li", "t": "and compliance across environments."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 2, "q": "Which configuration management tools are commonly used with Azure DevOps?", "a": [{"k": "p", "t": "Ansible, Chef, Puppet, PowerShell DSC, and SaltStack. Azure-native tools include Azure Automation State Configuration and Azure Automanage."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 3, "q": "How do you integrate tools like Ansible, Chef, or Puppet into Azure Pipelines?", "a": [{"k": "p", "t": "Use marketplace tasks or custom scripts within pipeline steps. Install tool dependencies, authenticate to targets, and invoke playbooks/manifests/recipes as pipeline tasks."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 4, "q": "What are best practices for managing application configuration in CI/CD?", "a": [{"k": "li", "t": "Store configuration as code,"}, {"k": "li", "t": "use source control,"}, {"k": "li", "t": "parameterize settngs,"}, {"k": "li", "t": "avoid hardcoding secrets,"}, {"k": "li", "t": "validate changes in lower environments,"}, {"k": "li", "t": "and document configuration decisions."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 5, "q": "How do you secure sensitive configuration data in deployment pipelines?", "a": [{"k": "li", "t": "Use Azure Key Vault or pipeline secret var
