iables,"}, {"k": "li", "t": "avoid storing secrets in code or repositories,"}, {"k": "li", "t": "restrict access to secrets,"}, {"k": "li", "t": "and audit secret usage in pipeline logs."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 6, "q": "What is Infrastructure as Code (IaC), and how does it relate to configuration management?", "a": [{"k": "li", "t": "IaC is managing infrastructure (servers, networks, etc.) using code and automation."}, {"k": "li", "t": "Configuration management ensures resources are provisioned & configured to desired state."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 7, "q": "How can you automate configuration drift detection and remediation?", "a": [{"k": "p", "t": "Use tools like Azure Automation State Configuration, PowerShell DSC, or monitoring solutions to regularly check for drift and automatically reapply the desired state if differences are detected."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 8, "q": "How do you handle configuration for different environments (dev, test, prod)?", "a": [{"k": "p", "t": "Use environment-specific parameter files, variable groups, or templates. Separate configuration data from code, and apply correct settngs via pipeline variables at deployment time."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 9, "q": "What Azure-native configuration management options exist?", "a": [{"k": "p", "t": "Azure Automation State Configuration (DSC), Azure Automanage, Azure App Configuration, and Azure Policy for enforcing compliance."}]}, {"sub": "3.5.4", "st": "Configuration Management Tools & Strategies", "n": 10, "q": "How do you monitor and audit configuration changes across environments?", "a": [{"k": "p", "t": "Enable activity logs and change tracking (Azure Monitor, Log Analytics), use version control for configuration code, and review audit trails for pipeline and resource changes."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 1, "q": "What is Infrastructure as Code (IaC) and why is it important in DevOps?", "a": [{"k": "li", "t": "IaC is the practice of managing and provisioning infrastructure using code files, enabling automation, repeatability, and consistency."}, {"k": "li", "t": "It eliminates manual configuration drift and supports rapid, reliable delivery."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 2, "q": "What are the key principles of a successful IaC strategy?", "a": [{"k": "p", "t": "Key principles:"}, {"k": "li", "t": "version everything in source control,"}, {"k": "li", "t": "automate validation/deployment,"}, {"k": "li", "t": "use modular and reusable code,"}, {"k": "li", "t": "ensure idempotency,"}, {"k": "li", "t": "and follow DRY (Don't Repeat Yourself) practices."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 3, "q": "Which tools are commonly used for IaC in Azure and GitHub-based environments?", "a": [{"k": "p", "t": "Popular IaC tools:"}, {"k": "li", "t": "ARM Templates,"}, {"k": "li", "t": "Bicep,"}, {"k": "li", "t": "Terraform,"}, {"k": "li", "t": "Azure CLI,"}, {"k": "li", "t": "Azure PowerShell,"}, {"k": "li", "t": "and Ansible. For automation:"}, {"k": "li", "t": "Azure DevOps Pipelines"}, {"k": "li", "t": "and GitHub Actions."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 4, "q": "How should IaC code be managed in source control?", "a": [{"k": "li", "t": "Store all IaC code in a versioned repository (e.g., Git)."}, {"k": "li", "t": "Use branching strategies,"}, {"k": "li", "t": "enforce code reviews,"}, {"k": "li", "t": "enable traceability,"}, {"k": "li", "t": "and restrict direct changes to main branches."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 5, "q": "What are best practices for organizing IaC repositories?", "a": [{"k": "li", "t": "Structure repositories by environment, service, or module."}, {"k": "li", "t": "Use directories for dev, test, prod."}, {"k": "li", "t": "Keep sensitive values out of code and use templates/modules for reusability."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 6, "q": "How can you automate testing and validation of IaC before deployment?", "a": [{"k": "li", "t": "Set up pipeline stages to lint, syntax check, and validate templates."}, {"k": "li", "t": "Use test deployments in isolated environments before production rollout."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 7, "q": "What are the main automation options for deploying IaC in Azure DevOps and GitHub Actions?", "a": [{"k": "li", "t": "Use Azure Pipelines or GitHub Actions to trigger IaC deployments on push, PR, or schedule."}, {"k": "li", "t": "Integrate approvals, environment checks, and rollback mechanisms."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 8, "q": "How do you manage secrets and sensitive configuration in IaC automation?", "a": [{"k": "li", "t": "Store secrets in Azure Key Vault or GitHub Secrets."}, {"k": "li", "t": "Reference them securely in pipeline definitions."}, {"k": "li", "t": "Never hard-code secrets in source or IaC files."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 9, "q": "What are recommended practices for versioning and tracking changes in IaC?", "a": [{"k": "li", "t": "Tag releases,"}, {"k": "li", "t": "use PRs for change review,"}, {"k": "li", "t": "link commits to work items,"}, {"k": "li", "t": "and document change history."}, {"k": "li", "t": "Use versioned modules"}, {"k": "li", "t": "and maintain a clear changelog."}]}, {"sub": "3.6.1", "st": "Define IaC strategy: Source Control, Automation", "n": 10, "q": "How can you ensure repeatable and idempotent deployments with IaC?", "a": [{"k": "p", "t": "Write templates and scripts to be idempotent, meaning running them multiple times produces the same result. Use declarative syntax (e.g., Bicep, Terraform) and avoid manual post-deployment steps."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 1, "q": "What does “desired state” mean in Infrastructure as Code?", "a": [{"k": "p", "t": "It refers to defining the exact configuration of infrastructure resources that should exist. Tools apply this state declaratively, ensuring the environment matches the intended configuration automatically."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 2, "q": "What are the core differences between Bicep and ARM templates?", "a": [{"k": "p", "t": "Bicep is a simpler, declarative DSL that transpiles to ARM JSON templates. Bicep improves readability and authoring, while ARM is JSON-based, more verbose, and harder to maintain."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 3, "q": "How do you declare and deploy resources with Bicep?", "a": [{"k": "p", "t": "Write a .bicep file with resource blocks. Deploy using: az deployment group create --resource-group <rg> --template-file main.bicep"}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 4, "q": "How do you declare and deploy resources with ARM templates?", "a": [{"k": "p", "t": "Use a JSON file defining resources under resources array. Deploy using: az deployment group create --resource-group <rg> --template-file main.json"}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 5, "q": "What is Desired State Configuration (DSC) and when should you use it?", "a": [{"k": "p", "t": "DSC is a PowerShell-based tool to configure and enforce VM state (e.g., software installed, services running). Use it when managing OS-level configurations, not just Azure resources."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 6, "q": "How do you apply and monitor DSC on Azure virtual machines?", "a": [{"k": "p", "t": "Use Azure Automation DSC or Azure Automanage Machine Configuration. Onboard VMs, assign DSC configurations, and monitor compliance from the Azure portal."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 7, "q": "How can you use Bicep and ARM templates together?", "a": [{"k": "p", "t": "Bicep transpiles to ARM JSON for deployment. You can reference existing ARM templates in Bicep using module blocks or include Bicep files inside ARM with linked templates."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 8, "q": "What are best practices for parameterizing templates in Bicep and ARM?", "a": [{"k": "li", "t": "Use parameters for values like names, locations, and sizes."}, {"k": "li", "t": "Provide default values where safe."}, {"k": "li", "t": "Avoid hardcoding."}, {"k": "li", "t": "Use parameters.json files for reusable input sets."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 9, "q": "How do you validate and test Bicep or ARM templates before deployment?", "a": [{"k": "li", "t": "Use bicep build and bicep linter, or az deployment validate to catch errors early."}, {"k": "li", "t": "Run test deployments in non-prod environments to ensure correctness."}]}, {"sub": "3.6.2", "st": "Implement desired state: Bicep, ARM, DSC", "n": 10, "q": "What methods can you use for secure secrets management with Bicep, ARM, and DSC?", "a": [{"k": "li", "t": "Store secrets in Azure Key Vault."}, {"k": "li", "t": "Reference them using reference() or getSecret() in templates or variables."}, {"k": "li", "t": "Never embed secrets directly in the code or parameter files."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 1, "q": "What are Azure Deployment Environments and what use case do they solve?", "a": [{"k": "p", "t": "They provide on-demand, consistent environments (dev/test/staging) for developers using predefined IaC templates, reducing wait times and manual provisioning."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 2, "q": "How do Azure Deployment Environments support developer self-service?", "a": [{"k": "p", "t": "Developers can deploy approved templates directly from a portal or CLI without needing contributor rights on subscriptions or waiting for central IT provisioning."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 3, "q": "What are environment definitions and how are they created?", "a": [{"k": "p", "t": "They are IaC templates (Bicep or ARM) stored in Git repositories, defining the infrastructure for an environment. Created and managed via Azure portal or CLI."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 4, "q": "How do you configure projects and environments for team use?", "a": [{"k": "li", "t": "Admins create projects, link GitHub repos with definitions, and assign users or groups."}, {"k": "li", "t": "Developers then select and deploy environments under that project."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 5, "q": "How is access controlled in Azure Deployment Environments?", "a": [{"k": "p", "t": "Using Azure RBAC at the project level—roles like Environment User or Project Admin control who can deploy, manage, or view environments."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 6, "q": "What IaC tools are supported in environment definitions?", "a": [{"k": "p", "t": "Bicep and ARM templates are supported. Terraform is currently not supported directly within Azure Deployment Environments as of June 2025."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 7, "q": "How do environment templates integrate with source control?", "a": [{"k": "li", "t": "Templates are stored in GitHub (public or private repos)."}, {"k": "li", "t": "The system pulls definitions directly from branches specified during environment setup."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 8, "q": "How do you automate cleanup and lifecycle of deployment environments?", "a": [{"k": "p", "t": "Use environment expiration policies and lifecycle hooks (e.g., cleanup scripts) defined in the template or enforced via policy-as-code in Azure."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 9, "q": "How are cost controls and quotas applied to environments?", "a": [{"k": "li", "t": "Set resource quotas,"}, {"k": "li", "t": "tag policies,"}, {"k": "li", "t": "and auto-expiration on environments."}, {"k": "li", "t": "Azure Cost Management can be used to track and limit spend per environment."}]}, {"sub": "3.6.3", "st": "Azure Deployment Environments (Self-Deployment)", "n": 10, "q": "What are best practices for using Azure Deployment Environments in enterprise DevOps?", "a": [{"k": "li", "t": "Use centralized template governance,"}, {"k": "li", "t": "automate validation,"}, {"k": "li", "t": "enforce least-privilege RBAC,"}, {"k": "li", "t": "tag all resources,"}, {"k": "li", "t": "and integrate environment cleanup into CI/CD workflows."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 1, "q": "What tools in Azure DevOps and GitHub Actions are used to monitor pipeline failures and durations?", "a": [{"k": "li", "t": "Azure DevOps uses built-in Pipeline Run history, Analytics views, and Dashboards."}, {"k": "li", "t": "GitHub Actions provides Workflow Run history and summary views. Both support integration with Azure Monitor and Log Analytics."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 2, "q": "How do you configure pipeline run analytics and dashboards in Azure DevOps?", "a": [{"k": "p", "t": "Use Azure DevOps Analytics extension and built-in widgets to display pipeline duration, success rate, and failure trends on Dashboards. Configure custom queries in Analytics views for detailed tracking."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 3, "q": "What are the key metrics to track for pipeline health?", "a": [{"k": "li", "t": "Track pipeline failure rate,"}, {"k": "li", "t": "average and maximum run duration,"}, {"k": "li", "t": "time to fix failures,"}, {"k": "li", "t": "frequency of runs,"}, {"k": "li", "t": "and number of flaky tests or steps."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 4, "q": "How can alerts be set up for failed or long-running pipelines?", "a": [{"k": "li", "t": "In Azure DevOps, configure Alerts under Project Settings > Notifications for build or release failures and time thresholds."}, {"k": "li", "t": "In GitHub Actions, use workflow_dispatch or third-party integrations to trigger notifications for failures or delays."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 5, "q": "How do you investigate and troubleshoot failed pipeline runs?", "a": [{"k": "p", "t": "Review detailed run logs, error messages, and failed step outputs. Use build and release timeline views to identify where failures occur and correlate with recent changes or configuration updates."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 6, "q": "How can you identify flaky tests or unreliable steps in pipelines?", "a": [{"k": "p", "t": "Analyze test run history for intermitent failures. Use Azure DevOps Test Analytics or GitHub Actions Test Reporter to flag non-deterministic or frequently failing tests and steps."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 7, "q": "What practices improve visibility of pipeline duration trends?", "a": [{"k": "li", "t": "Regularly review analytics dashboards, set up charts for historical run times, and compare against baselines."}, {"k": "li", "t": "Visualize trends using built-in or Power BI dashboards."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 8, "q": "How do you optimize notification settngs for pipeline health?", "a": [{"k": "p", "t": "Configure notifications to target only relevant teams/users and filter on critical events like failures or abnormal durations. Avoid excessive notifications to reduce alert fatigue."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 9, "q": "What integrations support advanced monitoring (e.g., Azure Monitor, Log Analytics)?", "a": [{"k": "p", "t": "Connect Azure DevOps pipelines to Azure Monitor and Log Analytics using Diagnostic Settngs or REST APIs. Export pipeline metrics for advanced querying, alerting, and dashboarding."}]}, {"sub": "3.7.1", "st": "Monitor pipeline health (failures,duration)", "n": 10, "q": "How do you audit historical pipeline performance and failure trends?", "a": [{"k": "li", "t": "Use Azure DevOps Analytics views or Power BI to query and visualize pipeline history, identifying long-term trends in duration, failure rate, and reliability."}, {"k": "li", "t": "Archive logs for compliance audits if required."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 1, "q": "What strategies reduce pipeline execution costs in Azure DevOps and GitHub Actions?", "a": [{"k": "li", "t": "Use self-hosted agents for long-running jobs,"}, {"k": "li", "t": "choose lower-cost hosted agents,"}, {"k": "li", "t": "minimize unnecessary runs,"}, {"k": "li", "t": "and clean up unused artifacts and resources after builds."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 2, "q": "How do you minimize pipeline execution time?", "a": [{"k": "li", "t": "Enable parallel jobs,"}, {"k": "li", "t": "break pipelines into smaller stages,"}, {"k": "li", "t": "cache dependencies, run only required tests,"}, {"k": "li", "t": "and avoid redundant steps."}, {"k": "li", "t": "Trigger pipelines only on relevant changes."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 3, "q": "What approaches improve pipeline reliability?", "a": [{"k": "li", "t": "Implement retries for transient failures,"}, {"k": "li", "t": "use stable base images and tools,"}, {"k": "li", "t": "version dependencies,"}, {"k": "li", "t": "and separate critical and optional tasks."}, {"k": "li", "t": "Regularly review and update pipeline tasks."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 4, "q": "How can parallelism and agent management be used to optimize performance?", "a": [{"k": "li", "t": "Increase parallel jobs,"}, {"k": "li", "t": "use job dependencies to optimize order,"}, {"k": "li", "t": "distribute workloads across multiple agents,"}, {"k": "li", "t": "and use agent pools to avoid botlenecks."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 5, "q": "What best practices reduce resource consumption in pipelines?", "a": [{"k": "li", "t": "Remove unused tasks, artifacts, and images."}, {"k": "li", "t": "Use selective checkout,"}, {"k": "li", "t": "optimize scripts,"}, {"k": "li", "t": "and limit scope of triggered builds and tests to affected components."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 6, "q": "How do you cache dependencies to accelerate builds?", "a": [{"k": "p", "t": "Implement build and task caching (e.g., npm, pip, Maven cache tasks in Azure Pipelines or actions/cache in GitHub Actions) to avoid downloading/building unchanged dependencies."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 7, "q": "How do you monitor and control agent utilization?", "a": [{"k": "li", "t": "Track agent pool usage via Azure DevOps Analytics or GitHub Actions Insights."}, {"k": "li", "t": "Scale agents up or down as needed, and prioritize high-value jobs."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 8, "q": "What methods reduce wait times for pipeline approvals and manual interventions?", "a": [{"k": "li", "t": "Automate approvals where possible,"}, {"k": "li", "t": "use automatic triggers,"}, {"k": "li", "t": "set up environment checks,"}, {"k": "li", "t": "and streamline required manual steps to minimize human delays."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 9, "q": "How do you ensure pipelines are robust against transient infrastructure failures?", "a": [{"k": "li", "t": "Configure retry logic on failed steps,"}, {"k": "li", "t": "use resilient cloud infrastructure,"}, {"k": "li", "t": "and implement fallbacks or safe defaults for network- or resource-related errors."}]}, {"sub": "3.7.2", "st": "Optimize: Cost, Time, Reliability, Performance", "n": 10, "q": "How can pipeline task reuse and modularization improve efficiency?", "a": [{"k": "li", "t": "Use YAML templates, task groups, and reusable workflows to standardize common tasks,"}, {"k": "li", "t": "reduce duplication,"}, {"k": "li", "t": "and simplify maintenance across multiple pipelines."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 1, "q": "What is an artifact retention policy in Azure DevOps?", "a": [{"k": "p", "t": "A retention policy defines how long pipeline artifacts, logs, and test results are kept before being automatically deleted to manage storage usage."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 2, "q": "Where do you configure artifact retention in Azure Pipelines?", "a": [{"k": "p", "t": "Retention is configured under Project Settings → Pipelines → Retention, or directly in the pipeline YAML using retention under the pipeline block."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 3, "q": "What is the default retention policy for pipeline artifacts?", "a": [{"k": "p", "t": "The default policy retains artifacts for 30 days or 3 successful runs per branch, whichever is met last."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 4, "q": "How can you prevent a pipeline run's artifacts from being deleted?", "a": [{"k": "p", "t": "Mark the pipeline run as “retained” either manually via the UI or using az pipelines runs update --id <runId> -- retain true."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 5, "q": "How do retention policies differ between classic and YAML pipelines?", "a": [{"k": "p", "t": "Classic pipelines use UI-based retention rules; YAML pipelines can define retention directly in code, allowing more granular, version-controlled policies."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 6, "q": "How does pipeline retention impact storage costs and performance?", "a": [{"k": "p", "t": "Longer retention increases storage usage and cost; excessive artifact history may degrade performance in large-scale environments."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 7, "q": "What permissions are needed to modify retention settngs?", "a": [{"k": "p", "t": "You need at least Project Administrator or Build Administrator role to modify global retention settngs or mark runs for retention."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 8, "q": "How do retention settngs affect deployment history and auditability?", "a": [{"k": "p", "t": "Deleting artifacts or logs too early can break traceability and hinder auditing of what was deployed, when, and from which source."}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 9, "q": "How can you override global retention policies per pipeline?", "a": [{"k": "p", "t": "In YAML, set retention under the pipeline root, e.g.:"}, {"k": "p", "t": "retention: { daysToKeep: 10, minimumToKeep: 1, deleteBuildRecord: true }"}]}, {"sub": "3.7.3", "st": "Artifact retention strategy", "n": 10, "q": "What are best practices for implementing artifact retention strategies?", "a": [{"k": "li", "t": "Use shorter retention for high-frequency pipelines."}, {"k": "li", "t": "Retain longer for production deployments."}, {"k": "li", "t": "Mark important releases as retained."}, {"k": "li", "t": "Periodically audit unused runs."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 1, "q": "What are the key differences between Classic and YAML pipelines?", "a": [{"k": "li", "t": "Classic pipelines use a GUI for configuration"}, {"k": "li", "t": "YAML pipelines are defined as code, versioned with source, and support advanced features like templates and multi-stage workflows."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 2, "q": "Why should you migrate from Classic to YAML pipelines?", "a": [{"k": "li", "t": "YAML enables pipeline-as-code,"}, {"k": "li", "t": "beter version control,"}, {"k": "li", "t": "reuse with templates,"}, {"k": "li", "t": "portability,"}, {"k": "li", "t": "and full CI/CD traceability."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 3, "q": "How do you export a Classic pipeline to YAML?", "a": [{"k": "p", "t": "Go to the Classic pipeline → Edit → View YAML (only available for simple jobs) → Copy and manually refine. Complex flows require manual recreation."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 4, "q": "Which features in Classic pipelines require manual translation when migrating?", "a": [{"k": "p", "t": "Multi-agent jobs, deployment groups, task groups, approvals, and environment strategies often require re-implementation using YAML stages and environments."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 5, "q": "How can task groups be converted for YAML pipelines?", "a": [{"k": "p", "t": "Recreate task group logic as YAML templates, then reference with - template: path/to/template.yml in pipelines."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 6, "q": "What tools assist in converting Classic to YAML?", "a": [{"k": "p", "t": "There’s no full auto-converter; use “View YAML” for individual jobs, then rely on docs, pipeline schema references, and manual refactoring."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 7, "q": "What common issues arise when migrating triggers?", "a": [{"k": "p", "t": "Classic pipelines may use UI-based schedules or branch filters that must be manually defined in YAML using trigger and schedules."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 8, "q": "How do you structure multi-stage YAML pipelines?", "a": [{"k": "p", "t": "Use the stages keyword with each stage defining jobs and steps, enabling CI, CD, approvals, and environment separation in one file."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 9, "q": "What are best practices when migrating pipelines incrementally?", "a": [{"k": "li", "t": "Start with CI stages, validate output, then add CD stages."}, {"k": "li", "t": "Keep Classic as fallback until YAML proves stable."}, {"k": "li", "t": "Use templates for reuse."}]}, {"sub": "3.7.4", "st": "Migrate Classic to YAML", "n": 10, "q": "How do you validate that a migrated YAML pipeline matches original behavior?", "a": [{"k": "li", "t": "Compare build logs, test results, deployment targets, and approval flows side-by-side."}, {"k": "li", "t": "Use test branches to validate before cuttng over."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 1, "q": "What is a Service Principal in Azure and when should it be used?", "a": [{"k": "p", "t": "A Service Principal is an identity created for use"}, {"k": "li", "t": "with applications,"}, {"k": "li", "t": "hosted services,"}, {"k": "li", "t": "and automation tools to access Azure resources. Use it when you need an application or script to authenticate and operate independently of user context."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 2, "q": "What is a Managed Identity and what types are available?", "a": [{"k": "p", "t": "An automatically managed identity in Azure AD for Azure resources. Two types exist:"}, {"k": "li", "t": "system-assigned (tied to a single resource)"}, {"k": "li", "t": "and user-assigned (independent, reusable across resources)."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 3, "q": "What are the main differences between Service Principals and Managed Identities?", "a": [{"k": "li", "t": "Service Principals require manual credential management (client secrets or certificates) and can be used outside Azure."}, {"k": "li", "t": "Managed Identities have automatic credential rotation, no secret exposure, and only work within supported Azure services."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 4, "q": "In which scenarios is a Service Principal preferred over Managed Identity?", "a": [{"k": "p", "t": "Use a Service Principal"}, {"k": "li", "t": "when accessing Azure resources from outside Azure,"}, {"k": "li", "t": "in cross-cloud or on-premises scenarios,"}, {"k": "li", "t": "or when granular control over authentication lifecycle is required."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 5, "q": "When should you use a Managed Identity instead of a Service Principal?", "a": [{"k": "p", "t": "Use a Managed Identity when your workload runs entirely on Azure and needs secure, automated authentication to Azure resources—eliminating secret management."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 6, "q": "How are credentials managed for Service Principals versus Managed Identities?", "a": [{"k": "li", "t": "Service Principals require explicit secret/certificate creation, storage, and rotation."}, {"k": "li", "t": "Managed Identities handle credential mgmt. & rotation automatically, exposing no secrets."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 7, "q": "What are the security best practices for Service Principals?", "a": [{"k": "li", "t": "Use the least-privilege principle,"}, {"k": "li", "t": "regularly rotate secrets/certificates,"}, {"k": "li", "t": "use certificate-based authentication over client secrets,"}, {"k": "li", "t": "restrict access with conditional access policies,"}, {"k": "li", "t": "and store secrets in Azure Key Vault."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 8, "q": "What are the security advantages of Managed Identities?", "a": [{"k": "p", "t": "Managed Identities"}, {"k": "li", "t": "remove the need to handle credentials,"}, {"k": "li", "t": "provide automatic credential rotation,"}, {"k": "li", "t": "and limit exposure of secrets,"}, {"k": "li", "t": "reducing the risk of leaks or misuse."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 9, "q": "How do you grant permissions to a Service Principal and a Managed Identity?", "a": [{"k": "p", "t": "Assign the required Azure RBAC role to the Service Principal or Managed Identity at the correct scope (subscription, resource group, or resource level) via the Azure portal, CLI, or PowerShell."}]}, {"sub": "4.1.1", "st": "Choose: Service Principals, Managed Identity", "n": 10, "q": "What is the process to rotate credentials for Service Principals and Managed Identities?", "a": [{"k": "p", "t": "For Service Principals, manually update secrets or certificates and update applications to use the new credentials. For Managed Identities, Azure handles rotation automatically—no manual action required."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 1, "q": "What are the primary authentication methods available for GitHub automation?", "a": [{"k": "p", "t": "The main methods are"}, {"k": "li", "t": "GitHub Apps,"}, {"k": "li", "t": "personal access tokens (PATs),"}, {"k": "li", "t": "and the built-in GITHUB_TOKEN used by GitHub Actions."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 2, "q": "What is a GitHub App and when should it be used?", "a": [{"k": "p", "t": "A GitHub App is an integration with granular permissions, installed directly on repositories or organizations. Use it for automation, CI/CD, and integrations needing controlled, auditable access."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 3, "q": "What is a personal access token (PAT) and what is it used for?", "a": [{"k": "p", "t": "A PAT is a user-generated token that grants API access on behalf of a user. It is used for scripting, CLI tools, and third-party integrations where user-based access is needed."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 4, "q": "What is the GITHUB_TOKEN and how is it used in GitHub Actions?", "a": [{"k": "p", "t": "GITHUB_TOKEN is an automatically generated token available to workflows, scoped to the repository and job. It allows secure automation within Actions without manual secret handling."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 5, "q": "How do you control the permissions of a GitHub App versus a PAT?", "a": [{"k": "li", "t": "GitHub Apps have fine-grained, configurable permissions per repository and event."}, {"k": "li", "t": "PATs inherit the full or partial permissions of the user who created them."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 6, "q": "When should you use GITHUB_TOKEN instead of a PAT in GitHub Actions?", "a": [{"k": "p", "t": "Use GITHUB_TOKEN for most automation in Actions as it is automatically created, limited in scope, and auto-rotated—minimizing risk of credential leakage."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 7, "q": "How do you authenticate to GitHub in CI/CD pipelines securely?", "a": [{"k": "p", "t": "Use GITHUB_TOKEN for native Actions, GitHub App tokens for granular access, and store any PATs in encrypted secrets—never hardcode credentials."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 8, "q": "What are the risks associated with PATs and how can you mitigate them?", "a": [{"k": "p", "t": "PATs are long-lived and may have broad access if leaked."}, {"k": "li", "t": "Limit their scope,"}, {"k": "li", "t": "rotate regularly,"}, {"k": "li", "t": "use only when required,"}, {"k": "li", "t": "and store securely in GitHub Secrets."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 9, "q": "How do you revoke access for GitHub Apps, PATs, and GITHUB_TOKEN?", "a": [{"k": "li", "t": "Uninstall the GitHub App,"}, {"k": "li", "t": "delete or regenerate the PAT from user settngs,"}, {"k": "li", "t": "and GITHUB_TOKEN is invalidated automatically at job end."}]}, {"sub": "4.1.2", "st": "GitHub auth: Apps, tokens", "n": 10, "q": "What auditing capabilities exist for GitHub authentication methods?", "a": [{"k": "p", "t": "Audit"}, {"k": "li", "t": "logs track PAT usage,"}, {"k": "li", "t": "GitHub App installation and actions,"}, {"k": "li", "t": "and GITHUB_TOKEN workflow invocations. Review logs for unauthorized or unusual access."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 1, "q": "What is a service connection in Azure DevOps?", "a": [{"k": "p", "t": "A service connection is a secure configuration in Azure DevOps that enables pipelines to connect and authenticate with external systems or Azure resources, using credentials or identity."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 2, "q": "What types of service connections can you configure?", "a": [{"k": "p", "t": "Common types include"}, {"k": "li", "t": "Azure Resource Manager,"}, {"k": "li", "t": "GitHub,"}, {"k": "li", "t": "Docker Registry,"}, {"k": "li", "t": "Generic,"}, {"k": "li", "t": "AWS,"}, {"k": "li", "t": "GCP,"}, {"k": "li", "t": "and Service Fabric. Each targets a specific external service or cloud."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 3, "q": "How do you securely store and manage service connection credentials?", "a": [{"k": "p", "t": "Credentials are encrypted and stored securely in Azure DevOps. Sensitive details (like secrets or certificates) are not exposed in pipelines and are managed by Azure DevOps security controls."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 4, "q": "What is the difference between service principals, managed identities, and PATs in Azure DevOps?", "a": [{"k": "li", "t": "Service principals: Used for non-interactive authentication to Azure resources; recommended for ARM connections."}, {"k": "li", "t": "Managed identities: Azure AD identities for Azure services; used for enhanced security and automation within Azure."}, {"k": "li", "t": "PATs (Personal Access Tokens): User-scoped tokens for accessing Azure DevOps REST APIs; not recommended for automation or service connections due to security risks."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 5, "q": "How do you configure a new Azure Resource Manager (ARM) service connection?", "a": [{"k": "p", "t": "Go to Project Settings → Service Connections → New service connection → Select Azure Resource Manager → Authenticate (typically with a service principal) → Grant permissions → Save."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 6, "q": "What permissions are required to create and use service connections?", "a": [{"k": "li", "t": "Creating: Project Administrator or Service Connection Admin."}, {"k": "li", "t": "Using: Grant access to specific users, groups, or pipelines; restrict to those who need it."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 7, "q": "What are personal access tokens (PATs) and when should they be used?", "a": [{"k": "p", "t": "PATs are user-generated tokens for authenticating to Azure DevOps REST APIs. Use only for short-term, user-scoped automation; avoid for production pipelines or shared services."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 8, "q": "What are best practices for managing and rotating tokens in Azure DevOps?", "a": [{"k": "li", "t": "Use service principals or managed identities over PATs."}, {"k": "li", "t": "Set expiration dates on tokens."}, {"k": "li", "t": "Regularly review and rotate credentials."}, {"k": "li", "t": "Revoke unused or suspicious tokens promptly."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 9, "q": "How can you audit usage and security of service connections and tokens?", "a": [{"k": "p", "t": "Use Azure DevOps Audit Logs to track creation, modification, and usage of service connections and PATs. Review access and permission changes regularly."}]}, {"sub": "4.1.3", "st": "Azure DevOps service connections, tokens", "n": 10, "q": "How do you restrict access to service connections in a project or pipeline?", "a": [{"k": "p", "t": "Set security on each service connection by configuring user/group permissions or restricting pipeline usage. Use the “Limit job authorization” and “Grant access permission to all pipelines” settngs appropriately."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 1, "q": "What are the main types of roles in a GitHub repository?", "a": [{"k": "p", "t": "Owner, Admin, Maintainer, Write (Contributor), Triage, Read, and Outside Collaborator."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 2, "q": "What permissions does each role have in GitHub?", "a": [{"k": "li", "t": "Owner: Full control over organization and all repositories."}, {"k": "li", "t": "Admin: Full control over repository settngs and content."}, {"k": "li", "t": "Maintainer: Manages teams, can triage issues/PRs."}, {"k": "li", "t": "Write: Push code, create branches, manage issues/PRs."}, {"k": "li", "t": "Triage: Manage issues/PRs (label, assign), but cannot write code."}, {"k": "li", "t": "Read: View content, clone repo, open issues/PRs."}, {"k": "li", "t": "Outside Collaborator: Limited to explicit permissions given."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 3, "q": "How do you assign and manage roles in a GitHub repository?", "a": [{"k": "p", "t": "Go to Repository → Settings → Manage Access. Add users/teams and assign appropriate role."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 4, "q": "What is the difference between a repository collaborator and a team member?", "a": [{"k": "li", "t": "A collaborator is granted access directly to a repository, typically outside the organization."}, {"k": "li", "t": "A team member is part of an organization team, with permissions managed at the team level."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 5, "q": "How do you restrict branch access and actions in GitHub?", "a": [{"k": "p", "t": "Configure branch protection rules in repository settngs:"}, {"k": "li", "t": "restrict pushes,"}, {"k": "li", "t": "require PR reviews,"}, {"k": "li", "t": "enforce status checks,"}, {"k": "li", "t": "and limit who can merge."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 6, "q": "What is the purpose of code owners and how do they affect permissions?", "a": [{"k": "p", "t": "Code owners are responsible for specific files or directories. Their review is required before changes to owned code can be merged, enforcing accountability."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 7, "q": "How do organization-level permissions differ from repository-level permissions?", "a": [{"k": "li", "t": "Organization-level permissions apply across all repos and include actions like inviting members and managing billing."}, {"k": "li", "t": "Repository-level permissions control access to specific repos only."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 8, "q": "What are outside collaborators, and how are they managed?", "a": [{"k": "p", "t": "Outside collaborators are users not part of the org but given access to specific repos. Managed by adding/removing their access in repo settngs."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 9, "q": "What best practices should be followed for managing GitHub permissions?", "a": [{"k": "li", "t": "Use least privilege principle."}, {"k": "li", "t": "Prefer team-based over individual permissions."}, {"k": "li", "t": "Regularly review and audit access."}, {"k": "li", "t": "Use branch protections and required reviews."}]}, {"sub": "4.1.4", "st": "Permissions/Roles in GitHub", "n": 10, "q": "How do you audit and review repository access in GitHub?", "a": [{"k": "li", "t": "Use the \"Manage Access\" tab to review users and roles."}, {"k": "li", "t": "For organizations, use GitHub’s audit log and periodic access reviews."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 1, "q": "What are the default security groups in Azure DevOps?", "a": [{"k": "p", "t": "Azure DevOps default security groups include Project Administrators, Contributors, Readers, Build Administrators, and Project Collection Administrators. Each group grants a specific set of permissions appropriate for common roles."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 2, "q": "How do permissions inheritance and explicit overrides work in Azure DevOps?", "a": [{"k": "p", "t": "Permissions are inherited from higher-level containers (organization or project) to lower-level resources (repos, pipelines, etc). Explicitly settng a permission ('Allow' or 'Deny') at a lower level overrides inherited permissions."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 3, "q": "How do you assign and manage permissions at organization, project, and object level?", "a": [{"k": "p", "t": "Navigate to Organization/Project settings > Security. Assign users/groups to built-in or custom security groups, then set permissions at the organization, project, or resource (repo, pipeline) level."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 4, "q": "What is the difference between 'Allow', 'Deny', and 'Not set' for permissions?", "a": [{"k": "p", "t": "'Allow' grants the permission, 'Deny' blocks it (overrides all 'Allow'), and 'Not set' means the permission is neither granted nor denied, so inheritance applies."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 5, "q": "How do you grant least privilege access in Azure DevOps?", "a": [{"k": "p", "t": "Add users to the group with the minimal permissions needed. Avoid granting Project Administrator unless required, and restrict direct assignments."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 6, "q": "How are access levels different from security group permissions?", "a": [{"k": "li", "t": "Access levels (Stakeholder, Basic, Visual Studio, etc.) control which features are available."}, {"k": "li", "t": "Security group permissions define what users can do within those features."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 7, "q": "What are best practices for configuring permissions in Azure DevOps?", "a": [{"k": "p", "t": "Use built-in groups for common roles, apply 'Deny' sparingly, review permissions regularly, and use custom groups only when necessary."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 8, "q": "How can you audit and review effective permissions for a user or group?", "a": [{"k": "p", "t": "Use the Permissions tab under the security settngs of a resource. Select a user/group to view their effective permissions, including inherited and explicitly set rights."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 9, "q": "What steps are required to restrict branch permissions or pipeline execution?", "a": [{"k": "p", "t": "Go to the repository or pipeline, select Security, and set branch or pipeline permissions for specific users/groups (e.g., restrict force push or approve builds)."}]}, {"sub": "4.2.1", "st": "Azure DevOps permissions, security groups", "n": 10, "q": "How do you manage external access (e.g., Stakeholders, outside collaborators)?", "a": [{"k": "p", "t": "Assign external users to Stakeholder access or limit to specific security groups. Review permissions to ensure no unnecessary access is granted beyond required scope."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 1, "q": "What are the main access levels available in Azure DevOps?", "a": [{"k": "li", "t": "Stakeholder,"}, {"k": "li", "t": "Basic,"}, {"k": "li", "t": "and Visual Studio Subscriber."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 2, "q": "What capabilities are included with Stakeholder access?", "a": [{"k": "li", "t": "Stakeholders can o view & edit work items, o create & manage backlogs and boards, o and run some queries."}, {"k": "li", "t": "They cannot access code, pipelines, or advanced features."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 3, "q": "How do access levels differ from security group permissions?", "a": [{"k": "p", "t": "Access levels determine feature visibility and availability; security groups control specific permissions within those features."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 4, "q": "Who should be assigned the Stakeholder access level?", "a": [{"k": "p", "t": "Users who need visibility into project work but do not require code or pipeline access, such as business analysts, sponsors, and some external partners."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 5, "q": "What are the limitations of Stakeholder access compared to Basic?", "a": [{"k": "p", "t": "Stakeholders cannot contribute code, manage pipelines, view test plans, or access advanced reporting and dashboards."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 6, "q": "How do you manage access levels for users in Azure DevOps?", "a": [{"k": "p", "t": "Go to Organization Settings > Users, select the user, and assign the appropriate access level (Stakeholder, Basic, etc.)."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 7, "q": "What is the recommended approach for granting outside collaborator access?", "a": [{"k": "p", "t": "Invite external users with the minimum required access level, typically as Stakeholders or limited Basic users, and restrict security group membership as needed."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 8, "q": "What restrictions apply to outside collaborators in Azure DevOps?", "a": [{"k": "li", "t": "They may have limited access to organization-wide resources,"}, {"k": "li", "t": "cannot be assigned certain licenses,"}, {"k": "li", "t": "and may be restricted by policies (e.g., limited to specific projects)."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 9, "q": "How can you audit and review access levels across an organization?", "a": [{"k": "p", "t": "In Organization Settings > Users, filter or export the user list to review assigned access levels and license usage."}]}, {"sub": "4.2.2", "st": "Access levels: stakeholders, collaborators", "n": 10, "q": "What are best practices for assigning access levels in Azure DevOps?", "a": [{"k": "li", "t": "Assign the lowest access level that meets business needs,"}, {"k": "li", "t": "review user assignments regularly,"}, {"k": "li", "t": "and update access as roles or requirements change."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 1, "q": "How do you create a new project in Azure DevOps?", "a": [{"k": "p", "t": "Go to Azure DevOps portal > New Project > Enter name, description, visibility, and process, then create."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 2, "q": "What are teams in Azure DevOps and why are they used?", "a": [{"k": "p", "t": "Teams are subgroups within a project that enable independent backlog, board, and sprint planning. They help scale agile practices for large projects."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 3, "q": "How do you add users to a project or team?", "a": [{"k": "p", "t": "In Project Settings > Teams, select a team > Add Members. For project-level access, use Project Settings > Permissions or Organization Settings > Users."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 4, "q": "What is the difference between project and team-level security?", "a": [{"k": "li", "t": "Project-level security controls access to resources across the entire project;"}, {"k": "li", "t": "team-level settngs affect only the team’s artifacts (backlogs, boards, etc.)."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 5, "q": "How do you configure team backlogs and boards?", "a": [{"k": "p", "t": "In Team Settngs, define areas and iterations for the team, then customize columns, swimlanes, and filters for boards as needed."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 6, "q": "How do you manage team areas and iterations?", "a": [{"k": "p", "t": "Assign work item areas and sprints (iterations) in Project Settings > Project configuration, then map them to teams via Team Settngs."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 7, "q": "How can you restrict visibility of repositories or pipelines within a project?", "a": [{"k": "p", "t": "Use Project Settings > Repositories/Pipelines > Security to set permissions for teams or users, controlling access per repo or pipeline."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 8, "q": "What are the steps to rename or delete a project or team?", "a": [{"k": "li", "t": "For projects: Organization Settings > Projects > Select project > Rename or Delete."}, {"k": "li", "t": "For teams: Project Settings > Teams > Select team > Edit or Delete."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 9, "q": "How do you set default teams or manage multiple teams within a project?", "a": [{"k": "p", "t": "Each project has a default team (created with the project); more teams can be added via Project Settings > Teams. You can set team defaults for areas and iterations."}]}, {"sub": "4.2.3", "st": "Project/team config in Azure DevOps", "n": 10, "q": "What are best practices for organizing teams and projects in Azure DevOps?", "a": [{"k": "li", "t": "Align teams to delivery units (feature, component, cross-functional),"}, {"k": "li", "t": "avoid unnecessary project sprawl,"}, {"k": "li", "t": "keep team memberships current,"}, {"k": "li", "t": "and regularly review permissions and structure."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 1, "q": "What are the types of objects stored in Azure Key Vault?", "a": [{"k": "li", "t": "Secrets (e.g., passwords, tokens),"}, {"k": "li", "t": "Keys (RSA/EC keys),"}, {"k": "li", "t": "and Certificates (with optional auto-renewal)."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 2, "q": "How do you create and manage secrets in Azure Key Vault?", "a": [{"k": "p", "t": "Use Azure CLI: az keyvault secret set --vault-name <name> --name <secretName> --value <value> You can also manage via Azure Portal, REST API, or ARM/Bicep templates."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 3, "q": "What is the difference between keys and secrets in Key Vault?", "a": [{"k": "li", "t": "Secrets: Store plain strings (e.g., passwords)."}, {"k": "li", "t": "Keys: Used for cryptographic operations (encrypt, sign) and can't be exported."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 4, "q": "How do you control access to Key Vault using RBAC vs. access policies?", "a": [{"k": "li", "t": "RBAC: Assign roles like \"Key Vault Secrets User\" at Azure resource level."}, {"k": "li", "t": "Access policies: Grant specific permissions (e.g., get, list) directly in Key Vault settngs. RBAC is recommended for new deployments."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 5, "q": "How do you integrate Azure Key Vault with GitHub Actions or Azure Pipelines?", "a": [{"k": "p", "t": "Use AzureLogin action or service connection to authenticate, then access secrets via: az keyvault secret show in a script step or with built-in AzureKeyVault@2 task."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 6, "q": "How are secrets retrieved securely in CI/CD pipelines?", "a": [{"k": "p", "t": "Use secure service connections and managed identities. Avoid hardcoding secrets; pull them at runtime using secure pipeline tasks (e.g., AzureKeyVault@2 or azure/login + CLI)."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 7, "q": "What are best practices for rotating secrets and certificates?", "a": [{"k": "li", "t": "Enable expiration dates."}, {"k": "li", "t": "Use Event Grid with automation (e.g., Logic Apps, Azure Functions) for rotation."}, {"k": "li", "t": "For certificates, enable auto-renew with integrated CAs."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 8, "q": "How is soft-delete and purge protection used in Key Vault?", "a": [{"k": "li", "t": "Soft-delete: Keeps deleted items for a retention period (default 90 days)."}, {"k": "li", "t": "Purge protection: Prevents permanent deletion until retention expires. Both are essential for regulatory compliance."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 9, "q": "How do managed identities access Azure Key Vault?", "a": [{"k": "p", "t": "Assign the identity a role (RBAC) or access policy in Key Vault with required permissions. No credentials are needed—Azure handles auth transparently."}]}, {"sub": "4.3.1", "st": "Azure Key Vault secrets/keys/certs", "n": 10, "q": "How do you audit access and usage of Azure Key Vault?", "a": [{"k": "p", "t": "Enable diagnostic settngs to send logs to Log Analytics, Storage, or Event Hubs. Monitor events like SecretGet, KeySign using Azure Monitor or KQL."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 1, "q": "How are secrets stored and accessed in GitHub Actions?", "a": [{"k": "p", "t": "Secrets are added under Settings > Secrets and variables > Actions. Access them in workflows using ${{ secrets.SECRET_NAME }}."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 2, "q": "What are environment secrets in GitHub Actions and how do they differ from repository secrets?", "a": [{"k": "p", "t": "Environment secrets are tied to specific deployment environments and support protection rules. Repository secrets apply globally to all workflows."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 3, "q": "How do you securely use secrets in GitHub Actions workflows?", "a": [{"k": "p", "t": "Use ${{ secrets.NAME }} in workflow YAML. Never echo secrets or log them. Use secrets.* only within run blocks or secure inputs."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 4, "q": "How do you define and use secrets in Azure Pipelines?", "a": [{"k": "p", "t": "Define secrets in variable groups or pipeline variables (isSecret: true). Access them in scripts via $(secretName) or environment variables."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 5, "q": "What are secure files in Azure Pipelines and when should you use them?", "a": [{"k": "p", "t": "Secure files are encrypted files (e.g., certificates) uploaded via the UI or API. Use them when pipelines need non-text secrets like PFX or SSH keys."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 6, "q": "What are common mistakes that expose secrets in CI/CD workflows?", "a": [{"k": "li", "t": "Echoing secrets to logs"}, {"k": "li", "t": "Using secrets in non-secure scripts"}, {"k": "li", "t": "Committng secrets to source control"}, {"k": "li", "t": "Disabling scrubbers or secret masking"}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 7, "q": "How do you use variable groups to manage secrets across pipelines in Azure DevOps?", "a": [{"k": "p", "t": "Create a variable group, mark secrets as secret, and link the group to pipelines. Requires linking authorization for YAML usage."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 8, "q": "What permissions are required to access secrets in GitHub and Azure Pipelines?", "a": [{"k": "li", "t": "GitHub: Write access to secrets and workflow access permissions"}, {"k": "li", "t": "Azure DevOps: Pipeline or service connection must have access to variable groups/secure files"}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 9, "q": "How can secrets be injected into runtime containers securely in pipelines?", "a": [{"k": "p", "t": "Pass them as environment variables or mount secure files. In GitHub, use env: block; in Azure, use environment: or script variables."}]}, {"sub": "4.3.2", "st": "Secrets in GitHub Actions/Azure Pipelines", "n": 10, "q": "What are the best practices for managing secret lifecycle in DevOps pipelines?", "a": [{"k": "li", "t": "Rotate secrets regularly"}, {"k": "li", "t": "Use Key Vault or GitHub Environments for sensitive scopes"}, {"k": "li", "t": "Avoid hardcoding; retrieve secrets dynamically"}, {"k": "li", "t": "Audit and clean unused secrets periodically"}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 1, "q": "What are secure files in Azure Pipelines and what are common use cases?", "a": [{"k": "p", "t": "Secure files are encrypted files (e.g., certificates, provisioning profiles, signing keys) stored securely in Azure Pipelines. Use cases: iOS provisioning profiles, Android keystore files, SSL certs, signing keys."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 2, "q": "How do you upload secure files to Azure Pipelines?", "a": [{"k": "p", "t": "Navigate to: Pipelines → Library → Secure files → “+ Secure file” → Upload and save. Files are encrypted at rest."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 3, "q": "How are secure files used in pipeline steps?", "a": [{"k": "p", "t": "Use the DownloadSecureFile@1 task to access them during runtime. Example: - task: DownloadSecureFile@1 inputs: secureFile: 'cert.pfx'"}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 4, "q": "What permissions are required to access secure files?", "a": [{"k": "p", "t": "Users must have “Download secure files” permission for the pipeline or release. Access is restricted via Library security roles."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 5, "q": "How does Azure Pipelines handle encryption and storage of secure files?", "a": [{"k": "p", "t": "Files are encrypted with AES-256 at rest and decrypted only in the pipeline execution context. Files are temporary and auto-deleted post-job."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 6, "q": "What are best practices for managing certificates or signing keys securely in deployment pipelines?", "a": [{"k": "li", "t": "Store certs as secure files"}, {"k": "li", "t": "Restrict access via RBAC"}, {"k": "li", "t": "Use per-environment scopes"}, {"k": "li", "t": "Rotate keys regularly"}, {"k": "li", "t": "Never log or output cert data"}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 7, "q": "Can secure files be used in GitHub Actions?", "a": [{"k": "p", "t": "No native secure file equivalent in GitHub. Use base64-encoded secrets or store encrypted files in repo and decrypt during workflow using stored secrets."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 8, "q": "How can you audit access to secure files in Azure DevOps?", "a": [{"k": "p", "t": "Review audit logs in Azure DevOps under Organization Settings → Auditing. Logs include who uploaded, downloaded, or deleted secure files."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 9, "q": "What is the difference between pipeline secrets and secure files?", "a": [{"k": "li", "t": "Secrets: key-value strings (e.g., API keys, passwords)"}, {"k": "li", "t": "Secure files: binary files (e.g., certificates) Both are encrypted but serve different deployment needs."}]}, {"sub": "4.3.3", "st": "Secure files during deployment", "n": 10, "q": "How do you prevent accidental exposure of sensitive files during deployment?", "a": [{"k": "li", "t": "Use secure file tasks (never inline file content)"}, {"k": "li", "t": "Disable verbose logging"}, {"k": "li", "t": "Never echo secrets or paths"}, {"k": "li", "t": "Restrict debug mode"}, {"k": "li", "t": "Run deployments in isolated environments"}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 1, "q": "What are the primary sources of sensitive data leakage in pipelines?", "a": [{"k": "li", "t": "Hardcoded secrets,"}, {"k": "li", "t": "unmasked output logs,"}, {"k": "li", "t": "exposed environment variables,"}, {"k": "li", "t": "misconfigured scripts,"}, {"k": "li", "t": "or use of unsecured third-party tools."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 2, "q": "How do you securely manage secrets in Azure Pipelines?", "a": [{"k": "p", "t": "Use Library variable groups with secret variables, or link Azure Key Vault. Access them via $(secretName) and ensure secret masking is enabled."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 3, "q": "How do you securely manage secrets in GitHub Actions?", "a": [{"k": "p", "t": "Store secrets in Settings → Secrets and variables → Actions. Access using ${{ secrets.MY_SECRET }}. They're automatically masked in logs."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 4, "q": "What logging configurations help avoid data exposure?", "a": [{"k": "li", "t": "Disable debug logging when not needed,"}, {"k": "li", "t": "avoid echo on secret variables,"}, {"k": "li", "t": "and never write secrets to stdout or log files."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 5, "q": "How can environment variables be secured in pipelines?", "a": [{"k": "li", "t": "Use runtime injection from secret stores, never hardcode."}, {"k": "li", "t": "In Azure, define as secret variables."}, {"k": "li", "t": "In GitHub, use secrets and avoid exporting them to global env."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 6, "q": "How do you enforce secret masking in Azure Pipelines?", "a": [{"k": "p", "t": "Mark variables as “Keep this value secret” when defining. Azure auto-masks them in logs if exact string match is found during execution."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 7, "q": "What are best practices for reviewing pipeline YAML for leaks?", "a": [{"k": "li", "t": "Scan for hardcoded strings resembling keys/passwords"}, {"k": "li", "t": "Use templates to centralize secret usage"}, {"k": "li", "t": "Avoid inline scripts containing credentials"}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 8, "q": "How does GitHub detect and prevent secret exposure automatically?", "a": [{"k": "p", "t": "GitHub Advanced Security performs secret scanning. If a known patern (e.g., AWS keys) is pushed, it alerts and can revoke the secret via partner integrations."}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 9, "q": "What tools can scan pipelines for secrets or credentials?", "a": [{"k": "li", "t": "GitHub Advanced Security (Code/secret scanning)"}, {"k": "li", "t": "Microsoft Defender for DevOps"}, {"k": "li", "t": "Open-source tools: truffleHog, gitleaks"}]}, {"sub": "4.3.4", "st": "Prevent sensitive data leakage in pipelines", "n": 10, "q": "How do you ensure sensitive data is not logged by custom scripts or tools?", "a": [{"k": "li", "t": "Sanitize script output,"}, {"k": "li", "t": "use set +x in bash,"}, {"k": "li", "t": "avoid printing env variables,"}, {"k": "li", "t": "redirect logs,"}, {"k": "li", "t": "and validate tools do not expose variables implicitly."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 1, "q": "What tools are commonly used for dependency scanning in Azure DevOps and GitHub?", "a": [{"k": "li", "t": "GitHub uses Dependabot and GitHub Advanced Security;"}, {"k": "li", "t": "Azure DevOps relies on integrations like Microsoft Defender for DevOps and third-party tools like WhiteSource or Snyk."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 2, "q": "How does GitHub Dependabot work and what vulnerabilities can it detect?", "a": [{"k": "p", "t": "Dependabot scans dependency files (e.g., package.json, requirements.txt) for known CVEs and suggests automatic PRs with updated versions. It uses the GitHub Advisory Database."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 3, "q": "What is CodeQL and how is it integrated into GitHub Actions?", "a": [{"k": "p", "t": "CodeQL performs static code analysis to find security vulnerabilities. It runs as a GitHub Action and supports scheduled or PR-triggered scans across multiple languages."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 4, "q": "How do you configure secret scanning in GitHub repositories?", "a": [{"k": "p", "t": "Enable it under repository settings → Security → Code security and analysis. GitHub scans commits and PRs for credential paterns and alerts repo admins."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 5, "q": "What license compliance features does GitHub provide?", "a": [{"k": "p", "t": "GitHub scans dependencies to detect license types and highlight potential violations. License metadata is shown in dependency graphs; violations can trigger Dependabot alerts."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 6, "q": "How do you enable and enforce security scanning policies in GitHub Advanced Security?", "a": [{"k": "p", "t": "Enable Advanced Security per repository. Configure required status checks (e.g., CodeQL, secret scanning) in branch protection rules to block merging if checks fail."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 7, "q": "How can Microsoft Defender for DevOps be integrated for scanning in Azure DevOps?", "a": [{"k": "p", "t": "Connect via Microsoft Defender for Cloud → DevOps Security → Connect Azure DevOps. It enables dependency, IaC, and container scanning and centralizes findings in Defender."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 8, "q": "What are the differences between static code analysis and secret scanning?", "a": [{"k": "p", "t": "Static analysis (e.g., CodeQL) finds logic flaws in code structure; secret scanning searches for exposed credentials and tokens in code and commits."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 9, "q": "How are vulnerabilities tracked and managed after detection in GitHub?", "a": [{"k": "p", "t": "Vulnerabilities appear in the Security tab → Dependabot alerts. You can view affected versions, upgrade recommendations, and dismiss alerts with a justification."}]}, {"sub": "4.4.1", "st": "Dependency/code/secret/license scanning", "n": 10, "q": "What best practices ensure effective and compliant security/compliance scanning pipelines?", "a": [{"k": "p", "t": "Use CI-integrated scanning (e.g., CodeQL, secret scan), auto-fix with Dependabot, enforce branch protections, monitor security dashboards, and integrate alerting with workflows."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 1, "q": "What is Microsoft Defender for DevOps and what problems does it solve?", "a": [{"k": "p", "t": "It's a cloud-native security tool that integrates with Azure DevOps and GitHub to detect"}, {"k": "li", "t": "misconfigurations,"}, {"k": "li", "t": "exposed secrets,"}, {"k": "li", "t": "vulnerable dependencies,"}, {"k": "li", "t": "and infrastructure risks across the DevOps pipeline."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 2, "q": "How do you onboard Azure DevOps and GitHub into Microsoft Defender for DevOps?", "a": [{"k": "p", "t": "In Microsoft Defender for Cloud, go to DevOps Security → Environment Settings → Add DevOps platform. Authenticate and connect your Azure DevOps org or GitHub repo via OAuth or service connection."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 3, "q": "What types of security risks does Defender for DevOps detect?", "a": [{"k": "p", "t": "It identifies"}, {"k": "li", "t": "exposed secrets,"}, {"k": "li", "t": "dependency vulnerabilities,"}, {"k": "li", "t": "IaC misconfigurations,"}, {"k": "li", "t": "weak configurations in workflows,"}, {"k": "li", "t": "and usage of unapproved tools or practices."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 4, "q": "Where are Defender for DevOps findings surfaced and managed?", "a": [{"k": "p", "t": "Findings are centralized in Microsoft Defender for Cloud under DevOps Security and Security Recommendations. Integration with Azure Security Center enables correlation with broader cloud risks."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 5, "q": "How is remediation workflow handled for vulnerabilities in Defender for DevOps?", "a": [{"k": "p", "t": "Defender provides actionable remediation steps and enables exporting findings to Azure Boards, GitHub issues, or third-party ticketing systems. Findings can be prioritized by severity."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 6, "q": "How does Defender for DevOps integrate with GitHub Advanced Security?", "a": [{"k": "p", "t": "Defender imports results from GitHub Advanced Security (CodeQL, secret scanning, dependency scanning) to enrich risk context and provide a unified dashboard for security posture."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 7, "q": "What permissions are required to connect GitHub or Azure DevOps to Defender for DevOps?", "a": [{"k": "p", "t": "You need Owner/admin privileges on the GitHub org or Azure DevOps project. OAuth permissions must include access to metadata, repos, and workflows. Defender must be granted permission to scan code."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 8, "q": "How do you enable continuous monitoring across multiple repositories?", "a": [{"k": "p", "t": "Connect the org level (not just individual repos), enable auto-discovery of new repos, and configure scanning rules and policies to apply by default across all new projects."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 9, "q": "How can you enforce policies based on Defender for DevOps findings?", "a": [{"k": "p", "t": "Integrate with Azure Policy or GitHub branch protection rules. Use conditional access policies or block deployments based on unresolved critical issues via pipeline gates."}]}, {"sub": "4.4.2", "st": "Microsoft Defender for DevOps Security", "n": 10, "q": "What best practices ensure effective implementation of Defender for DevOps?", "a": [{"k": "p", "t": "Onboard all repos/orgs, enable integration with GitHub Advanced Security, triage alerts regularly, automate issue tracking, review pipeline permissions, and monitor via centralized dashboards."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 1, "q": "What features are included in GitHub Advanced Security (GHAS)?", "a": [{"k": "p", "t": "GHAS includes"}, {"k": "li", "t": "CodeQL (static analysis),"}, {"k": "li", "t": "secret scanning,"}, {"k": "li", "t": "and dependency review. It enhances repo security with"}, {"k": "li", "t": "alerts,"}, {"k": "li", "t": "PR checks,"}, {"k": "li", "t": "and security dashboards."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 2, "q": "How do you enable GHAS for a GitHub repository or organization?", "a": [{"k": "p", "t": "In repo settings → Security & analysis, enable features like Code scanning and Secret scanning. Organization admins must assign a GHAS license to the repo."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 3, "q": "What is CodeQL in GHAS and how does it function?", "a": [{"k": "p", "t": "CodeQL scans source code for vulnerabilities using semantic queries. It's configured via GitHub Actions and runs on PRs, pushes, or scheduled intervals."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 4, "q": "How does GHAS handle secret scanning and what are its capabilities?", "a": [{"k": "p", "t": "Secret scanning detects credentials (e.g., API keys, tokens) in pushes and PRs. Alerts are triggered, and some partner secrets are automatically revoked."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 5, "q": "How is dependency scanning managed within GHAS?", "a": [{"k": "p", "t": "GHAS shows known CVEs via the dependency graph and triggers Dependabot alerts. It identifies vulnerable versions and suggests secure updates."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 6, "q": "What is the difference between alerts and security overview in GHAS?", "a": [{"k": "p", "t": "Alerts show specific issues (e.g., a secret or CVE). Security overview aggregates all alerts, provides trends, and gives org-wide or repo-wide posture insight."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 7, "q": "How do you enforce GHAS checks in branch protection rules?", "a": [{"k": "p", "t": "Enable required status checks (e.g., CodeQL, secret scanning) under Branch protection rules. This blocks merging PRs with unresolved security issues."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 8, "q": "What are the licensing and billing requirements for GHAS?", "a": [{"k": "p", "t": "GHAS requires an Enterprise plan with Advanced Security enabled. Billing is per active commiter per month for each enabled private repository."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 9, "q": "How does GHAS integrate with CI/CD workflows and GitHub Actions?", "a": [{"k": "p", "t": "GHAS tools (e.g., CodeQL) run as GitHub Actions in the CI pipeline. They can fail builds, comment on PRs, and prevent merging based on scan results."}]}, {"sub": "4.4.3", "st": "Github advanced security", "n": 10, "q": "What are best practices for managing GHAS alerts and findings?", "a": [{"k": "p", "t": "Triage alerts promptly, prioritize critical issues, auto-create issues from alerts, integrate with project boards, and use codeowners for review responsibility."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 1, "q": "What is CodeQL and how does it work in GitHub Advanced Security?", "a": [{"k": "p", "t": "CodeQL performs semantic analysis on source code using a query language to detect vulnerabilities. It analyzes code on PRs, pushes, and schedules."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 2, "q": "How do you configure CodeQL analysis in a GitHub repository?", "a": [{"k": "p", "t": "Add the github/codeql-action/init and analyze actions in a .github/workflows/codeql.yml file. Select target languages and triggers (e.g., push, PR)."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 3, "q": "What languages are supported by CodeQL?", "a": [{"k": "p", "t": "CodeQL supports C/C++, C#, Go, Java, JavaScript/TypeScript, Python, Ruby, and Swift."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 4, "q": "How does CodeQL identify vulnerabilities?", "a": [{"k": "p", "t": "It uses a query engine to detect security paterns (e.g., SQL injection, XSS). Queries are run against the code database built during analysis."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 5, "q": "How do you run CodeQL in a containerized environment?", "a": [{"k": "p", "t": "Use GitHub-hosted or self-hosted runners with container support. CodeQL can analyze code inside Docker containers by configuring the container: option in workflows."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 6, "q": "What tools are commonly used for container image scanning?", "a": [{"k": "p", "t": "Microsoft Defender for Cloud, Trivy, Aqua, and Anchore are popular tools. They detect OS/package-level vulnerabilities and policy violations."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 7, "q": "How can GitHub Actions be used to scan container images?", "a": [{"k": "p", "t": "Use actions like aquasecurity/trivy-action or anchore/scan-action in a workflow to scan images after build and fail the job on high-severity findings."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 8, "q": "How do you automate container scanning in CI/CD pipelines?", "a": [{"k": "p", "t": "Integrate scanning steps post-image-build in GitHub Actions or Azure Pipelines. Scan images before pushing to registry and gate releases on scan results."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 9, "q": "How are container scan results surfaced and consumed?", "a": [{"k": "p", "t": "Results appear in the GitHub Security tab (if supported), job logs, or are exported to external tools. Defender shows results in Azure Security Center."}]}, {"sub": "4.4.4", "st": "CodeQL, Container Scanning", "n": 10, "q": "What best practices ensure secure use of CodeQL and container scanning in DevOps?", "a": [{"k": "li", "t": "Scan on every PR,"}, {"k": "li", "t": "enforce status checks,"}, {"k": "li", "t": "update scan tools regularly,"}, {"k": "li", "t": "exclude false positives via configuration,"}, {"k"
