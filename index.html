: "li", "t": "and act on critical alerts before deploy."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 1, "q": "What is Dependabot and how does it help with open-source security?", "a": [{"k": "p", "t": "Dependabot scans dependencies for known vulnerabilities and automatically creates pull requests to upgrade to secure versions."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 2, "q": "How do you enable and configure Dependabot in a GitHub repository?", "a": [{"k": "p", "t": "Create a .github/dependabot.yml file defining package ecosystems, directories, and update frequency. Security updates are enabled by default in repo settngs."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 3, "q": "What file types and ecosystems does Dependabot support?", "a": [{"k": "p", "t": "It supports npm, Maven, pip, RubyGems, NuGet, Cargo, Go modules, Docker, and more—based on lockfiles or manifest files in the repo."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 4, "q": "How does Dependabot detect and report vulnerabilities?", "a": [{"k": "p", "t": "It matches dependency versions in the repo against the GitHub Advisory Database. If a match exists, it creates alerts and optionally PRs."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 5, "q": "What are Dependabot security updates vs version updates?", "a": [{"k": "li", "t": "Security updates target known vulnerabilities."}, {"k": "li", "t": "Version updates are routine upgrades (e.g., minor/patch bumps). Both are configured via dependabot.yml."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 6, "q": "How are vulnerabilities prioritized in Dependabot alerts?", "a": [{"k": "p", "t": "Alerts are ranked by CVSS severity (low to critical) and show impact details, affected version ranges, and fixed versions."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 7, "q": "How can PRs from Dependabot be managed and approved?", "a": [{"k": "p", "t": "PRs can be auto-approved using GitHub Actions or require manual review. Apply branch protection rules to enforce checks before merge."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 8, "q": "How do you control update frequency and behavior in Dependabot?", "a": [{"k": "p", "t": "In dependabot.yml, set schedule.interval (daily/weekly/monthly), and open-pull-requests-limit to manage PR volume."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 9, "q": "Where are Dependabot alerts shown and how are they resolved?", "a": [{"k": "p", "t": "Alerts appear in the Security > Dependabot tab. Resolve them by merging the auto-generated PR or manually updating dependencies."}]}, {"sub": "4.4.5", "st": "Dependabot for OSS scanning", "n": 10, "q": "What are best practices for integrating Dependabot in CI/CD?", "a": [{"k": "p", "t": "Enable alerts, review PRs promptly, restrict PRs to safe branches, run tests on PRs, and auto-merge low- risk updates after passing checks."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 1, "q": "What is Azure Monitor and how does it relate to Log Analytics?", "a": [{"k": "li", "t": "Azure Monitor is a platform for collecting, analyzing, and acting on telemetry."}, {"k": "li", "t": "Log Analytics is its query engine and data platform, storing logs in a workspace that Azure Monitor uses for diagnostics and alerting."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 2, "q": "How do you enable and configure Azure Monitor for a resource?", "a": [{"k": "p", "t": "Go to the Azure resource → Monitoring → Diagnostic settings → Enable diagnostics → Select logs and metrics → Route to Log Analytics workspace or Event Hub."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 3, "q": "How do you link a Log Analytics workspace to Azure Monitor?", "a": [{"k": "p", "t": "In the resource’s Diagnostic settngs, select \"Send to Log Analytics workspace\" and choose the subscription and workspace. Logs are then streamed automatically."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 4, "q": "What data types are collected by default in Azure Monitor?", "a": [{"k": "p", "t": "Metrics (numeric performance data) and logs (activity, diagnostics). Resource types vary: VM Insights collects perf counters, while App Insights collects requests, dependencies, exceptions."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 5, "q": "How do you configure Application Insights with Azure Monitor?", "a": [{"k": "p", "t": "Enable Application Insights via Azure Portal or SDK. It auto-collects telemetry and integrates with Log Analytics if linked. Use ApplicationInsights.config or code for customization."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 6, "q": "How do you configure VM Insights and Container Insights?", "a": [{"k": "p", "t": "Install the Log Analytics agent or Azure Monitor Agent (AMA) on VMs. For containers, enable monitoring in the AKS cluster or atach agents manually to non-AKS clusters."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 7, "q": "How do you query logs using KQL in Log Analytics?", "a": [{"k": "p", "t": "Open Logs under the workspace or resource → Use KQL (e.g., AzureDiagnostics | where ResourceType == \"XYZ\"). Use project, summarize, where, join for insights."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 8, "q": "How do you configure data retention and diagnostic settngs?", "a": [{"k": "p", "t": "In Log Analytics workspace → Usage and estimated costs → Data retention → Set days (up to 730). Configure Diagnostic settngs per resource to control data flow and granularity."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 9, "q": "How do you integrate Azure Monitor with Azure DevOps or GitHub?", "a": [{"k": "p", "t": "Use Action Groups with Logic Apps or Webhooks to trigger work item creation in Azure DevOps or GitHub Issues when alerts are fired."}]}, {"sub": "5.1.1", "st": "Configure Azure Monitor, Log Analytics", "n": 10, "q": "How do you create alerts from Log Analytics queries?", "a": [{"k": "p", "t": "Run a KQL query → Click “New Alert Rule” → Define alert logic, threshold, frequency → Attach to an Action Group (email, webhook, Logic App) → Save."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 1, "q": "What telemetry data does Application Insights collect by default?", "a": [{"k": "li", "t": "Requests,"}, {"k": "li", "t": "dependencies,"}, {"k": "li", "t": "exceptions,"}, {"k": "li", "t": "traces,"}, {"k": "li", "t": "page views,"}, {"k": "li", "t": "performance counters,"}, {"k": "li", "t": "and availability test results."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 2, "q": "How do you enable Application Insights in an app or service?", "a": [{"k": "p", "t": "Use Azure Portal during resource creation, or manually integrate SDK (e.g., .NET, Node.js) and configure instrumentation key or connection string."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 3, "q": "How do you instrument custom telemetry with Application Insights SDK?", "a": [{"k": "p", "t": "Use SDK methods like TrackEvent, TrackMetric, TrackTrace, TrackException to send custom telemetry. Context properties can be added for traceability."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 4, "q": "What is VM Insights and what telemetry does it collect?", "a": [{"k": "p", "t": "It provides performance metrics (CPU, memory, disk, network), dependency maps, and process info for Azure/Arc VMs."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 5, "q": "How do you enable VM Insights on Azure VMs?", "a": [{"k": "p", "t": "Enable from the Azure Monitor blade or VM → Insights → Enable. This deploys the monitoring agent and connects to a Log Analytics workspace."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 6, "q": "What is Container Insights and what data does it gather?", "a": [{"k": "p", "t": "It collects container performance (CPU, memory), node health, pod logs, and Kubernetes event logs for AKS or other clusters."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 7, "q": "How is Container Insights configured on AKS?", "a": [{"k": "p", "t": "Enable monitoring during AKS creation or later from the Azure Portal → Insights. Azure Monitor agent is deployed to collect telemetry."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 8, "q": "How do Storage Insights enhance storage monitoring?", "a": [{"k": "p", "t": "They provide metrics like"}, {"k": "li", "t": "capacity,"}, {"k": "li", "t": "transactions,"}, {"k": "li", "t": "latency,"}, {"k": "li", "t": "and availability per blob/table/file/queue via diagnostic settngs sent to Log Analytics."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 9, "q": "What metrics are available from Network Insights?", "a": [{"k": "p", "t": "Metrics include"}, {"k": "li", "t": "throughput,"}, {"k": "li", "t": "packet loss,"}, {"k": "li", "t": "latency,"}, {"k": "li", "t": "SNAT port exhaustion,"}, {"k": "li", "t": "and flow data from NSGs, Load Balancers, and VPN gateways."}]}, {"sub": "5.1.2", "st": "Telemetry with App Insights, VM/Container/Storage/Network Insights", "n": 10, "q": "How can telemetry from these Insights be correlated in Log Analytics?", "a": [{"k": "p", "t": "All telemetry streams into the same Log Analytics workspace and can be queried using KQL. Use joins and time filters to correlate across services."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 1, "q": "What monitoring insights are available in GitHub repositories?", "a": [{"k": "p", "t": "GitHub provides built-in insights including"}, {"k": "li", "t": "Pulse (activity overview),"}, {"k": "li", "t": "Traffic (clones/views),"}, {"k": "li", "t": "Contributors (commit stats),"}, {"k": "li", "t": "Commits,"}, {"k": "li", "t": "Code Frequency,"}, {"k": "li", "t": "and Dependency Graph."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 2, "q": "How do you access and interpret GitHub Insights charts (e.g., Pulse, Traffic)?", "a": [{"k": "p", "t": "Go to the “Insights” tab of a repository."}, {"k": "li", "t": "Pulse shows merged PRs, opened/closed issues, and commits over time."}, {"k": "li", "t": "Traffic displays unique visitors, page views, clones, and referrers."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 3, "q": "What key repository metrics are commonly visualized in GitHub Insights?", "a": [{"k": "p", "t": "Metrics include"}, {"k": "li", "t": "commits per period,"}, {"k": "li", "t": "contributor stats,"}, {"k": "li", "t": "issue and PR activity,"}, {"k": "li", "t": "code additions/deletions,"}, {"k": "li", "t": "clone/view counts,"}, {"k": "li", "t": "and dependency relationships."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 4, "q": "How do you enable and configure repository Insights in GitHub?", "a": [{"k": "p", "t": "Insights are enabled by default. No special configuration is needed; users require at least read access to view most charts."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 5, "q": "How can you monitor workflow and pipeline health using GitHub Actions insights?", "a": [{"k": "p", "t": "Go to “Actions” > “Insights”. View run duration, workflow success/failure rates, recent run history, and failure causes."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 6, "q": "What are best practices for using charts to identify trends in repository activity?", "a": [{"k": "p", "t": "Regularly review commit frequency, issue/PR trends, and contributor activity to identify botlenecks or spikes."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 7, "q": "How do you set up alerts for repository or workflow events in GitHub?", "a": [{"k": "p", "t": "Use the “Watch” settng for notifications. Configure Actions workflows to notify via email, chat, or external integrations using workflow steps or GitHub Apps."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 8, "q": "How can you export or integrate GitHub Insights data with other monitoring tools?", "a": [{"k": "p", "t": "Use the GitHub API to export data (commits, issues, traffic). Integrate with external tools (e.g., Azure Monitor, Power BI) using APIs or webhooks."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 9, "q": "What permissions are needed to view and configure Insights in a GitHub repository?", "a": [{"k": "p", "t": "Read access is sufficient for most Insights. Traffic stats require admin/owner rights. Only admins can manage feature availability."}]}, {"sub": "5.2.1", "st": "GitHub monitoring insights/charts", "n": 10, "q": "What are the limitations of GitHub Insights for monitoring production-grade DevOps environments?", "a": [{"k": "p", "t": "Insights are repository-scoped, lack advanced custom dashboards, and do not provide real-time or cross- repo observability. Use dedicated monitoring tools for advanced needs."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 1, "q": "What types of alerts can be configured in GitHub Actions and Azure Pipelines?", "a": [{"k": "p", "t": "Alerts include"}, {"k": "li", "t": "workflow/job failures,"}, {"k": "li", "t": "run duration warnings,"}, {"k": "li", "t": "environment deployment issues,"}, {"k": "li", "t": "and custom status checks."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 2, "q": "How do you configure alerts for failed workflows in GitHub Actions?", "a": [{"k": "p", "t": "By default, users receive notifications for workflow failures. Customize alerts using workflow steps (e.g., send email, Slack) or third-party Actions on failure."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 3, "q": "How do you set up alert notifications in Azure Pipelines?", "a": [{"k": "p", "t": "Use Project Settings → Notifications. Create subscriptions for pipeline run events (e.g., failures, approvals), set filters, and select recipients."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 4, "q": "What are the main channels for receiving alerts from GitHub Actions?", "a": [{"k": "p", "t": "Notifications can be received via"}, {"k": "li", "t": "email,"}, {"k": "li", "t": "GitHub web,"}, {"k": "li", "t": "mobile app,"}, {"k": "li", "t": "or external services (e.g., Slack, Teams) via custom workflow steps."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 5, "q": "How do you send custom alerts in a GitHub Actions workflow?", "a": [{"k": "p", "t": "Add steps to use Actions or scripts that trigger webhooks, emails, or chat notifications upon job failure or completion (e.g., actions/notify, curl to API)."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 6, "q": "How can you integrate Azure Pipelines alerts with external systems (e.g., Teams, Slack)?", "a": [{"k": "p", "t": "Use Service Hooks or add marketplace extensions (e.g., Slack, Teams connector) to send alerts on pipeline events to external channels."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 7, "q": "What are best practices for actionable alerting in CI/CD pipelines?", "a": [{"k": "li", "t": "Alert only on actionable events (e.g., failures, blocking approvals),"}, {"k": "li", "t": "avoid excessive noise,"}, {"k": "li", "t": "include context (run links, error details),"}, {"k": "li", "t": "and direct alerts to responsible teams."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 8, "q": "How do you suppress or customize notification frequency in GitHub Actions and Azure Pipelines?", "a": [{"k": "p", "t": "Configure personal and project notification settngs to mute, group, or restrict alerts to certain event types or severities."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 9, "q": "What permissions are required to configure alert rules in GitHub Actions and Azure Pipelines?", "a": [{"k": "li", "t": "Repository write/admin access is needed for workflow modification in GitHub Actions."}, {"k": "li", "t": "In Azure Pipelines, project admin or manage notifications permission is required."}]}, {"sub": "5.2.2", "st": "Alerts in GitHub Actions and Azure Pipelines", "n": 10, "q": "What limitations exist with built-in alerting in GitHub Actions and Azure Pipelines?", "a": [{"k": "p", "t": "Built-in alerting is basic: lacks advanced filtering, grouping, or cross-project aggregation. Use external monitoring or notification platforms for advanced scenarios."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 1, "q": "What tools are available in Azure to inspect CPU, memory, disk, and network metrics?", "a": [{"k": "p", "t": "Azure Monitor and Azure Log Analytics provide core infrastructure metrics. VM Insights and Container Insights give detailed metrics for VMs and containers."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 2, "q": "How do you enable and configure monitoring for infrastructure metrics in Azure?", "a": [{"k": "p", "t": "Enable monitoring by installing the Azure Monitor Agent or Log Analytics agent on your resources. Register your VM or container to a Log Analytics workspace and enable Insights as required."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 3, "q": "Where are infrastructure metrics (CPU, memory, disk, network) visualized in the Azure portal?", "a": [{"k": "p", "t": "Metrics are visualized in Azure Monitor under “Metrics” or via “Insights” tabs on VM/Container resources. Dashboards can aggregate multiple metrics for quick visibility."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 4, "q": "How do you set up alerts for CPU, memory, disk, or network thresholds in Azure Monitor?", "a": [{"k": "p", "t": "Create an Alert Rule in Azure Monitor. Define a condition (e.g., CPU > 80%), set the evaluation period, and assign an action group for notifications (email, SMS, webhook, etc.)."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 5, "q": "What is the difference between Azure Metrics and Azure Logs for infrastructure monitoring?", "a": [{"k": "p", "t": "Metrics provide near real-time numeric time series (e.g., CPU percentage), optimized for performance. Logs provide richer, queryable telemetry (e.g., event details), useful for diagnostics and historical analysis."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 6, "q": "How can Application Insights be used for infrastructure telemetry?", "a": [{"k": "p", "t": "Application Insights primarily collects app-level telemetry, but can be extended to include infrastructure metrics by connecting to Azure Monitor or configuring custom telemetry ingestion."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 7, "q": "What are best practices for monitoring high CPU usage in Azure VMs?", "a": [{"k": "p", "t": "Set alerts for sustained high CPU usage, review resource utilization in Metrics Explorer, investigate running processes, and scale up/out as required."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 8, "q": "How do you collect and analyze performance counters for Azure resources?", "a": [{"k": "p", "t": "Enable collection of performance counters using the Log Analytics agent. Use Log Analytics workspace to query and analyze the data (e.g., Perf table for Windows/Linux metrics)."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 9, "q": "What are the recommended retention and sampling settngs for metrics?", "a": [{"k": "p", "t": "Use default retention (typically 93 days for metrics, 30 days for logs, extendable as needed). Set sampling for logs and custom metrics to balance cost and granularity."}]}, {"sub": "5.3.1", "st": "Inspect: CPU, memory, disk, network", "n": 10, "q": "How do you diagnose and troubleshoot resource botlenecks using collected telemetry?", "a": [{"k": "li", "t": "Correlate spikes in CPU, memory, disk, or network metrics with application and OS logs."}, {"k": "li", "t": "Use Log Analytics queries to identify paterns and root causes."}, {"k": "li", "t": "Review recommendations in Azure Advisor and Insights for optimization actions."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 1, "q": "What Azure tools are used to analyze application usage and performance metrics?", "a": [{"k": "p", "t": "Azure Application Insights and Azure Monitor are the primary tools. They provide telemetry on usage, performance, failures, and dependencies."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 2, "q": "How do you enable application performance monitoring in Azure?", "a": [{"k": "p", "t": "Install and configure the Application Insights SDK or use the Azure Monitor agent. Enable monitoring from the Azure portal or through instrumentation in application code."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 3, "q": "What types of application usage metrics can be collected in Azure?", "a": [{"k": "p", "t": "You can collect"}, {"k": "li", "t": "request counts,"}, {"k": "li", "t": "response times,"}, {"k": "li", "t": "failed requests,"}, {"k": "li", "t": "user sessions,"}, {"k": "li", "t": "page views,"}, {"k": "li", "t": "custom events,"}, {"k": "li", "t": "and dependency calls."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 4, "q": "How do you visualize and interpret performance metrics in Application Insights?", "a": [{"k": "p", "t": "Use the Application Insights “Metrics” and “Performance” blades for charts and tables. Review response time distributions, failure trends, and drill into specific requests or dependencies."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 5, "q": "How do you configure custom metrics and events in Application Insights?", "a": [{"k": "p", "t": "Track custom metrics or events using the Application Insights SDK. Use methods like"}, {"k": "li", "t": "TrackEvent,"}, {"k": "li", "t": "TrackMetric,"}, {"k": "li", "t": "or TrackException in your application code."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 6, "q": "What is the difference between availability, performance, and usage metrics?", "a": [{"k": "li", "t": "Availability metrics show if an app is up and responding."}, {"k": "li", "t": "Performance metrics measure speed (response times, resource usage)."}, {"k": "li", "t": "Usage metrics show how the app is used (sessions, users, page views)."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 7, "q": "How do you set up alerts based on application performance thresholds?", "a": [{"k": "p", "t": "In Application Insights or Azure Monitor, create an alert rule, define the target metric (e.g., response time > 1s), and assign an Action Group for notifications."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 8, "q": "How can you use Kusto Query Language (KQL) to analyze usage and performance data?", "a": [{"k": "p", "t": "Use Log Analytics or Application Insights “Logs” to write KQL queries. Query tables like requests, dependencies, traces, and visualize results or export data."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 9, "q": "What best practices should be followed when monitoring distributed applications?", "a": [{"k": "li", "t": "Instrument all services,"}, {"k": "li", "t": "use distributed tracing,"}, {"k": "li", "t": "correlate telemetry via operation IDs,"}, {"k": "li", "t": "set up centralized dashboards"}, {"k": "li", "t": "and alerts across services."}]}, {"sub": "5.3.2", "st": "Analyze app usage/performance metrics", "n": 10, "q": "How do you diagnose and resolve application performance botlenecks using Azure telemetry?", "a": [{"k": "li", "t": "Analyze slow requests and dependencies in Application Insights,"}, {"k": "li", "t": "review end-to-end transaction views,"}, {"k": "li", "t": "use failure and performance charts,"}, {"k": "li", "t": "and drill into traces to find root causes. Optimize code, resources, or dependencies based on findings."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 1, "q": "What is distributed tracing and why is it critical in microservices or cloud-native architectures?", "a": [{"k": "p", "t": "Distributed tracing is tracking a request as it flows across multiple services or components. It is critical in microservices/cloud-native environments to identify botlenecks, diagnose failures, and understand dependencies across distributed systems."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 2, "q": "How does Application Insights implement distributed tracing?", "a": [{"k": "p", "t": "Application Insights uses correlation IDs injected into telemetry (requests, dependencies, exceptions) to automatically track and link operations across components and services."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 3, "q": "What are key telemetry types collected by App Insights for distributed tracing?", "a": [{"k": "p", "t": "Key telemetry types:"}, {"k": "li", "t": "Request telemetry (incoming HTTP requests),"}, {"k": "li", "t": "Dependency telemetry (calls to databases, HTTP, services),"}, {"k": "li", "t": "Exception telemetry,"}, {"k": "li", "t": "Trace telemetry (logs),"}, {"k": "li", "t": "and Custom telemetry (events, metrics)."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 4, "q": "How do you instrument .NET/Java/Node.js applications for distributed tracing with App Insights?", "a": [{"k": "p", "t": "Use Application Insights SDK or agents."}, {"k": "li", "t": ".NET: Install the NuGet package or enable with Application Insights Agent."}, {"k": "li", "t": "Java: Use Application Insights Java agent."}, {"k": "li", "t": "Node.js: Use the npm package. Configuration auto-instruments most frameworks."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 5, "q": "What is an operation ID and how does it correlate telemetry across services?", "a": [{"k": "p", "t": "An operation ID is a unique identifier assigned to each end-to-end request. It propagates across services via headers, allowing App Insights to correlate telemetry events for a single operation."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 6, "q": "How are dependencies and requests visualized in the App Insights Application Map?", "a": [{"k": "p", "t": "Application Map displays detected components and dependencies as a graph, showing request flow, health, response times, and failure hotspots, enabling quick drill-down into distributed traces."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 7, "q": "How can you query distributed traces in Application Insights using Kusto Query Language (KQL)?", "a": [{"k": "p", "t": "Use the traces, requests, and dependencies tables in Log Analytics. Query by operation_Id to retrieve and analyze related events across services for a given distributed trace."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 8, "q": "How do you set up automatic vs. manual correlation for custom telemetry in distributed tracing?", "a": [{"k": "p", "t": "Automatic correlation is handled by the SDK/agent for supported frameworks. For custom telemetry, set the operation_Id and parent_Id explicitly when tracking events to maintain trace linkage."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 9, "q": "What are best practices to minimize trace sampling impact and maximize troubleshooting value?", "a": [{"k": "p", "t": "Use adaptive sampling to balance telemetry volume and cost. Always capture telemetry for errors/exceptions. Tune sampling rates as needed to ensure critical traces are retained for troubleshooting."}]}, {"sub": "5.3.3", "st": "Distributed tracing with App Insights", "n": 10, "q": "How do you integrate distributed tracing from App Insights with Azure Monitor or third-party observability tools?", "a": [{"k": "p", "t": "Enable integration by configuring Diagnostic settngs to export logs/metrics to Azure Monitor or Log Analytics. Use OpenTelemetry exporters or API integrations for third-party tools."}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 1, "q": "What is Kusto Query Language (KQL) and where is it used in Azure DevOps monitoring?", "a": [{"k": "p", "t": "KQL is a read-only query language for analyzing large volumes of structured, semi-structured, and unstructured data stored in Azure Data Explorer, Log Analytics, and Application Insights."}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 2, "q": "What are the main KQL data tables relevant for Application Insights?", "a": [{"k": "p", "t": "Common tables: requests, dependencies, exceptions, traces, customEvents, and availabilityResults."}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 3, "q": "How do you write a basic query to retrieve request telemetry in KQL?", "a": [{"k": "p", "t": "requests | take 10"}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 4, "q": "What is the syntax for filtering, projecting, and ordering data in KQL?", "a": [{"k": "p", "t": "Use where to filter, project to select columns, and order by to sort. Example: requests | where resultCode == \"500\" | project timestamp, name, url | order by timestamp desc"}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 5, "q": "How do you aggregate and summarize data using KQL?", "a": [{"k": "p", "t": "Use summarize for aggregation. Example: requests | summarize count() by resultCode"}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 6, "q": "How can you join multiple tables in KQL for advanced insights?", "a": [{"k": "p", "t": "Use the join operator. Example: requests | join kind=inner (dependencies) on operation_Id"}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 7, "q": "What functions are available in KQL to parse and extract fields from logs?", "a": [{"k": "p", "t": "Functions: parse, extract, split, substring, tostring. Example: traces | extend errorType = extract(\"Error: (.*)\", 1, message)"}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 8, "q": "How do you visualize query results in Azure Monitor using KQL?", "a": [{"k": "p", "t": "Run the KQL query and select visualization options (time chart, pie, table) from the UI toolbar."}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 9, "q": "What are common pitfalls and best practices for writing efficient KQL queries?", "a": [{"k": "li", "t": "Pitfalls: Large scans, missing filters, unnecessary joins."}, {"k": "li", "t": "Best practices: o Filter early, o project only needed fields, o use summarization, o  and test queries for performance."}]}, {"sub": "5.3.4", "st": "Kusto Query Language (KQL) basics", "n": 10, "q": "How do you save and share KQL queries in Azure Monitor or Application Insights?", "a": [{"k": "p", "t": "Use \"Save\" or \"Pin to dashboard\" in the query editor. Share query links or save as a shared workbook for collaboration."}]}], "toc": [{"name": "1. Design and implement processes and communications", "groups": [{"id": "1.1", "title": "Design and implement traceability and flow of work", "subs": [{"id": "1.1.1", "title": "Design and implement GitHub Flow", "start": 0, "count": 10}, {"id": "1.1.2", "title": "Design and implement feedback cycles", "start": 10, "count": 10}, {"id": "1.1.3", "title": "Integrate GitHub Projects, Azure Boards, repositories", "start": 20, "count": 10}, {"id": "1.1.4", "title": "Implement source, bug, and quality traceability", "start": 30, "count": 10}]}, {"id": "1.2", "title": "Metrics and queries for DevOps", "subs": [{"id": "1.2.1", "title": "Dashboards: cycle time, time to recovery, lead time", "start": 40, "count": 10}, {"id": "1.2.2", "title": "Metrics/queries for: planning, development, testing, security, delivery, operations", "start": 50, "count": 10}]}, {"id": "1.3", "title": "Configure collaboration and communication", "subs": [{"id": "1.3.1", "title": "Document projects with wikis and diagrams", "start": 60, "count": 10}, {"id": "1.3.2", "title": "Configure Release Documentation", "start": 70, "count": 10}, {"id": "1.3.3", "title": "Automate documentation from Git history", "start": 80, "count": 10}, {"id": "1.3.4", "title": "Integrate using webhooks, GitHub/Azure Boards, Teams", "start": 90, "count": 10}]}]}, {"name": "2. Source control strategy", "groups": [{"id": "2.1", "title": "Branching and workflows", "subs": [{"id": "2.1.1", "title": "Branch strategies: trunk-based, feature, release", "start": 100, "count": 10}, {"id": "2.1.2", "title": "Pull request workflows with policies", "start": 110, "count": 10}, {"id": "2.1.3", "title": "Branch protections and merge restrictions", "start": 120, "count": 10}]}, {"id": "2.2", "title": "Repository Configuration and Maintenance", "subs": [{"id": "2.2.1", "title": "Manage large Files (GIT LFS, git-fat)", "start": 130, "count": 10}, {"id": "2.2.2", "title": "Optimize scaling", "start": 140, "co and Azure Pipelines", "start": 660, "count": 10}]}, {"id": "5.3", "title": "", "subs": [{"id": "5.3.1", "title": "Inspect: CPU, memory, disk, network", "start": 670, "count": 10}, {"id": "5.3.2", "title": "Analyze app usage/performance metrics", "start": 680, "count": 10}, {"id": "5.3.3", "title": "Distributed tracing with App Insights", "start": 690, "count": 10}, {"id": "5.3.4", "title": "Kusto Query Language (KQL) basics", "start": 700, "count": 10}]}]}]};
const cards = DATA.cards;
const total = cards.length;
const deck = document.getElementById("deck");
const counter = document.getElementById("counter");
const bar = document.getElementById("bar");
const tocBox = document.getElementById("toc");
const tocBody = document.getElementById("toc-body");
let current = -1;
let frame = 0;

const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function renderAnswer(blocks) {
  let html = "";
  let inList = false;
  for (const b of blocks) {
    if (b.k === "li") {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${esc(b.t)}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    html += b.k === "step" ? `<div class="step">${esc(b.t)}</div>` : `<p>${esc(b.t)}</p>`;
  }
  return inList ? html + "</ul>" : html;
}

deck.innerHTML = cards.map((c, i) => `
  <section class="slide" aria-label="Card ${i + 1} of ${total}">
    <article class="card revealed">
      <header class="card-head"><span>${esc(c.sub)} ${esc(c.st)}</span><span>Q${c.n}</span></header>
      <div class="card-body">
        <div class="question">${esc(c.q)}</div>
        <div class="card-hint">Tap to show answer</div>
        <div class="answer">${renderAnswer(c.a)}</div>
      </div>
    </article>
  </section>`).join("");

tocBody.innerHTML = DATA.toc.map(cat => `
  <div class="toc-cat">${esc(cat.name)}</div>
  ${cat.groups.map(g => `
    <div class="toc-group">${esc(g.id)} ${esc(g.title)}</div>
    ${g.subs.map(s => `<a href="#" data-start="${s.start}" data-end="${s.start + s.count - 1}"><span>${esc(s.id)} ${esc(s.title)}</span><span class="cnt">${s.count}</span></a>`).join("")}`).join("")}`).join("");
const links = [...tocBody.querySelectorAll("a")];

function setIndex(i) {
  i = Math.max(0, Math.min(total - 1, i));
  if (i === current) return;
  current = i;
  counter.textContent = `${i + 1} / ${total}`;
  bar.style.width = `${((i + 1) / total) * 100}%`;
  for (const a of links) {
    a.classList.toggle("active", i >= +a.dataset.start && i <= +a.dataset.end);
  }
}

function go(i, smooth = true) {
  i = Math.max(0, Math.min(total - 1, i));
  deck.scrollTo({ left: i * deck.clientWidth, behavior: smooth ? "smooth" : "auto" });
  setIndex(i);
}

deck.addEventListener("scroll", () => {
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(() => setIndex(Math.round(deck.scrollLeft / deck.clientWidth)));
}, { passive: true });

deck.addEventListener("click", e => {
  if (e.target.closest(".answer") || String(getSelection())) return;
  const card = e.target.closest(".card");
  if (card) card.classList.toggle("revealed");
});

document.getElementById("prev").addEventListener("click", () => go(current - 1));
document.getElementById("next").addEventListener("click", () => go(current + 1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") go(current - 1);
  if (e.key === "ArrowRight") go(current + 1);
});

tocBody.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  go(+a.dataset.start, false);
  if (window.innerWidth < 700) tocBox.open = false;
});

window.addEventListener("resize", () => go(current, false));
tocBox.open = window.innerWidth >= 700;
setIndex(0);
</script>
