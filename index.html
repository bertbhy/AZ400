<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ-400 Flashcards</title>
<style>
:root { --bg:#f3f5fa; --card:#ffffff; --text:#1d2433; --muted:#6b7385; --accent:#0a6cdb; --line:#dde2ec; --ans:#eaf3ff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#13161e; --card:#1d2230; --text:#e8ebf2; --muted:#9aa3b5; --accent:#5aa9ff; --line:#2c3445; --ans:#1b2a42; }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
}
.top { padding: 14px 16px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 1.15rem; }
.hint-top { margin: 2px 0 8px; color: var(--muted); font-size: .85rem; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
#bar { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; }
.toc-body { max-height: 35vh; overflow-y: auto; margin-top: 6px; -webkit-overflow-scrolling: touch; }
.toc-cat { margin: 12px 0 4px; font-weight: 700; font-size: .95rem; }
.toc-group { margin: 8px 0 2px 6px; font-size: .85rem; color: var(--muted); font-weight: 600; }
.toc-body a {
  display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px 7px 16px;
  color: var(--text); text-decoration: none; border-radius: 8px; font-size: .9rem;
}
.toc-body a.active, .toc-body a:hover { background: var(--ans); }
.toc-body .cnt { color: var(--muted); flex: 0 0 auto; }
.stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.deck {
  flex: 1; min-height: 360px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.deck::-webkit-scrollbar { display: none; }
.slide {
  flex: 0 0 100%; min-width: 0; display: flex; padding: 14px; scroll-snap-align: start; scroll-snap-stop: always;
}
.card {
  flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card);
  border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.08); overflow: hidden;
}
.card-head {
  display: flex; justify-content: space-between; gap: 10px; padding: 14px 18px 0;
  font-size: .78rem; color: var(--muted);
}
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 18px 20px; -webkit-overflow-scrolling: touch; }
.question { font-size: 1.2rem; font-weight: 650; line-height: 1.4; }
.card-hint { margin-top: 18px; text-align: center; color: var(--muted); font-size: .9rem; }
.card.revealed .card-hint { display: none; }
.answer {
  display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px;
  background: var(--ans); font-size: .98rem; line-height: 1.55;
}
.card.revealed .answer { display: block; }
.answer p, .answer .step { margin: 0 0 8px; }
.answer ul { margin: 0 0 8px; padding-left: 20px; }
.answer li { margin-bottom: 4px; }
.controls {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
}
.controls button {
  min-width: 64px; height: 44px; border: 0; border-radius: 12px; background: var(--accent);
  color: #fff; font-size: 1.4rem; cursor: pointer;
}
#counter { font-variant-numeric: tabular-nums; color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <h1>AZ-400 Flashcards</h1>
  <div class="hint-top">Swipe or use the arrows. Tap a card to hide or show its answer.</div>
  <div class="bar"><div id="bar"></div></div>
  <details id="toc">
    <summary>Table of contents</summary>
    <nav class="toc-body" id="toc-body"></nav>
  </details>
</header>
<main class="stage">
  <div class="deck" id="deck"></div>
  <div class="controls">
    <button id="prev" type="button" aria-label="Previous card">&#8249;</button>
    <span id="counter"></span>
    <button id="next" type="button" aria-label="Next card">&#8250;</button>
  </div>
</main>
<script>
const DATA = {"cards": [{"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 1, "q": "What is GitHub Flow and how does it differ from Git Flow?", "a": [{"k": "p", "t": "GitHub Flow is a lightweight, trunk-based workflow focused on continuous delivery using a main branch and short-lived feature branches. Unlike Git Flow, it avoids long-lived branches like develop or release."}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 2, "q": "What are the steps of a standard GitHub Flow?", "a": [{"k": "step", "t": "1. Create a feature branch from main"}, {"k": "step", "t": "2. Make and commit changes locally"}, {"k": "step", "t": "3. Push the branch to GitHub"}, {"k": "step", "t": "4. Open a pull request (PR)"}, {"k": "step", "t": "5. Review, approve, and merge the PR"}, {"k": "step", "t": "6. Automatically or manually deploy after merge"}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 3, "q": "How do you implement branch protections in GitHub?", "a": [{"k": "p", "t": "In repository settngs > Branches:"}, {"k": "li", "t": "Require PR reviews before merging"}, {"k": "li", "t": "Require status checks to pass"}, {"k": "li", "t": "Restrict who can push to the branch"}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 4, "q": "How are pull request (PR) reviews enforced in GitHub repositories?", "a": [{"k": "p", "t": "Enable “Require pull request reviews before merging” under branch protection rules. You can specify required reviewers and enforce code owner review."}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 5, "q": "What are status checks and how are they configured in GitHub Actions?", "a": [{"k": "p", "t": "Status checks are CI workflows (e.g., build/test) that must pass before a PR can be merged. Define them in .github/workflows/*.yml and mark them as required in branch protection settngs."}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 6, "q": "How can you automate deployments with GitHub Actions during GitHub Flow?", "a": [{"k": "p", "t": "Use workflows triggered on push or pull_request events. Use jobs and steps to deploy to environments like Azure or AWS. Example: on: push to main → deploy job runs → production environment"}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 7, "q": "How do environment protection rules function in GitHub workflows?", "a": [{"k": "p", "t": "They restrict deployment via GitHub Actions. Configure environments with:"}, {"k": "li", "t": "Required reviewers"}, {"k": "li", "t": "Wait timer"}, {"k": "li", "t": "Custom deployment branches"}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 8, "q": "How do you manage secrets and credentials in GitHub Actions?", "a": [{"k": "p", "t": "Store secrets in Repository Settings > Secrets and variables > Actions. Access them using ${{ secrets.SECRET_NAME }} in workflow YAML."}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 9, "q": "What are best practices for committng code in a GitHub Flow process?", "a": [{"k": "li", "t": "Use atomic commits (one change per commit)"}, {"k": "li", "t": "Write clear commit messages"}, {"k": "li", "t": "Rebase before merging"}, {"k": "li", "t": "Avoid pushing directly to main"}]}, {"sub": "1.1.1", "st": "Design and implement GitHub Flow", "n": 10, "q": "How do you roll back changes in GitHub Flow?", "a": [{"k": "p", "t": "Use git revert to create a new commit that undoes changes. Push the revert commit and merge via PR, triggering redeployment if needed."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 1, "q": "What are feedback cycles in DevOps and why are they critical?", "a": [{"k": "p", "t": "Feedback cycles provide continuous insights (build status, test results, deployment issues) to developers, enabling rapid detection and correction, reducing lead time and improving quality."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 2, "q": "How do you configure notifications in Azure DevOps pipelines?", "a": [{"k": "p", "t": "Go to Project Settings → Notifications → Create Subscription → Select event (e.g., build failure) → Define filters (e.g., pipeline name) → Set recipients (users or groups)."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 3, "q": "How do you set up GitHub issue automation for feedback tracking?", "a": [{"k": "p", "t": "Use GitHub Actions with actions/create-issue or similar to automatically open issues on failures, e.g., test failures or workflow errors, linking to logs or artifacts."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 4, "q": "What integrations are available between GitHub issues and Azure Boards?", "a": [{"k": "p", "t": "Install the Azure Boards GitHub app → Link repos → Use linked commits, PRs, and issues to automatically update Azure Boards work items for traceability."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 5, "q": "How do you configure branch protections with required status checks for feedback?", "a": [{"k": "p", "t": "In GitHub → Settngs → Branches → Add branch protection rule → Enable required status checks (e.g., CI pipeline) → Ensure passing checks before merging."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 6, "q": "How do you use GitHub Actions to automate issue creation on failure?", "a": [{"k": "p", "t": "In a workflow, use a jobs.<job>.if: failure() condition → Add a step using a GitHub token to call the REST API or a prebuilt action like peter-evans/create-issue."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 7, "q": "What are the best practices for actionable notification configuration?", "a": [{"k": "p", "t": "Notify only relevant users/groups, include clear context (links to builds, commits), avoid noise (e.g., no “success” spam), and prioritize critical failures."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 8, "q": "How can you integrate feedback from Azure Monitor into GitHub or Azure DevOps?", "a": [{"k": "p", "t": "Use Azure Monitor Action Groups → Webhooks, Logic Apps, or Azure Functions → Post alerts as GitHub issues or Azure DevOps work items automatically."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 9, "q": "How do you set up pull request templates to improve developer feedback cycles?", "a": [{"k": "p", "t": "In .github/PULL_REQUEST_TEMPLATE.md, define required sections (e.g., linked issues, testing done) to standardize information and reduce reviewer cycles."}]}, {"sub": "1.1.2", "st": "Design and implement feedback cycles", "n": 10, "q": "How do service hooks enable automated feedback loops across tools?", "a": [{"k": "p", "t": "Service hooks in Azure DevOps or GitHub connect events (build failures, PR updates) to external systems like Slack, Teams, or custom webhooks, triggering automated feedback."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 1, "q": "What are the benefits of integrating GitHub Projects with Azure Boards?", "a": [{"k": "li", "t": "Enables end-to-end traceability between code, pull requests, and work items."}, {"k": "li", "t": "Facilitates agile planning and tracking using Azure Boards while developing in GitHub."}, {"k": "li", "t": "Automatically updates work items from GitHub activity, increasing visibility and reducing manual effort."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 2, "q": "How do you connect a GitHub repository to Azure Boards?", "a": [{"k": "li", "t": "Install the Azure Boards app for GitHub from the GitHub Marketplace."}, {"k": "li", "t": "Authorize the app and select the repository."}, {"k": "li", "t": "In Azure Boards, link the GitHub repository using Project Settings > GitHub Connections."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 3, "q": "What permissions are required to enable GitHub–Azure Boards integration?", "a": [{"k": "li", "t": "You need admin permissions on the GitHub repository."}, {"k": "li", "t": "You must have at least Basic access to the Azure DevOps project."}, {"k": "li", "t": "The Azure Boards app must be authorized with appropriate OAuth permissions to access repos and metadata."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 4, "q": "How do you automatically link GitHub commits and pull requests to Azure Boards work items?", "a": [{"k": "li", "t": "Use the syntax AB#{work item ID} or Fixes AB#{work item ID} in commit messages or PR titles/descriptions."}, {"k": "li", "t": "Linked work items are updated automatically in Azure Boards with commit and PR information."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 5, "q": "How can you synchronize work item state between Azure Boards and GitHub Projects?", "a": [{"k": "li", "t": "Changes to linked work items in Azure Boards are not automatically reflected in GitHub Projects."}, {"k": "li", "t": "Manual updates or third-party automation (e.g., GitHub Actions or Azure Logic Apps) are needed for bi-directional state sync."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 6, "q": "What are best practices for maintaining traceability between code and work items?", "a": [{"k": "li", "t": "Always reference work item IDs in commit messages and PRs."}, {"k": "li", "t": "Use branch naming conventions (e.g., feature/AB#123-description)."}, {"k": "li", "t": "Enforce PR templates that require work item linkage."}, {"k": "li", "t": "Periodically audit links between code and work items."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 7, "q": "How do you configure automation between GitHub issues and Azure Boards?", "a": [{"k": "li", "t": "Use Azure Logic Apps or GitHub Actions to create workflows that create or update Azure Boards work items based on GitHub issue events."}, {"k": "li", "t": "Service hooks in Azure Boards can trigger actions in response to GitHub issue activity."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 8, "q": "What are common troubleshooting steps if integration fails?", "a": [{"k": "li", "t": "Verify Azure Boards app is installed and authorized in GitHub."}, {"k": "li", "t": "Check repository and user permissions in both GitHub and Azure DevOps."}, {"k": "li", "t": "Ensure the repository is correctly linked in Azure Boards settngs."}, {"k": "li", "t": "Review integration logs in Azure DevOps for errors."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 9, "q": "How do you use service hooks/webhooks to enhance integration?", "a": [{"k": "li", "t": "Configure service hooks in Azure DevOps to send updates to external systems (like GitHub or Teams) based on work item changes."}, {"k": "li", "t": "Set up GitHub webhooks to trigger automation in response to repo or issue events."}]}, {"sub": "1.1.3", "st": "Integrate GitHub Projects, Azure Boards, repositories", "n": 10, "q": "What limitations exist when integrating GitHub Projects, Azure Boards, and repositories?", "a": [{"k": "li", "t": "Work item state is not bi-directionally synced by default."}, {"k": "li", "t": "Some features (e.g., advanced queries or cross-org integration) may not be supported."}, {"k": "li", "t": "Large numbers of repositories may require individual configuration."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 1, "q": "What is traceability in DevOps and why is it important?", "a": [{"k": "li", "t": "Traceability is the ability to track work items, code changes, bugs, and test results throughout the development lifecycle."}, {"k": "li", "t": "It ensures transparency, accountability, fast root cause analysis, supporting compliance."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 2, "q": "How do you link code changes to work items in Azure DevOps and GitHub?", "a": [{"k": "li", "t": "In Azure DevOps, include the work item ID in commit messages, PR titles, or branch names (e.g., #123)."}, {"k": "li", "t": "In GitHub, use keywords like Fixes #123 in commits or PRs to link issues."}, {"k": "li", "t": "Both platforms automatically update the work item or issue with commit and PR references."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 3, "q": "How is bug traceability achieved in modern DevOps workflows?", "a": [{"k": "li", "t": "Bugs are tracked as work items/issues in Azure Boards or GitHub Issues."}, {"k": "li", "t": "Link code commits and PRs to these bugs using IDs or keywords."}, {"k": "li", "t": "Automated and manual test results can be associated with bug work items to show resolution status."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 4, "q": "What tools and features enable quality traceability across pipelines?", "a": [{"k": "li", "t": "Azure DevOps Test Plans, GitHub Actions, and pipeline integrations enable linking test runs, results, and code changes to work items."}, {"k": "li", "t": "Test results, code coverage, and release status can be tracked and visualized against user stories and bugs."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 5, "q": "How do you visualize traceability from source code to deployment?", "a": [{"k": "li", "t": "Use Azure DevOps traceability views, queries, or built-in dashboards to follow links from work items to code commits, builds, releases, and test results."}, {"k": "li", "t": "Custom dashboards and reports can be built using Power BI or Azure DevOps Analytics for full traceability visualization."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 6, "q": "What practices ensure end-to-end traceability for compliance and audits?", "a": [{"k": "li", "t": "Enforce linking of every code change and deployment to a tracked work item or requirement."}, {"k": "li", "t": "Require automated association of test results and bugs to work items in pipelines."}, {"k": "li", "t": "Maintain detailed audit trails and use approval workflows."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 7, "q": "How can automated testing results be linked to work items and requirements?", "a": [{"k": "li", "t": "Configure pipelines to associate test runs with specific work items."}, {"k": "li", "t": "Use test case management features in Azure DevOps to map test cases to requirements."}, {"k": "li", "t": "Automated test tools can update work items with results using REST APIs or extensions."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 8, "q": "What are common pitfalls in traceability implementation?", "a": [{"k": "li", "t": "Inconsistent work item references in commits/PRs."}, {"k": "li", "t": "Lack of enforcement on associating code changes with work items."}, {"k": "li", "t": "Poor test case management or missing links between tests and requirements."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 9, "q": "How do you configure dashboards or reports to show traceability status?", "a": [{"k": "li", "t": "In Azure DevOps, use built-in widgets and queries to display links between work items, code, tests, and releases."}, {"k": "li", "t": "Power BI can connect to Azure DevOps Analytics for advanced, custom traceability reporting."}]}, {"sub": "1.1.4", "st": "Implement source, bug, and quality traceability", "n": 10, "q": "What limitations should be considered when implementing traceability?", "a": [{"k": "li", "t": "Full automation may not cover all scenarios; some manual linking may be required."}, {"k": "li", "t": "Cross-tool traceability (e.g., between GitHub and Azure Boards) may require custom integration or third-party tools."}, {"k": "li", "t": "Visualization and reporting capabilities may be limited by platform or data availability."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 1, "q": "What are cycle time, lead time, and time to recovery in DevOps, and how do they differ?", "a": [{"k": "li", "t": "Cycle time: Time from starting work on a task to completion (e.g., first commit to deployment)."}, {"k": "li", "t": "Lead time: Time from when a request is made (work item created) to its delivery (deployment)."}, {"k": "li", "t": "Time to recovery (MTTR): Time taken to restore service after a production failure."}, {"k": "li", "t": "Difference: Lead time includes all waiting; cycle time starts when actual work begins. MTTR focuses on incident recovery only."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 2, "q": "How do you configure dashboards in Azure DevOps to visualize these metrics?", "a": [{"k": "li", "t": "Go to Azure DevOps project > Dashboards > New Dashboard."}, {"k": "li", "t": "Add widgets such as Cycle Time, Lead Time, and Query Results."}, {"k": "li", "t": "Configure each widget to target the correct team/project and backlog level."}, {"k": "li", "t": "Save and share the dashboard as needed."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 3, "q": "Which built-in widgets are used to track cycle time, lead time, and time to recovery in Azure DevOps?", "a": [{"k": "li", "t": "Cycle Time widget: Shows average time from “In Progress” to “Done.”"}, {"k": "li", "t": "Lead Time widget: Displays time from creation to completion."}, {"k": "li", "t": "Query Results widget: Can be customized to show MTTR based on resolved incidents or bug work items."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 4, "q": "What is the process for adding custom queries for metric visualization in Azure DevOps dashboards?", "a": [{"k": "li", "t": "Go to Boards > Queries > New Query."}, {"k": "li", "t": "Define criteria (e.g., State changes, tags for incidents)."}, {"k": "li", "t": "Save and run the query."}, {"k": "li", "t": "Add the Query Results widget to a dashboard and link it to the saved query for visualization."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 5, "q": "How can you monitor these metrics using GitHub Insights or GitHub Projects?", "a": [{"k": "li", "t": "GitHub Insights (in GitHub Enterprise) provides charts for lead time and cycle time per repo."}, {"k": "li", "t": "GitHub Projects tracks issue and PR workflow states; custom fields and automation can approximate cycle/lead time."}, {"k": "li", "t": "External tools (e.g., Azure DevOps, third-party analytics) can be integrated for MTTR tracking."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 6, "q": "What actions can reduce cycle time and lead time in a DevOps workflow?", "a": [{"k": "li", "t": "Automate builds, tests, and deployments."}, {"k": "li", "t": "Use small, incremental changes (shorter PRs)."}, {"k": "li", "t": "Improve code review and approval process speed."}, {"k": "li", "t": "Minimize handoffs and blockers (clear ownership)."}, {"k": "li", "t": "Invest in high test coverage to catch issues early."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 7, "q": "How do you configure alerts for abnormal values in these metrics?", "a": [{"k": "li", "t": "In Azure DevOps, use Analytics views or Power BI integration for threshold-based alerts."}, {"k": "li", "t": "Configure dashboards with visual cues (color rules) for metric widgets."}, {"k": "li", "t": "Use Azure Monitor or Logic Apps to trigger notifications for breached thresholds."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 8, "q": "How is time to recovery (MTTR) tracked in Azure DevOps and GitHub?", "a": [{"k": "li", "t": "Azure DevOps: Use queries for work items marked as incidents/production bugs; calculate time from “Created” to “Resolved/Closed.”"}, {"k": "li", "t": "GitHub: Track incidents with labeled issues or PRs; use timestamps to calculate recovery duration manually or via automation."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 9, "q": "How should teams interpret trends and anomalies in these metrics for continuous improvement?", "a": [{"k": "li", "t": "Rising cycle/lead times indicate process botlenecks or resource issues."}, {"k": "li", "t": "Increasing MTTR signals gaps in incident response or recovery process."}, {"k": "li", "t": "Regular review in retrospectives supports targeted process improvement."}]}, {"sub": "1.2.1", "st": "Dashboards: cycle time, time to recovery, lead time", "n": 10, "q": "What are common pitfalls in configuring dashboards for DevOps metrics?", "a": [{"k": "li", "t": "Using inconsistent work item states or definitions across teams."}, {"k": "li", "t": "Not updating queries when workflows change."}, {"k": "li", "t": "Focusing on vanity metrics without actionable insights."}, {"k": "li", "t": "Failing to align dashboards to current team processes and priorities."}]}, {"sub": "1.2.2", "st": "Metrics/queries for: planning, development, testing, security, delivery, operations", "n": 1, "q": "What key metrics should be tracked for planning in Azure DevOps?", "a": [{"k": "li", "t": "Work item count (new, active, closed)."}, {"k": "li", "t": "Sprint/iteration velocity."}, {"k": "li", "t": "Burndown/burnup charts."}, {"k": "li", "t": "Forecast vs. actual completion."}, {"k": "li", "t": "Backlog health (aging, blocked items)."}]}, {"sub": "1.2.2", "st": "Metrics/queries for: planning, development, testing, security, delivery, operations", "n": 2, "q": "What queries help monitor development progress and code health?", "a": [{"k": "li", "t ice uptime and availability."}, {"k": "li", "t": "Performance indicators (CPU, memory, latency)."}]}, {"sub": "1.2.2", "st": "Metrics/queries for: planning, development, testing, security, delivery, operations", "n": 7, "q": "How do you build cross-area queries combining multiple DevOps stages?", "a": [{"k": "li", "t": "Use Azure DevOps Analytics Views or custom queries linking work items, builds, and releases."}, {"k": "li", "t": "Apply area paths, tags, or shared fields across queries to correlate stages."}, {"k": "li", "t": "Combine results in Power BI or dashboards."}]}, {"sub": "1.2.2", "st": "Metrics/queries for: planning, development, testing, security, delivery, operations", "n": 8, "q": "What tools integrate with Azure DevOps to enhance metric reporting?", "a": [{"k": "li", "t": "Power BI (advanced visualization)."}, {"k": "li", "t": "Azure Monitor and Log Analytics (telemetry integration)."}, {"k": "li", "t": "Application Insights (app-level metrics)."}, {"k": "li", "t": "Third-party tools like SonarQube, WhiteSource (code quality, security)."}]}, {"sub": "1.2.2", "st": "Metrics/queries for: planning, development, testing, security, delivery, operations", "n": 9, "q": "How can you automate metric collection and reporting across stages?", "a": [{"k": "li", "t": "Use Azure Pipelines tasks to export metrics post-stage."}, {"k": "li", "t": "Set up scheduled Analytics View exports to Power BI or storage."}, {"k": "li", "t": "Leverage REST APIs to pull and aggregate data."}]}, {"sub": "1.2.2", "st": "Metrics/queries for: planning, development, testing, security, delivery, operations", "n": 10, "q": "What are best practices for maintaining accurate, actionable queries?", "a": [{"k": "li", "t": "Regularly review query definitions as processes evolve."}, {"k": "li", "t": "Use consistent naming, tags, and fields."}, {"k": "li", "t": "Validate data sources and update filters."}, {"k": "li", "t": "Focus on actionable, team-relevant metrics."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 1, "q": "What is the purpose of using wikis in DevOps projects?", "a": [{"k": "p", "t": "Wikis provide a central, version-controlled location for project documentation, enabling teams to capture knowledge, share processes, and onboard new members efficiently. They support transparency, collaboration, and traceability across the DevOps lifecycle."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 2, "q": "How do you create and manage a wiki in Azure DevOps?", "a": [{"k": "p", "t": "In Azure DevOps, create a wiki by selecting “Wiki” in the project sidebar, then clicking “Create Project Wiki” or “Publish code as wiki.” You can add, edit, or organize pages directly in the web interface or by editing markdown files in a code-backed wiki repository."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 3, "q": "What are best practices for structuring project documentation in a DevOps wiki?", "a": [{"k": "p", "t": "Structure documentation with clear hierarchy and navigation: use a home/landing page, group content by feature or topic, and keep pages concise. Regularly update docs, include diagrams, and ensure links between related pages for easy discoverability."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 4, "q": "How do you use Markdown syntax for documentation in Azure DevOps or GitHub wikis?", "a": [{"k": "p", "t": "Write documentation in plain text using Markdown (.md) files. Markdown provides formattng for headings, lists, code blocks, tables, links, and images. Both Azure DevOps and GitHub wikis support standard Markdown, allowing rich, readable content with minimal effort."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 5, "q": "What is Mermaid syntax, and how is it used in project documentation?", "a": [{"k": "p", "t": "Mermaid is a text-based diagramming syntax supported in Azure DevOps and GitHub wikis. It allows teams to create flowcharts, sequence diagrams, and other visualizations directly within Markdown by embedding code blocks marked with ```mermaid."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 6, "q": "How do you embed and update diagrams in project wikis?", "a": [{"k": "p", "t": "Embed diagrams by uploading image files and linking them using Markdown, or by using Mermaid code blocks for auto-generated diagrams. Update diagrams by editing the image file or updating the Mermaid code, ensuring version control and easy collaboration."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 7, "q": "How do you manage permissions and access control for wikis?", "a": [{"k": "p", "t": "In Azure DevOps, manage wiki permissions through Project Settings > Permissions. Assign read, edit, or administrative rights to users or groups. For code-based wikis, repository permissions determine access. In GitHub, wiki permissions follow repository settngs."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 8, "q": "What are best practices for keeping documentation up to date in fast-moving DevOps projects?", "a": [{"k": "li", "t": "Integrate documentation updates into the development workflow,"}, {"k": "li", "t": "review docs as part of pull requests,"}, {"k": "li", "t": "assign documentation ownership,"}, {"k": "li", "t": "and automate reminders or checks to prevent outdated content."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 9, "q": "How can you automate documentation updates from source control history?", "a": [{"k": "p", "t": "Use tools or scripts to generate or update release notes, changelogs, and API documentation from Git commit history or pull request descriptions. Automate documentation builds with CI pipelines to publish latest changes to wikis."}]}, {"sub": "1.3.1", "st": "Document projects with wikis and diagrams", "n": 10, "q": "What are the benefits of linking work items and documentation in Azure DevOps?", "a": [{"k": "p", "t": "Linking work items and documentation ensures traceability, provides context for features or issues, helps onboarding, and enables faster decision-making by centralizing information relevant to code, processes, and changes."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 1, "q": "What is release documentation, and why is it important in DevOps?", "a": [{"k": "p", "t": "Release documentation summarizes"}, {"k": "li", "t": "the changes,"}, {"k": "li", "t": "features,"}, {"k": "li", "t": "fixes, and known issues included in a deployment. It provides transparency, helps stakeholders understand what’s delivered, and supports"}, {"k": "li", "t": "troubleshooting,"}, {"k": "li", "t": "compliance,"}, {"k": "li", "t": "and audit requirements."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 2, "q": "How do you generate release notes automatically in Azure DevOps?", "a": [{"k": "p", "t": "Use the Azure DevOps Release Notes extension or pipeline tasks to extract information from work items, commits, and pull requests. Configure templates to format notes and publish them as part of the release pipeline."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 3, "q": "What information should be included in release notes?", "a": [{"k": "p", "t": "Include"}, {"k": "li", "t": "new features,"}, {"k": "li", "t": "bug fixes,"}, {"k": "li", "t": "improvements,"}, {"k": "li", "t": "breaking changes,"}, {"k": "li", "t": "known issues,"}, {"k": "li", "t": "deployment steps,"}, {"k": "li", "t": "and references to related work items or tickets."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 4, "q": "How can you document API changes as part of a release process?", "a": [{"k": "p", "t": "Integrate API documentation tools like Swagger or OpenAPI in the CI/CD pipeline to generate and update API reference docs. Link or embed updated API docs in the release notes for visibility."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 5, "q": "How do you configure and publish release documentation using CI/CD pipelines?", "a": [{"k": "p", "t": "Add tasks in the pipeline to generate documentation artifacts, such as markdown or HTML files, then publish them to a wiki, repository, or shared location. Use pipeline variables to version and label documentation with each release."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 6, "q": "What are best practices for maintaining accurate release documentation?", "a": [{"k": "li", "t": "Update documentation as part of each deployment"}, {"k": "li", "t": "Review release notes during pull requests"}, {"k": "li", "t": "Automate as much as possible"}, {"k": "li", "t": "Assign ownership for validation"}, {"k": "li", "t": "Ensure docs reflect actual release content"}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 7, "q": "How do you manage versioning in release documentation?", "a": [{"k": "p", "t": "Organize documentation by release version (e.g., folders or tags), include version numbers in doc titles, and maintain a changelog or index for easy navigation across versions."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 8, "q": "How can you automate API documentation generation and integration into release notes?", "a": [{"k": "p", "t": "Use tools like Swagger/OpenAPI with build tasks to generate API docs on each build. Automatically atach or link these docs in release notes through pipeline scripts or templates."}]}, {"sub": "1.3.2", "st": "Configure Release Documentation", "n": 9, "q": "How do you provide access to release documentation for different stakeholders?", "a": [{"k": "li", "t": "Publish docs to accessible platforms such as project wikis, shared repos, or internal portals."}, {"k": "li", "t": "Set permissions to control access based on roles (e.g., read-only or writing)."}]}, {"sub": "1.3. ommit message standards (e.g., Conventional Commits)"}, {"k": "li", "t": "Use a changelog tool (e.g., conventional-changelog) in CI or manually"}, {"k": "li", "t": "Tool scans Git history since last tag/release"}, {"k": "li", "t": "Generates or updates changelog file with categorized changes"}]}, {"sub": "1.3.3", "st": "Automate documentation from Git history", "n": 5, "q": "How do you configure a CI pipeline to automate changelog generation?", "a": [{"k": "li", "t": "Add a changelog generation step (using tools like conventional-changelog, release-drafter) in your CI workflow (GitHub Actions, Azure Pipelines, etc.)"}, {"k": "li", "t": "Trigger the step on events like merges to main or new release tags"}, {"k": "li", "t": "Output or commit the changelog file as an artifact or into the repo"}]}, {"sub": "1.3.3", "st": "Automate documentation from Git history", "n": 6, "q": "What is the role of commit message standards in documentation automation?", "a": [{"k": "li", "t": "Commit message standards enable automated tools to identify the type and scope of changes"}, {"k": "li", "t": "Structured messages allow accurate and meaningful release notes and changelogs"}, {"k": "li", "t": "Inconsistent messages lead to incomplete or misleading documentation"}]}, {"sub": "1.3.3", "st": "Automate documentation from Git history", "n": 7, "q": "How can release notes be generated automatically from pull requests or commits?", "a": [{"k": "li", "t": "Use tools (e.g., release-drafter, GitHub release notes) that scan merged pull requests or commits"}, {"k": "li", "t": "Configure templates to map PR titles or commit messages to release note sections"}, {"k": "li", "t": "Trigger note generation on release/tag creation events in CI"}]}, {"sub": "1.3.3", "st": "Automate documentation from Git history", "n": 8, "q": "Which GitHub Actions are commonly used for automated documentation?", "a": [{"k": "li", "t": "release-drafter/release-drafter"}, {"k": "li", "t": "conventional-changelog/standard-version"}]}, {"sub": "1.3.3", "st": "Automate documentation from Git history", "n": 9, "q": "How can you integrate auto-generated documentation with project wikis or Markdown files?", "a": [{"k": "li", "t": "Output changelog or release notes to a Markdown file (e.g., CHANGELOG.md)"}, {"k": "li", "t": "Commit the file to the repo so it appears in project docs"}, {"k": "li", "t": "Use CI to sync the content into wiki pages or documentation sites"}]}, {"sub": "1.3.3", "st": "Automate documentation from Git history", "n": 10, "q": "What are best practices for maintaining accuracy in automated documentation?", "a": [{"k": "li", "t": "Enforce strict commit and PR message conventions"}, {"k": "li", "t": "Review generated docs as part of the release process"}, {"k": "li", "t": "Automate generation as part of CI for consistency"}, {"k": "li", "t": "Regularly update automation tooling and templates"}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 1, "q": "What is a webhook and how is it used in DevOps integrations?", "a": [{"k": "p", "t": "A webhook is an HTTP callback that notifies external services about specific events (e.g., pushes, PRs). In DevOps, webhooks automate integrations, trigger workflows, and synchronize data across systems."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 2, "q": "How do you configure a webhook in GitHub or Azure DevOps?", "a": [{"k": "p", "t": "In GitHub: Go to repo Settings → Webhooks → Add webhook → Enter payload URL, events, and secret. In Azure DevOps: Project Settings → Service Hooks → Create Subscription → Select service and events."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 3, "q": "What events can trigger webhooks in GitHub and Azure DevOps?", "a": [{"k": "p", "t": "Common triggers: push, pull request, release, issue, build completion, work item updated, code review events."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 4, "q": "How do you integrate GitHub with Azure Boards?", "a": [{"k": "p", "t": "Install Azure Boards GitHub App in repo(s), connect organization, link commits/PRs with work items using syntax (e.g., AB#123), and enable automatic updates."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 5, "q": "What information can be synchronized between GitHub and Azure Boards?", "a": [{"k": "p", "t": "PRs, commits, and linked issues can update Azure Boards work items (state, comments, links). Work items can reflect code changes."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 6, "q": "How do you integrate Azure DevOps or GitHub with Microsoft Teams?", "a": [{"k": "p", "t": "Use the Azure DevOps or GitHub Teams app. Configure connectors or subscriptions to post updates on builds, PRs, or work items to Teams channels."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 7, "q": "What are best practices for managing webhook security?", "a": [{"k": "p", "t": "Use HTTPS URLs, validate payload signatures (e.g., X-Hub-Signature), keep secrets confidential, and limit webhook permissions to only required events."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 8, "q": "How can you filter or restrict which events trigger integrations?", "a": [{"k": "p", "t": "Configure only specific event types in webhook or service hook settngs. Use filters (e.g., branch, file path) and conditions in automation workflows."}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 9, "q": "How do you monitor or troubleshoot webhook and integration delivery?", "a": [{"k": "p", "t": "Check webhook delivery logs in GitHub/Azure DevOps. Use"}, {"k": "li", "t": "Status codes"}, {"k": "li", "t": "Request/response details"}, {"k": "li", "t": "Set up retry policies for failures"}]}, {"sub": "1.3.4", "st": "Integrate using webhooks, GitHub/Azure Boards, Teams", "n": 10, "q": "What are common use cases for combining these integrations in DevOps workflows?", "a": [{"k": "step", "t": "1. Automated notifications (Teams)"}, {"k": "step", "t": "1. Linking code changes to work items (Azure Boards)"}, {"k": "step", "t": "2. Triggering CI/CD on PR/merge"}, {"k": "step", "t": "3. Automating release processes"}, {"k": "step", "t": "4. Synchronizing incident response"}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 1, "q": "What are the core differences between trunk-based, feature, and release branch strategies?", "a": [{"k": "li", "t": "Trunk-based uses a single main branch with frequent merges"}, {"k": "li", "t": "Feature branching uses short-lived branches for each feature"}, {"k": "li", "t": "Release branching creates dedicated branches for release preparation and hotfixes"}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 2, "q": "When should you use trunk-based development in a DevOps project?", "a": [{"k": "p", "t": "Use trunk-based"}, {"k": "li", "t": "when you require rapid delivery,"}, {"k": "li", "t": "frequent integration,"}, {"k": "li", "t": "minimal merge conflicts,"}, {"k": "li", "t": "and a strong focus on CI/CD automation."}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 3, "q": "What are the benefits and risks of using long-lived feature branches?", "a": [{"k": "p", "t": "Benefits:"}, {"k": "li", "t": "Isolated development"}, {"k": "li", "t": "Reduced integration risk per feature Risks:"}, {"k": "li", "t": "Increased merge conflicts"}, {"k": "li", "t": "Stale code"}, {"k": "li", "t": "Delayed integration"}, {"k": "li", "t": "Harder CI/CD automation"}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 4, "q": "How do you implement a release branch strategy in Azure DevOps or GitHub?", "a": [{"k": "step", "t": "1. Create a release branch from main"}, {"k": "step", "t": "2. Stabilize code"}, {"k": "step", "t": "3. Apply bug fixes or hotfixes"}, {"k": "step", "t": "4. Merge critical changes back to main and other relevant branches"}, {"k": "step", "t": "5. Use branch policies for quality gates"}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 5, "q": "How do branch strategies impact CI/CD pipeline design?", "a": [{"k": "p", "t": "Branch strategies define triggers for builds, tests, and deployments. For example, main/trunk triggers production builds; feature branches may trigger only CI builds; release branches may have custom deployment pipelines."}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 6, "q": "What policies should be applied to branches for quality and security?", "a": [{"k": "p", "t": "Require pull request reviews, enforce status checks, restrict direct pushes, enable branch protection, and mandate code scanning for critical branches."}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 7, "q": "How do you manage hotfixes in each branch strategy?", "a": [{"k": "li", "t": "Trunk-based: commit hotfix directly to main, deploy, then merge with ongoing work."}, {"k": "li", "t": "Feature: Apply hotfix to main, rebase feature branches if needed."}, {"k": "li", "t": "Release: Apply hotfix to release branch and main, then merge changes as needed."}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 8, "q": "What is the role of pull requests in trunk-based vs. feature branch workflows?", "a": [{"k": "li", "t": "In trunk-based, PRs are typically short-lived and merged quickly."}, {"k": "li", "t": "In feature branch workflows, PRs are used to review isolated features and may be open longer, increasing merge complexity."}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 9, "q": "How do you handle versioning and tagging in release branch strategies?", "a": [{"k": "li", "t": "Use tags for releases (e.g., v1.0.0) on release branches;"}, {"k": "li", "t": "Increment version numbers with each release or hotfix;"}, {"k": "li", "t": "Track production deployments via tags."}]}, {"sub": "2.1.1", "st": "Branch strategies: trunk-based, feature, release", "n": 10, "q": "What are best practices for merging and resolving conflicts across branch strategies?", "a": [{"k": "li", "t": "Integrate frequently to main"}, {"k": "li", "t": "Rebase instead of merge where possible"}, {"k": "li", "t": "Resolve conflicts early"}, {"k": "li", "t": "Vommunicate changes"}, {"k": "li", "t": "Automate conflict detection via CI pipelines"}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 1, "q": "What is a pull request (PR) workflow and why is it important in DevOps?", "a": [{"k": "p", "t": "A PR workflow is a structured process to review, validate, and merge code changes. It ensures code quality, security, and team collaboration before integration."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 2, "q": "How do you enforce branch policies for pull requests in Azure DevOps and GitHub?", "a": [{"k": "p", "t": "Configure branch protection rules (GitHub) or branch policies (Azure DevOps) to require"}, {"k": "li", "t": "PR reviews,"}, {"k": "li", "t": "status checks,"}, {"k": "li", "t": "and other controls before merging."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 3, "q": "What types of status checks can be required for a PR?", "a": [{"k": "p", "t": "Common checks include"}, {"k": "li", "t": "successful CI builds,"}, {"k": "li", "t": "code coverage thresholds,"}, {"k": "li", "t": "security scans,"}, {"k": "li", "t": "and passing automated tests."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 4, "q": "How can you require code review approvals before merging a PR?", "a": [{"k": "p", "t": "Set branch protection to"}, {"k": "li", "t": "require one or more reviewer approvals,"}, {"k": "li", "t": "optionally require review from code owners or specific teams."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 5, "q": "How do you prevent direct pushes to protected branches?", "a": [{"k": "p", "t": "Enable branch protection rules or policies that restrict who can push and require all changes to go through PRs."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 6, "q": "What are best practices for PR size and review process?", "a": [{"k": "li", "t": "Keep PRs small and focused,"}, {"k": "li", "t": "include clear descriptions,"}, {"k": "li", "t": "require meaningful reviews,"}, {"k": "li", "t": "and use checklists to ensure standards."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 7, "q": "How do you automate checks and enforce policy compliance in PRs?", "a": [{"k": "li", "t": "Integrate CI/CD pipelines,"}, {"k": "li", "t": "configure required status checks,"}, {"k": "li", "t": "use automated code analysis,"}, {"k": "li", "t": "and enforce policies as blocking conditions for merging."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 8, "q": "How can you enforce security and compliance checks in PR workflows?", "a": [{"k": "p", "t": "Add automated security scanners (e.g., for secrets, dependencies), require results as passing status checks before merge."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 9, "q": "What is auto-complete or auto-merge in pull request workflows?", "a": [{"k": "p", "t": "It allows PRs to be merged automatically when all policies and checks are satisfied, reducing manual intervention and wait time."}]}, {"sub": "2.1.2", "st": "Pull request workflows with policies", "n": 10, "q": "How do you configure and use code owner policies in PR workflows?", "a": [{"k": "p", "t": "Define a CODEOWNERS file specifying responsible individuals or teams for files/folders. Require code owner review in branch protection settngs for critical code areas."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 1, "q": "What are branch protection rules and why are they critical in DevOps workflows?", "a": [{"k": "p", "t": "Branch protection rules enforce"}, {"k": "li", "t": "required checks,"}, {"k": "li", "t": "reviews,"}, {"k": "li", "t": "and restrictions on branches, preventing unauthorized or unsafe changes and ensuring code quality and stability."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 2, "q": "How do you configure branch protection in GitHub and Azure DevOps?", "a": [{"k": "p", "t": "In GitHub, go to Repository Settings > Branches > Add rule. In Azure DevOps, navigate to Project Settings > Repositories > Branches > Add policy to the desired branch."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 3, "q": "What types of merge restrictions can be enforced using branch protection policies?", "a": [{"k": "p", "t": "You can require"}, {"k": "li", "t": "pull request reviews,"}, {"k": "li", "t": "passing status checks,"}, {"k": "li", "t": "code owner approval,"}, {"k": "li", "t": "no unresolved conversations,"}, {"k": "li", "t": "and restrict merges to certain users or teams."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 4, "q": "How can you require status checks before allowing merges?", "a": [{"k": "p", "t": "Set required status checks in branch protection so PRs can only merge if defined CI jobs (build, test, security scan) succeed."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 5, "q": "How do you restrict who can push or merge to protected branches?", "a": [{"k": "p", "t": "Configure branch protection or security policies to allow pushes or merges only from specified users, teams, or service accounts."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 6, "q": "What is the purpose of requiring signed commits or commit signatures?", "a": [{"k": "p", "t": "Requiring signed commits verifies the identity of commit authors, helping prevent unauthorized or untraceable changes."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 7, "q": "How do you enforce code owner approvals in branch protection?", "a": [{"k": "p", "t": "Define a CODEOWNERS file in the repo and require code owner approval via branch protection settngs for changes to specific files/paths."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 8, "q": "How can you enforce linear history and prevent force-pushes?", "a": [{"k": "p", "t": "Enable \"Require linear history\" and \"Prevent force pushes\" options in branch protection to maintain a clean commit history and prevent data loss."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 9, "q": "What is the impact of branch protection on CI/CD automation?", "a": [{"k": "p", "t": "Branch protection ensures all code passing through CI/CD meets quality gates, but may require automation accounts or bots to be explicitly permited for merges or status check reporting."}]}, {"sub": "2.1.3", "st": "Branch protections and merge restrictions", "n": 10, "q": "What best practices should be followed for branch protections and merge restrictions?", "a": [{"k": "li", "t": "Apply protections to main/release branches"}, {"k": "li", "t": "Keep required checks relevant"}, {"k": "li", "t": "Regularly review permissions"}, {"k": "li", "t": "Require at least one reviewer"}, {"k": "li", "t": "Avoid over-restriction that blocks productivity"}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 1, "q": "What is Git LFS and why is it needed in source control?", "a": [{"k": "p", "t": "Git LFS (Large File Storage) is an extension that replaces large files (like binaries, media, datasets) in Git with lightweight pointers, storing the actual files in external storage. It's needed because Git is inefficient with large or frequently changing binary files."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 2, "q": "How does Git LFS work under the hood?", "a": [{"k": "p", "t": "When you commit a tracked large file, Git LFS stores a pointer in the repo and uploads the actual content to a remote LFS storage. During checkout, LFS downloads the actual files on demand."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 3, "q": "What types of files should be managed using Git LFS?", "a": [{"k": "p", "t": "Large binary files, media assets (e.g., images, videos), archives, datasets, or any files that are large or change frequently, and are not efficiently diffed or compressed by Git."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 4, "q": "How do you install and initialize Git LFS in a repository?", "a": [{"k": "p", "t": "Install Git LFS with: git lfs install Then track file types: git lfs track \"*.psd\" Commit the .gitatributes file and use Git as normal."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 5, "q": "How do you track files with Git LFS and what is the basic workflow?", "a": [{"k": "p", "t": "Track file paterns with git lfs track, add files, commit, and push as usual. LFS replaces tracked files with pointers in the repo and uploads file contents to LFS storage during push."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 6, "q": "How does storage and bandwidth quota work with Git LFS?", "a": [{"k": "p", "t": "Git LFS hosting providers (e.g., GitHub, Azure DevOps) enforce storage and bandwidth limits. Exceeding quota can block uploads or downloads until more space or bandwidth is purchased or usage is reduced."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 7, "q": "What are key differences between Git LFS and git-fat?", "a": [{"k": "p", "t": "Git LFS is widely supported, natively integrated with GitHub/Azure DevOps, and stores large files externally. git-fat is older, works with custom backends, and is less integrated into cloud providers."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 8, "q": "How do you migrate existing large files in a repository to Git LFS?", "a": [{"k": "p", "t": "Use git lfs migrate import --include=\"*.filetype\" to convert files to LFS tracking, rewrite history as needed, and force-push updated branches. Always back up before migrating."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 9, "q": "What are best practices for managing large files in Azure DevOps or GitHub using LFS?", "a": [{"k": "li", "t": "Track only necessary files,"}, {"k": "li", "t": "use .gitatributes to specify file paterns,"}, {"k": "li", "t": "monitor LFS quota,"}, {"k": "li", "t": "educate contributors,"}, {"k": "li", "t": "and avoid committng large files directly to Git."}]}, {"sub": "2.2.1", "st": "Manage large Files (GIT LFS, git-fat)", "n": 10, "q": "How do you handle permissions and security for large files stored in Git LFS?", "a": [{"k": "p", "t": "Permissions follow the repository’s access control (GitHub/Azure DevOps). To protect sensitive files,"}, {"k": "li", "t": "restrict repo access,"}, {"k": "li", "t": "use branch protections,"}, {"k": "li", "t": "and regularly audit who can push/pull LFS content."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 1, "q": "What challenges occur as Git repositories grow in size and activity?", "a": [{"k": "p", "t": "Large repos can cause slow clone, fetch, and checkout operations, increased storage, network costs, and degraded performance for CI/CD and contributors."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 2, "q": "What is Scalar and how does it help with large repositories?", "a": [{"k": "p", "t": "Scalar is a Microsoft tool that optimizes very large monorepos by improving Git's handling of large working trees, accelerating commands like status and checkout, and enabling virtualized file systems."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 3, "q": "How do partial clones and sparse-checkout help optimize scaling?", "a": [{"k": "p", "t": "Partial clones allow downloading only required objects. Sparse-checkout enables working with a subset of the repo, reducing disk usage and improving performance."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 4, "q": "How can cross-repository sharing reduce duplication and improve efficiency?", "a": [{"k": "p", "t": "Cross-repo sharing (submodules, subtrees, or package feeds) allows teams to reuse code/assets across projects without duplicating large files or code, minimizing storage and bandwidth usage."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 5, "q": "What are best practices for structuring large monorepos?", "a": [{"k": "li", "t": "Organize by logical boundaries"}, {"k": "li", "t": "Use clear folder structures"}, {"k": "li", "t": "Minimize large binaries"}, {"k": "li", "t": "Automate code ownership"}, {"k": "li", "t": "Use sparse-checkout for focused workflows"}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 6, "q": "How do you monitor and maintain repository performance at scale?", "a": [{"k": "p", "t": "Regularly review repository size, commit history, and object count. Use monitoring tools and Git analytics to spot performance botlenecks and take action early."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 7, "q": "How do you clean up and archive old branches and tags efficiently?", "a": [{"k": "p", "t": "Use git branch -d/-D for branches, git tag -d for tags, and prune remote references. Archive or delete stale branches and tags periodically to keep the repo clean."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 8, "q": "What strategies exist to optimize clone and fetch performance in large repos?", "a": [{"k": "li", "t": "Use shallow clones (git clone --depth),"}, {"k": "li", "t": "partial clones,"}, {"k": "li", "t": "sparse-checkout,"}, {"k": "li", "t": "and avoid cloning unnecessary history or content."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 9, "q": "How does Azure DevOps or GitHub handle scaling for large enterprise repositories?", "a": [{"k": "p", "t": "Both platforms offer high-availability storage, optimized network delivery (e.g., CDN), LFS support, Scalar, and monitoring for large repos. GitHub also supports monorepo scaling features."}]}, {"sub": "2.2.2", "st": "Optimize scaling", "n": 10, "q": "What tools or commands are used to analyze and reduce repository size?", "a": [{"k": "li", "t": "git-sizer"}, {"k": "li", "t": "git count-objects"}, {"k": "li", "t": "git gc"}, {"k": "li", "t": "git filter-repo help measure, clean, and reduce repo size. Remove large files or history as needed for optimization."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 1, "q": "What are the permission levels available in Azure Repos and GitHub repositories?", "a": [{"k": "p", "t": "Azure Repos:"}, {"k": "li", "t": "Reader"}, {"k": "li", "t": "Contributor"}, {"k": "li", "t": "Branch Creator"}, {"k": "li", "t": "Project Administrator"}, {"k": "li", "t": "Custom GitHub:"}, {"k": "li", "t": "Read"}, {"k": "li", "t": "Triage"}, {"k": "li", "t": "Write"}, {"k": "li", "t": "Maintain"}, {"k": "li", "t": "Admin"}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 2, "q": "How do you assign repository permissions in Azure DevOps?", "a": [{"k": "p", "t": "Go to Project Settings → Repositories → Select repository → Security → Add users/groups → Assign roles or explicit permissions."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 3, "q": "How are permissions managed in GitHub (users, teams, roles)?", "a": [{"k": "p", "t": "Assign roles at repository or organization level. Use teams to group users. Set roles for users or teams via repository Settngs → Manage access."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 4, "q": "What is the difference between repository, branch, and object-level permissions?", "a": [{"k": "p", "t": "Repository: Control access to entire repo. Branch: Restrict actions (push, merge) on specific branches. Object: Limit access to individual files/paths (rare, typically via code owners)."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 5, "q": "How do you use branch protection rules to restrict actions?", "a": [{"k": "p", "t": "In Settings → Branches, add branch protection rules (e.g., require PR reviews, restrict push, enforce status checks, prevent force pushes or deletions)."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 6, "q": "What are best practices for granting repository permissions?", "a": [{"k": "p", "t": "Grant least privilege required, use teams/groups, avoid Admin unless necessary, periodically review access."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 7, "q": "How do you configure repository tags in Git and Azure DevOps?", "a": [{"k": "p", "t": "Create: git tag v1.0 (local), git push origin v1.0 (remote). Azure DevOps: Use web UI or Git CLI; tags sync with repository."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 8, "q": "What are the use cases for tags in source control?", "a": [{"k": "p", "t": "Mark"}, {"k": "li", "t": "releases,"}, {"k": "li", "t": "important milestones,"}, {"k": "li", "t": "stable builds,"}, {"k": "li", "t": "deployment points."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 9, "q": "How do you protect or restrict tag creation and deletion?", "a": [{"k": "p", "t": "GitHub: Use branch protection for refs/tags/* with GitHub Enterprise. Azure DevOps: Restrict who can create/delete tags via repository security settngs."}]}, {"sub": "2.2.3", "st": "Configure permissions, tags", "n": 10, "q": "How can you audit or review permission and tag changes in repositories?", "a": [{"k": "p", "t": "Azure DevOps: Use Audit Logs (Organization settngs). GitHub: Use Audit Log in Enterprise/Organization settngs; review git history for tag changes via git log -- tags."}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 1, "q": "How do you recover a deleted branch in Git?", "a": [{"k": "p", "t": "Find the branch’s last commit hash with git reflog then recreate it: git checkout -b branch_name <commit_hash>"}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 2, "q": "How can you recover a deleted commit?", "a": [{"k": "p", "t": "Use git reflog to locate the commit hash, then checkout or branch from it: git checkout <commit_hash> or git branch <new_branch> <commit_hash>"}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 3, "q": "What command is used to undo local changes in a working directory?", "a": [{"k": "p", "t": "git checkout -- <file> (undo changes in file) or git restore <file> (recommended in newer Git)."}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 4, "q": "How do you permanently remove a file from a Git repository’s history?", "a": [{"k": "p", "t": "Use"}, {"k": "li", "t": "git filter-branch (legacy)"}, {"k": "li", "t": "git filter-repo (preferred) to rewrite history and remove the file, then force-push: git filter-repo --path <file> --invert-paths"}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 5, "q": "How do you use git revert and git reset to undo changes?", "a": [{"k": "p", "t": "git revert <commit> creates a new commit that undoes changes. git reset --hard <commit> moves HEAD and branch to a specific commit, discarding later commits (local use)."}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 6, "q": "How can you recover a file deleted in a previous commit?", "a": [{"k": "p", "t": "Find the commit where the file existed: git checkout <commit_hash> -- <file>"}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 7, "q": "What is the difference between git reflog and git log for recovery?", "a": [{"k": "p", "t": "git log shows the commit history; git reflog records all HEAD movements (including deleted branches/commits), useful for recovery."}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 8, "q": "How do you use git cherry-pick to restore changes from another branch?", "a": [{"k": "p", "t": "git cherry-pick <commit_hash> applies a specific commit from another branch onto the current branch."}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 9, "q": "How do you remove sensitive data (e.g., passwords) from commit history?", "a": [{"k": "p", "t": "Use git filter-repo (or filter-branch) to remove secrets, then force-push to rewrite remote history."}]}, {"sub": "2.2.4", "st": "Recover/remove data with Git commands", "n": 10, "q": "How can you prevent accidental data loss when cleaning up branches or commits?", "a": [{"k": "li", "t": "Always back up with git branch <backup> <ref> or create tags before destructive operations"}, {"k": "li", "t": "Review with git reflog if needed."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 1, "q": "What are GitHub Packages and Azure Artifacts, and how do they differ?", "a": [{"k": "li", "t": "GitHub Packages is a package hosting service fully integrated with GitHub repositories, supporting multiple package types and commonly used for GitHub-based projects."}, {"k": "li", "t": "Azure Artifacts is part of Azure DevOps, offering integrated package feeds for teams, granular permissions, and support for upstream sources."}, {"k": "li", "t": "Key difference: Azure Artifacts is tightly integrated with Azure DevOps pipelines and boards, while GitHub Packages is GitHub-centric."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 2, "q": "How do you publish a package to GitHub Packages?", "a": [{"k": "li", "t": "Authenticate with a personal access token or GitHub Actions,"}, {"k": "li", "t": "configure your package manager with your GitHub repository URL,"}, {"k": "li", "t": "and use the package manager’s publish command (e.g., npm publish, dotnet nuget push, mvn deploy)."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 3, "q": "How do you publish a package to Azure Artifacts?", "a": [{"k": "li", "t": "Authenticate with Azure Artifacts using a personal access token or Azure CLI,"}, {"k": "li", "t": "add the Azure Artifacts feed as a source to your package manager,"}, {"k": "li", "t": "and use the relevant publish command (e.g., dotnet nuget push, npm publish, twine upload for Python)."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 4, "q": "How do you authenticate to GitHub Packages and Azure Artifacts?", "a": [{"k": "li", "t": "For GitHub Packages, use a personal access token with write:packages scope or GitHub Actions’ built-in GITHUB_TOKEN."}, {"k": "li", "t": "For Azure Artifacts, authenticate with a personal access token or Azure CLI (az artifacts universal publish/login), or with build pipeline credentials."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 5, "q": "What package types are supported by GitHub Packages and Azure Artifacts?", "a": [{"k": "li", "t": "GitHub Packages supports npm, Maven, NuGet, Docker, RubyGems, and Apache Ivy."}, {"k": "li", "t": "Azure Artifacts supports npm, NuGet, Maven, Python, and Universal Packages."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 6, "q": "How do you configure a package feed in Azure Artifacts?", "a": [{"k": "p", "t": "In Azure DevOps, go to Artifacts > New Feed, name the feed, set visibility (organization/private), optionally add upstream sources, and save. Configure your package manager (e.g., nuget.config, .npmrc) to use the feed’s URL."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 7, "q": "How do you use a package from GitHub Packages in a CI/CD pipeline?", "a": [{"k": "step", "t": "1. Add authentication steps to the pipeline (set up GITHUB_TOKEN or PAT)"}, {"k": "step", "t": "2. Configure the package manager with the GitHub Packages registry URL"}, {"k": "step", "t": "3. Install the package as usual in your pipeline steps"}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 8, "q": "How do you control access and permissions for packages in GitHub Packages and Azure Artifacts?", "a": [{"k": "li", "t": "In GitHub Packages, permissions are based on repository access and repository roles."}, {"k": "li", "t": "In Azure Artifacts, use feed-level permissions to grant/restrict to users, groups, or pipelines."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 9, "q": "How do you manage package retention and cleanup in Azure Artifacts?", "a": [{"k": "p", "t": "Configure retention policies in Azure Artifacts to automatically delete older or unlisted package versions. Go to Artifacts > Feed > Settings > Retention policies, and define rules for how many versions to keep and for how long."}]}, {"sub": "2.3.1", "st": "Tools: Github Packages, Azure Artifacts", "n": 10, "q": "How do you configure upstream sources in Azure Artifacts?", "a": [{"k": "p", "t": "In the feed settngs, add upstream sources to connect your Azure Artifacts feed to public repositories (e.g., npmjs.com, nuget.org) or other Azure Artifacts feeds. This allows packages from upstream sources to be cached and consumed via your feed."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 1, "q": "What is a feed in Azure Artifacts, and what is its purpose?", "a": [{"k": "p", "t": "A feed in Azure Artifacts is a repository for storing and sharing packages (e.g., NuGet, npm, Maven) within your organization or projects. It enables versioned, centralized package management for CI/CD."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 2, "q": "How do you create a feed in Azure Artifacts?", "a": [{"k": "p", "t": "Navigate to Azure DevOps > Artifacts > New Feed, provide a name, set visibility (organization or project), configure permissions, and create the feed."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 3, "q": "What are views in Azure Artifacts, and why are they used?", "a": [{"k": "p", "t": "Views are logical partitions within a feed used to separate packages by quality or environment (e.g., development, prerelease, release). They help control which package versions are available for different stages of the pipeline."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 4, "q": "How do you create and manage views in Azure Artifacts?", "a": [{"k": "p", "t": "By default, feeds include predefined views (@local, @prerelease, @release). You can create custom views in the feed settngs and manage them by promoting or filtering packages."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 5, "q": "How do you promote a package to a different view?", "a": [{"k": "p", "t": "In Azure DevOps, go to Artifacts > Feed > Packages, select a package version, choose Promote, and select the target view (e.g., promote from @prerelease to @release)."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 6, "q": "How do you configure a package manager to use a specific feed or view?", "a": [{"k": "p", "t": "Update your package manager config (e.g., nuget.config, .npmrc) with the feed URL and append the view (e.g., htps://pkgs.dev.azure.com/org/project/_packaging/feed/view/npm/registry/). Authenticate as required."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 7, "q": "How do you control access to feeds and views?", "a": [{"k": "p", "t": "Manage access using Azure DevOps security groups and feed permissions. Grant users or pipelines access at the feed or view level with roles like Reader, Contributor, or Owner."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 8, "q": "What are the default views in Azure Artifacts and their typical use?", "a": [{"k": "li", "t": "@local (default, all packages)"}, {"k": "li", "t": "@prerelease (pre-production/testing)"}, {"k": "li", "t": "@release (production-approved) Use these to stage packages through different lifecycle phases."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 9, "q": "How can you connect external sources (e.g., NuGet.org) to your feed?", "a": [{"k": "p", "t": "Add upstream sources in feed settngs to cache packages from public repositories like NuGet.org or npmjs.com, making them available in your feed."}]}, {"sub": "2.3.2", "st": "Configure feeds/views for packages", "n": 10, "q": "How do you clean up or delete feeds and views?", "a": [{"k": "p", "t": "To delete a feed, go to Azure DevOps > Artifacts > Manage Feeds, select the feed, and choose Delete. Views can be managed or deleted from feed settngs if not default views; packages can also be deleted or unlisted as needed."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 1, "q": "What is Semantic Versioning (SemVer) and what are its components?", "a": [{"k": "p", "t": "SemVer is a versioning scheme with three numeric components: MAJOR.MINOR.PATCH (e.g., 2.1.3)."}, {"k": "li", "t": "MAJOR: Breaking changes"}, {"k": "li", "t": "MINOR: Backward-compatible features"}, {"k": "li", "t": "PATCH: Backward-compatible bug fixes"}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 2, "q": "What is Calendar Versioning (CalVer) and how is it structured?", "a": [{"k": "p", "t": "CalVer is a date-based versioning scheme, typically using formats like YYYY.MM or YY.MM.DD (e.g., 2024.06 or 24.06.05), representing the release date."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 3, "q": "When should you use SemVer versus CalVer?", "a": [{"k": "li", "t": "Use SemVer when precise tracking of breaking and backward-compatible changes is needed."}, {"k": "li", "t": "Use CalVer where the release schedule is more important than feature tracking."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 4, "q": "How do pre-release versions and build metadata work in SemVer?", "a": [{"k": "li", "t": "Pre-release versions use a hyphen and identifier (e.g., 1.2.0-beta)."}, {"k": "li", "t": "Build metadata uses a plus sign (e.g., 1.2.0+001)."}, {"k": "li", "t": "Pre-release versions are lower precedence than final releases."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 5, "q": "How can you implement SemVer in CI/CD pipelines?", "a": [{"k": "p", "t": "Automate version bumping based on commit messages or tags, validate version format, and update package files in the build pipeline before publishing artifacts."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 6, "q": "How do you implement CalVer in package versioning?", "a": [{"k": "p", "t": "Set the version number in build scripts or pipeline templates to the current date (e.g., using a variable or script to generate YYYY.MM.DD) during the build process."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 7, "q": "How does versioning affect dependency management?", "a": [{"k": "p", "t": "Correct versioning allows tools to resolve compatible dependencies, prevent breaking changes, and manage upgrades/downgrades reliably across services and packages."}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 8, "q": "How can you enforce versioning rules in Azure DevOps or GitHub pipelines?", "a": [{"k": "li", "t": "Add validation steps to CI/CD pipelines that check version format"}, {"k": "li", "t": "Enforce increment rules"}, {"k": "li", "t": "Reject builds if versioning is not compliant (using custom scripts or tasks)"}]}, {"sub": "2.3.3", "st": "Versioning strategies: SemVer, CalVer", "n": 9, "q": "What are best practi
